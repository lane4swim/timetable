name: GitHub Pages

# Veröffentlicht stundenplan.html als index.html auf GitHub Pages.
# Voraussetzung (einmalig): Settings → Pages → Build and deployment → Source: „GitHub Actions“.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur eine Veröffentlichung gleichzeitig; laufende werden nicht abgebrochen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    name: Prüfen und Seite bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Build aktuell, Testdaten aktuell, Kern-Tests grün – sonst keine Veröffentlichung
      - run: npm run pruefen
      - run: npm run pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  veroeffentlichen:
    name: Veröffentlichen
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
