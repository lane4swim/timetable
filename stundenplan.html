      if (ix.lehrkraftAbwesend(a.lehrkraft, datum)) melde('H13', `${n.lehrkraft(a.lehrkraft)} ist am ${datum} abwesend (Aufsicht ${wo})`, nur);
      if (!unterrichtetAm.has(S(a.lehrkraft, a.tag))) melde('H13', `${n.lehrkraft(a.lehrkraft)} hat am ${a.tag} keinen Unterricht, ist aber für ${wo} eingeteilt`, nur);
    });
    if (woche) {
      const jeLehrkraft = gruppiere(aufsichten, (a) => a.lehrkraft);
      for (const [l, idx] of jeLehrkraft) {
        const soll = ix.lehrkraefte.get(l)?.aufsichtenProWoche ?? 0;
        if (idx.length > soll) melde('H14', `${n.lehrkraft(l)} hat ${idx.length} Aufsichten (Aufsichtssoll ${soll})`, { aufsichten: idx });
      }
    }

    const nr = (r) => Number(r.slice(1));
    return verstoesse.sort((a, b) => nr(a.regel) - nr(b.regel));
  }

  /* ------------------------------ Hilfen ---------------------------------- */

  /** Gruppiert Indizes nach Schlüssel; `null` als Schlüssel wird übersprungen. */
  function gruppiere(liste, schluesselFn) {
    const m = new Map();
    liste.forEach((e, i) => {
      const k = schluesselFn(e);
      if (k === null || k === undefined) return;
      if (!m.has(k)) m.set(k, []);
      m.get(k).push(i);
    });
    return m;
  }

  /** Zerlegt Stundennummern in Folgen aufeinanderfolgender Stunden. */
  function laeufe(nummern) {
    const sortiert = [...new Set(nummern)].sort((a, b) => a - b);
    const ergebnis = [];
    for (const x of sortiert) {
      const letzte = ergebnis[ergebnis.length - 1];
      if (letzte && x === letzte[letzte.length - 1] + 1) letzte.push(x);
      else ergebnis.push([x]);
    }
    return ergebnis;
  }

  /**
   * Belegte Zeitslots je Lehrkraft (Haupt, Zweit, Aufsicht, Doppelbetreuung
   * zählt je Slot einmal). Grundlage für H7, H11, K5, W2, W7, W8.
   * @returns {Map<string, {slots: Set<string>, zweit: Set<string>, idx: number[], zweitIdx: number[], proTag: Map<string, Set<number>>}>}
   */
  function lehrkraftStunden(stunden) {
    const m = new Map();
    stunden.forEach((s, i) => {
      if (!Index.STATUS.belegt(s)) return;
      (s.lehrkraefte || []).forEach((l, rolle) => {
        if (!m.has(l)) m.set(l, { slots: new Set(), zweit: new Set(), idx: [], zweitIdx: [], proTag: new Map() });
        const e = m.get(l);
        const slot = S(s.tag, s.stunde);
        e.slots.add(slot);
        e.idx.push(i);
        if (rolle > 0) { e.zweit.add(slot); e.zweitIdx.push(i); }
        if (!e.proTag.has(s.tag)) e.proTag.set(s.tag, new Set());
        e.proTag.get(s.tag).add(s.stunde);
      });
    });
    return m;
  }

  /** Anzahl Verstöße je Regel, z. B. { H1: 2, H12: 1 }. */
  function zaehle(verstoesse) {
    const m = {};
    for (const v of verstoesse) m[v.regel] = (m[v.regel] || 0) + 1;
    return m;
  }

  return { TITEL, pruefeHart, zaehle, lehrkraftStunden, laeufe, gruppiere };
})();

/* ---- src/kern/50-kosten.js ---- */
/* ==========================================================================
 * Modul Kosten
 * Bewertet einen Plan mit dem lexikografischen Kostenvektor
 * (K1, K1A, K2, K3, K4, K5, K6) aus Spezifikation §3. K6 ist die gewichtete
 * Summe der weichen Regeln W1–W12 (§4). Jeder Kostenanteil wird mit
 * Einzelposten begründet (§9 Nachvollziehbarkeit).
 * ========================================================================== */
const Kosten = (() => {
  'use strict';

  const ZIELE = Object.freeze(['K1', 'K1A', 'K2', 'K3', 'K4', 'K5', 'K6']);
  const ZIELTITEL = Object.freeze({
    K1: 'Unterrichtsausfall',
    K1A: 'unbesetzte Pausenaufsichten',
    K2: 'Stunden nicht durch die eigene Lehrkraft',
    K3: 'fachfremd erteilte Stunden',
    K4: 'Doppelbetreuung und Aufteilung',
    K5: 'ungenutztes Kontingent trotz möglicher Zweitbesetzung',
    K6: 'Planqualität (weiche Regeln)',
  });
  const WEICH = Object.freeze(['W1', 'W2', 'W3', 'W4', 'W5', 'W6', 'W7', 'W8', 'W9', 'W10', 'W11', 'W12']);
  const WTITEL = Object.freeze({
    W1: 'kompakter Schultag der Klassen',
    W2: 'Leerstunden bei Lehrkräften',
    W3: 'Doppelstunden wie gewünscht',
    W4: 'Hauptfächer vormittags, Sport nicht direkt nach der Pause',
    W5: 'gleichmäßige Verteilung eines Fachs',
    W6: 'wenige Raumwechsel, Heimatraum',
    W7: 'gleichmäßige Tageslast der Lehrkräfte',
    W8: 'Mindeststunden unterschritten',
    W9: 'Zweitbesetzung gezielt eingesetzt',
    W10: 'beständige Zweitbesetzung',
    W11: 'Aufsichtssoll erfüllt',
    W12: 'Aufsicht angrenzend an eigenen Unterricht',
  });

  const S = Index.schluessel;
  const rund = (x) => Math.round(x * 100) / 100;

  /**
   * @param {object} z Zustand
   * @param {{stunden?: object[], aufsichten?: object[]}} [plan] Standard: Regelplan
   * @param {{datum?: string, mitPosten?: boolean}} [optionen]
   *        datum: Tagesplan (Wochenziele K5, W7, W8, W11 entfallen)
   * @returns {{vektor: number[], ziele: object, weich: object}}
   */
  function bewerte(z, plan, optionen = {}) {
    const ix = Index.erstelle(z);
    const stunden = plan?.stunden ?? z.plan.regelplan;
    const aufsichten = plan?.aufsichten ?? z.plan.aufsichten;
    const woche = !optionen.datum;
    const mitPosten = optionen.mitPosten !== false;
    const n = ix.name;
    const e = ix.einstellungen;

    const ziele = Object.fromEntries(ZIELE.map((k) => [k, { titel: ZIELTITEL[k], wert: 0, posten: [] }]));
    const weich = Object.fromEntries(WEICH.map((w) => [w, { titel: WTITEL[w], anzahl: 0, gewicht: e.gewichte[w] ?? 0, beitrag: 0, posten: [] }]));
    const ziel = (k, menge, text) => {
      if (!menge) return;
      ziele[k].wert += menge;
      if (mitPosten) ziele[k].posten.push({ menge: rund(menge), text });
    };
    const w = (k, menge, text) => {
      if (!menge) return;
      weich[k].anzahl += menge;
      if (mitPosten) weich[k].posten.push({ menge: rund(menge), text });
    };

    const lehrer = Regeln.lehrkraftStunden(stunden);
    const proKlasseTag = Regeln.gruppiere(stunden, (s) => (Index.STATUS.belegt(s) ? S(s.klasse, s.tag) : null));
    const klassenSlot = new Set(stunden.filter(Index.STATUS.belegt).map((s) => S(s.tag, s.stunde)));

    /* ---------- K1: Unterrichtsausfall ---------- */
    const abgedeckt = new Map();
    for (const s of stunden) if (s.fach && Index.STATUS.abgedeckt(s)) abgedeckt.set(S(s.klasse, s.fach), (abgedeckt.get(S(s.klasse, s.fach)) || 0) + 1);
    for (const k of z.klassen) {
      for (const t of k.stundentafel) {
        const ist = abgedeckt.get(S(k.id, t.fach)) || 0;
        const fehlt = woche ? Math.max(0, t.stunden - ist) : 0;
        ziel('K1', fehlt, `${n.klasse(k.id)} ${n.fach(t.fach)}: ${fehlt} von ${t.stunden} Stunden fallen aus`);
      }
    }
    if (!woche) {
      // Im Tagesplan zählen ausdrücklich entfallene Stunden und Aufsichten
      for (const s of stunden) {
        if (!Index.STATUS.abgedeckt(s)) ziel('K1', 1, `${n.klasse(s.klasse)} ${n.slot(s.tag, s.stunde)} Stunde: ${s.status === 'aufsicht' ? 'nur Aufsicht' : 'entfällt'}`);
      }
    }

    /* ---------- K1A: unbesetzte Pausenaufsichten ---------- */
    const besetzt = new Map();
    for (const a of aufsichten) {
      const k = S(a.tag, a.vorStunde);
      if (!besetzt.has(k)) besetzt.set(k, new Set());
      besetzt.get(k).add(a.lehrkraft);
    }
    const tage = woche ? ix.tage : [...new Set(stunden.map((s) => s.tag))];
    for (const tag of tage) {
      for (const p of ix.pausen) {
        if (!p.aufsichten) continue;
        // Bedarf nur, wenn nach der Pause Schüler:innen da sind (Annahme: mindestens eine Klasse hat diese Stunde)
        if (!klassenSlot.has(S(tag, p.vorStunde))) continue;
        const fehlt = Math.max(0, p.aufsichten - (besetzt.get(S(tag, p.vorStunde))?.size || 0));
        ziel('K1A', fehlt, `${n.pause(tag, p.vorStunde)}: ${fehlt} von ${p.aufsichten} Aufsichten unbesetzt`);
      }
    }

    /* ---------- K2, K3, K4: je Stunde ---------- */
    for (const s of stunden) {
      const wo = `${n.klasse(s.klasse)} ${n.slot(s.tag, s.stunde)} Stunde ${n.fach(s.fach)}`;
      const haupt = s.lehrkraefte?.[0];
      if (haupt && s.fach && (Index.STATUS.fachunterricht(s) || s.status === 'doppeltBetreut')) {
        const zu = ix.zuordnungVon(s.klasse, s.fach);
        if (zu.haupt !== haupt && !zu.zweit.includes(haupt)) {
          const klasse = ix.klassen.get(s.klasse);
          const art = klasse?.klassenlehrkraft === haupt ? 'Klassenlehrkraft'
            : ix.lehrkraefteDerKlasse.get(s.klasse)?.has(haupt) ? 'Lehrkraft der Klasse'
              : ix.istQualifiziert(haupt, s.fach, klasse?.stufe) ? 'qualifizierte Lehrkraft' : 'Notfalleinsatz';
          ziel('K2', 1, `${wo}: ${n.lehrkraft(haupt)} (${art}) statt ${zu.haupt ? n.lehrkraft(zu.haupt) : 'ohne Festzuordnung'}`);
        }
      }
      if (haupt && s.fach && Index.STATUS.fachunterricht(s) && !ix.istQualifiziert(haupt, s.fach, ix.klassen.get(s.klasse)?.stufe)) {
        ziel('K3', 1, `${wo}: ${n.lehrkraft(haupt)} unterrichtet fachfremd`);
      }
      if (s.status === 'doppeltBetreut') ziel('K4', 1, `${wo}: Doppelbetreuung mit ${n.klasse(s.mitKlasse)}`);
      if (s.status === 'aufgeteilt') ziel('K4', e.gewichtAufteilung, `${wo}: Klasse aufgeteilt (Gewicht ${e.gewichtAufteilung})`);
    }

    /* ---------- K5: ungenutztes Kontingent trotz möglicher Zweitbesetzung ---------- */
    if (woche && e.zweitbesetzungErlaubt) {
      // Slots mit Unterricht, in denen noch eine Zweitbesetzung Platz hat (H10)
      const freiFuerZweit = new Set(stunden
        .filter((s) => Index.STATUS.fachunterricht(s) && (s.lehrkraefte?.length || 0) < e.maxLehrkraefteProKlasseUndSlot)
        .map((s) => S(s.tag, s.stunde)));
      for (const l of z.lehrkraefte) {
        const info = lehrer.get(l.id);
        const ist = info?.slots.size || 0;
        const luecke = Math.max(0, Math.min(l.sollStunden - ix.reserve(l), l.maxStunden) - ist);
        if (!luecke) continue;
        let moeglich = 0;
        for (const slot of freiFuerZweit) {
          const [tag, st] = slot.split('|');
          if (!info?.slots.has(slot) && !ix.lehrkraftGesperrt(l.id, tag, Number(st))) moeglich++;
        }
        const k5 = Math.min(luecke, moeglich);
        ziel('K5', k5, `${n.lehrkraft(l.id)}: ${ist} von ${l.sollStunden} Stunden (Reserve ${ix.reserve(l)}), ${k5} weitere als Zweitbesetzung möglich`);
      }
    }

    /* ---------- W1: kompakter Schultag ---------- */
    const erste = ix.stunden[0];
    const belegteWoche = new Map();
    for (const s of stunden) if (Index.STATUS.belegt(s)) belegteWoche.set(s.klasse, (belegteWoche.get(s.klasse) || 0) + 1);
    for (const [k, idx] of proKlasseTag) {
      const [klasse, tag] = k.split('|');
      const nr = idx.map((i) => stunden[i].stunde);
      const start = Math.min(...nr);
      const ende = Math.max(...nr);
      const spaet = start - erste;
      w('W1', spaet, `${n.klasse(klasse)} beginnt am ${tag} erst zur ${start}. Stunde`);
      if (woche) {
        const zielEnde = erste - 1 + Math.ceil(belegteWoche.get(klasse) / ix.tage.length);
        const lang = Math.max(0, ende - zielEnde);
        w('W1', lang, `${n.klasse(klasse)} endet am ${tag} erst nach der ${ende}. Stunde (Ziel: ${zielEnde}.)`);
      }
    }

    /* ---------- W2, W7, W8: Lehrkräfte ---------- */
    for (const l of z.lehrkraefte) {
      const info = lehrer.get(l.id);
      const ist = info?.slots.size || 0;
      for (const [tag, st] of info?.proTag || []) {
        const luecken = Math.max(...st) - Math.min(...st) + 1 - st.size;
        w('W2', luecken, `${n.lehrkraft(l.id)} hat am ${tag} ${luecken} Leerstunde(n)`);
      }
      if (woche && ist) {
        const proTag = ix.tage.map((t) => info.proTag.get(t)?.size || 0);
        const mittel = ist / ix.tage.length;
        const abweichung = rund(proTag.reduce((s, h) => s + Math.abs(h - mittel), 0));
        w('W7', abweichung, `${n.lehrkraft(l.id)}: Tageslast ${proTag.join('/')} (Mittel ${rund(mittel)})`);
      }
      if (woche) w('W8', Math.max(0, l.minStunden - ist), `${n.lehrkraft(l.id)}: ${ist} Stunden, Mindestens ${l.minStunden}`);
    }

    /* ---------- W3, W5: Doppelstunden und Verteilung ---------- */
    const proKlasseFachTag = Regeln.gruppiere(stunden, (s) => (s.fach && Index.STATUS.abgedeckt(s) ? S(s.klasse, s.fach, s.tag) : null));
    const paare = new Map(); // Klasse|Fach → Anzahl Doppelstunden
    for (const [k, idx] of proKlasseFachTag) {
      const [klasse, fach, tag] = k.split('|');
      const f = ix.faecher.get(fach);
      const folgen = Regeln.laeufe(idx.map((i) => stunden[i].stunde));
      // Doppelstunden: Paare (s, s+1) mit erlaubtem Beginn, nicht überlappend
      let p = 0;
      for (const folge of folgen) {
        for (let i = 0; i + 1 < folge.length;) {
          if (ix.doppelstundenStart.has(folge[i])) { p++; i += 2; } else i++;
        }
      }
      paare.set(S(klasse, fach), (paare.get(S(klasse, fach)) || 0) + p);
      const maxBlock = f?.blockbar ? 2 : 1;
      const zuviel = (folgen.length - 1) + folgen.reduce((s, folge) => s + Math.max(0, folge.length - maxBlock), 0);
      w('W5', zuviel, `${n.klasse(klasse)} hat am ${tag} ${idx.length} Stunden ${n.fach(fach)} in ${folgen.length} Block/Blöcken`);
    }
    if (woche) {
      for (const k of z.klassen) {
        for (const t of k.stundentafel) {
          if (!t.doppelt || !ix.faecher.get(t.fach)?.blockbar) continue;
          const gewuenscht = Math.floor(t.stunden / 2);
          const fehlt = Math.max(0, gewuenscht - (paare.get(S(k.id, t.fach)) || 0));
          w('W3', fehlt, `${n.klasse(k.id)} ${n.fach(t.fach)}: ${fehlt} von ${gewuenscht} gewünschten Doppelstunden fehlen`);
        }
      }
    }

    /* ---------- W4: Hauptfächer vormittags, Sport nicht nach der Pause ---------- */
    for (const s of stunden) {
      if (!s.fach || !Index.STATUS.abgedeckt(s)) continue;
      const f = ix.faecher.get(s.fach);
      if (f?.hauptfach && !ix.istVormittag(s.stunde)) w('W4', 1, `${n.klasse(s.klasse)} ${n.slot(s.tag, s.stunde)} Stunde: Hauptfach ${n.fach(s.fach)} am Nachmittag`);
      if ((f?.raumtyp === 'turnhalle' || f?.raumtyp === 'schwimmhalle') && s.stunde !== erste && ix.pauseVor.has(s.stunde)) {
        w('W4', 1, `${n.klasse(s.klasse)} ${n.slot(s.tag, s.stunde)} Stunde: ${n.fach(s.fach)} direkt nach der Pause`);
      }
    }

    /* ---------- W6: Raumwechsel und Heimatraum ---------- */
    for (const [k, idx] of proKlasseTag) {
      const [klasse, tag] = k.split('|');
      const heimat = ix.klassen.get(klasse)?.heimatraum;
      const folge = idx.map((i) => stunden[i]).filter((s) => s.raum && Index.STATUS.mitRaum(s)).sort((a, b) => a.stunde - b.stunde);
      let wechsel = 0;
      for (let i = 1; i < folge.length; i++) if (folge[i].raum !== folge[i - 1].raum) wechsel++;
      w('W6', wechsel, `${n.klasse(klasse)} wechselt am ${tag} ${wechsel}-mal den Raum`);
      for (const s of folge) {
        if (heimat && s.raum !== heimat && s.fach && !ix.faecher.get(s.fach)?.raumtyp) {
          w('W6', 1, `${n.klasse(klasse)} ${n.slot(tag, s.stunde)} Stunde ${n.fach(s.fach)} in ${n.raum(s.raum)} statt im Heimatraum`);
        }
      }
    }

    /* ---------- W9, W10: Zweitbesetzung ---------- */
    const zweit = stunden.filter((s) => (s.lehrkraefte?.length || 0) > 1 && Index.STATUS.fachunterricht(s));
    if (zweit.length) {
      const sch = z.klassen.map((k) => k.schueler);
      const stu = z.klassen.map((k) => k.stufe);
      const norm = (x, min, max) => (max > min ? (x - min) / (max - min) : 0.5); // gleiche Werte: neutral
      const [sMin, sMax, tMin, tMax] = [Math.min(...sch), Math.max(...sch), Math.min(...stu), Math.max(...stu)];
      const jeKlasseFach = new Map();
      for (const s of zweit) {
        const k = ix.klassen.get(s.klasse);
        const knapp = s.fach ? 1 / Math.max(1, ix.anzahlQualifizierte(s.fach, k.stufe)) : 0;
        const prio = (norm(k.schueler, sMin, sMax) + (1 - norm(k.stufe, tMin, tMax)) + knapp) / 3;
        w('W9', rund(1 - prio), `${n.klasse(s.klasse)} ${n.slot(s.tag, s.stunde)} Stunde: Zweitbesetzung ${n.lehrkraft(s.lehrkraefte[1])} (Priorität ${rund(prio)})`);
        const kf = S(s.klasse, s.fach);
        if (!jeKlasseFach.has(kf)) jeKlasseFach.set(kf, new Set());
        jeKlasseFach.get(kf).add(s.lehrkraefte[1]);
      }
      for (const [kf, l] of jeKlasseFach) {
        const [klasse, fach] = kf.split('|');
        w('W10', l.size - 1, `${n.klasse(klasse)} ${n.fach(fach)}: ${l.size} verschiedene Zweitlehrkräfte`);
      }
    }

    /* ---------- W11, W12: Aufsichten ---------- */
    const aufsichtJe = Regeln.gruppiere(aufsichten, (a) => a.lehrkraft);
    if (woche) {
      for (const l of z.lehrkraefte) {
        const ist = aufsichtJe.get(l.id)?.length || 0;
        w('W11', Math.max(0, l.aufsichtenProWoche - ist), `${n.lehrkraft(l.id)}: ${ist} von ${l.aufsichtenProWoche} Aufsichten`);
      }
    }
    for (const a of aufsichten) {
      const st = lehrer.get(a.lehrkraft)?.proTag.get(a.tag) || new Set();
      const angrenzend = a.vorStunde === erste ? st.has(erste) : st.has(a.vorStunde - 1) || st.has(a.vorStunde);
      if (!angrenzend) w('W12', 1, `${n.lehrkraft(a.lehrkraft)}: ${n.pause(a.tag, a.vorStunde)} ohne angrenzenden eigenen Unterricht`);
    }
    for (const [k, idx] of Regeln.gruppiere(aufsichten, (a) => S(a.lehrkraft, a.tag))) {
      const [l, tag] = k.split('|');
      w('W12', idx.length - 1, `${n.lehrkraft(l)} hat am ${tag} ${idx.length} Aufsichten`);
    }

    /* ---------- K6 und Ergebnis ---------- */
    for (const k of WEICH) {
      weich[k].anzahl = rund(weich[k].anzahl);
      weich[k].beitrag = rund(weich[k].anzahl * weich[k].gewicht);
      ziele.K6.wert += weich[k].beitrag;
    }
    for (const k of ZIELE) ziele[k].wert = rund(ziele[k].wert);
    return { vektor: ZIELE.map((k) => ziele[k].wert), ziele, weich };
  }

  /** Lexikografischer Vergleich: < 0, wenn a besser (kleiner) ist als b. */
  function vergleiche(a, b) {
    for (let i = 0; i < Math.max(a.length, b.length); i++) {
      const d = (a[i] || 0) - (b[i] || 0);
      if (Math.abs(d) > 1e-9) return d;
    }
    return 0;
  }

  /** Lesbare Kurzform, z. B. „K1 0 · K1A 0 · K2 3 · … · K6 128.5“. */
  function formatiere(vektor) {
    return ZIELE.map((k, i) => `${k} ${vektor[i]}`).join(' · ');
  }

  return { ZIELE, ZIELTITEL, WEICH, WTITEL, bewerte, vergleiche, formatiere };
})();

/* ---- src/kern/55-fluss.js ---- */
/* ==========================================================================
 * Modul Fluss
 * Minimalkosten-Maximalfluss (Successive Shortest Path mit SPFA). Genutzt für
 * die Lehrkräfte-Zuweisung (§6.3) und die Verteilung der Pausenaufsichten
 * (§6.5a): zuerst so viel Fluss wie möglich (= so wenig Ausfall wie möglich),
 * unter allen maximalen Flüssen der billigste.
 * ========================================================================== */
const Fluss = (() => {
  'use strict';

  /** Neuer Graph mit n Knoten (0 … n−1). */
  function graph(n) {
    return { n, von: [], nach: [], kap: [], fluss: [], kosten: [], adj: Array.from({ length: n }, () => []) };
  }

  /** Fügt eine gerichtete Kante hinzu; liefert ihre Nummer (für fluss()). */
  function kante(g, von, nach, kapazitaet, kosten = 0) {
    const i = g.von.length;
    g.von.push(von, nach);
    g.nach.push(nach, von);
    g.kap.push(kapazitaet, 0);
    g.fluss.push(0, 0);
    g.kosten.push(kosten, -kosten);
    g.adj[von].push(i);
    g.adj[nach].push(i + 1);
    return i;
  }

  /**
   * Berechnet einen Fluss maximaler Stärke mit minimalen Kosten.
   * @returns {{fluss: number, kosten: number}}
   */
  function minKostenMaxFluss(g, quelle, senke, grenze = Infinity) {
    const n = g.n;
    const dist = new Float64Array(n);
    const vor = new Int32Array(n);
    const inSchlange = new Uint8Array(n);
    let fluss = 0;
    let kosten = 0;
    while (fluss < grenze) {
      dist.fill(Infinity);
      vor.fill(-1);
      dist[quelle] = 0;
      const schlange = [quelle];
      inSchlange[quelle] = 1;
      for (let kopf = 0; kopf < schlange.length; kopf++) {
        const u = schlange[kopf];
        inSchlange[u] = 0;
        for (const e of g.adj[u]) {
          if (g.kap[e] - g.fluss[e] <= 0) continue;
          const v = g.nach[e];
          const d = dist[u] + g.kosten[e];
          if (d < dist[v] - 1e-12) {
            dist[v] = d;
            vor[v] = e;
            if (!inSchlange[v]) { inSchlange[v] = 1; schlange.push(v); }
          }
        }
      }
      if (dist[senke] === Infinity) break;
      let f = grenze - fluss;
      for (let v = senke; v !== quelle; v = g.von[vor[v]]) f = Math.min(f, g.kap[vor[v]] - g.fluss[vor[v]]);
      for (let v = senke; v !== quelle; v = g.von[vor[v]]) {
        g.fluss[vor[v]] += f;
        g.fluss[vor[v] ^ 1] -= f;
      }
      fluss += f;
      kosten += f * dist[senke];
    }
    return { fluss, kosten };
  }

  /** Fluss über Kante i. */
  const flussVon = (g, i) => g.fluss[i];

  return { graph, kante, minKostenMaxFluss, flussVon };
})();

/* ==========================================================================
 * Modul Planer
 * Erstellt einen Regelplan (Spezifikation §6):
 *   1. Bedarf: Stundentafeln → Unterrichtsstunden je Klasse und Fach
 *   2. Vorprüfung: Bedarf gegen Kontingente, Aufsichtsbedarf gegen Aufsichtssoll
 *   3. Lehrkräfte-Zuweisung: Festzuordnungen, Rest als Minimalkosten-Fluss
 *      (Ausfall minimal, dann eigene Lehrkräfte bevorzugt); liefert untere
 *      Schranke für den Ausfall (K1)
 *   4. Konstruktion: je Klasse und Tag ein lückenloser Block ab der 1. Stunde
 *      (H12 gilt per Konstruktion); Stunden werden in diese Blöcke gesetzt und
 *      Konflikte (H1, H3–H5) per Tabu-Suche mit Tauschzügen beseitigt; was
 *      sich nicht konfliktfrei setzen lässt, bekommt eine andere qualifizierte
 *      Lehrkraft oder entfällt am Tagesende
 *   5. Nachoptimierung: Simulated Annealing über die weichen Regeln (K6) mit
 *      Zügen, die harte Regeln und H12 nie verletzen
 *   6. Abschluss: Räume, Zweitbesetzungen (W9/W10), Pausenaufsichten (Fluss),
 *      Prüfung aller harten Regeln, Kostenvektor
 * Die Arbeit läuft in Zeitscheiben (schritt), damit der Web Worker Fortschritt
 * melden und abbrechen kann. Gleicher Startwert ⇒ gleiches Ergebnis, solange
 * das Zeitbudget nicht greift.
 * ========================================================================== */
const Planer = (() => {
  'use strict';

  const jetzt = () => (typeof performance !== 'undefined' ? performance.now() : Date.now());

  /**
   * Startet einen Planungslauf.
   * @param {object} z gültiger Zustand
   * @param {{zeitbudgetMs?: number, startwert?: number, iterationen?: number, uhr?: () => number}} [optionen]
   */
  function starte(z, optionen = {}) {
    const uhr = optionen.uhr || jetzt;
    const beginn = uhr();
    const budget = optionen.zeitbudgetMs ?? z.einstellungen.zeitbudgetSekunden * 1000;
    const zufall = Hilfen.erzeugeZufall(optionen.startwert ?? z.einstellungen.zufallsStartwert);
    const p = vorbereite(z);
    const statistik = { iterationenKonflikte: 0, iterationenOptimierung: 0, abgebrochen: false, zeitbudgetErreicht: false };
    let phase = 'konflikte';
    let abbruch = false;
    let ergebnis = null;

    zuweisen(p);
    profileUndStart(p, zufall);
    const konflikt = konfliktSuche(p, zufall, statistik);
    let optimierung = null;

    function restMs() { return budget - (uhr() - beginn); }

    /** Arbeitet höchstens `maxMs` Millisekunden; liefert true, wenn fertig. */
    function schritt(maxMs = 50) {
      const ende = uhr() + maxMs;
      while (!ergebnis && uhr() < ende) {
        if (phase === 'konflikte') {
          // Höchstens die Hälfte des Budgets für die Konfliktsuche, dann erzwungene Reparatur
          const zuLang = uhr() - beginn > budget * 0.5;
          const erzwingen = abbruch || zuLang || konflikt.erschoepft();
          if (erzwingen) {
            if (zuLang && !abbruch) statistik.zeitbudgetErreicht = true;
            repariere(p, statistik);
          }
          if (p.konflikte === 0 || erzwingen) {
            phase = 'optimierung';
            optimierung = annealing(p, zufall, optionen.iterationen, statistik);
            continue;
          }
          konflikt.lauf(2000);
        } else if (phase === 'optimierung') {
          if (abbruch || restMs() <= 0 || optimierung.fertig()) {
            if (!abbruch && restMs() <= 0 && !optimierung.fertig()) statistik.zeitbudgetErreicht = true;
            optimierung.beste();
            phase = 'abschluss';
            continue;
          }
          optimierung.lauf(4000);
        } else {
          ergebnis = abschluss(z, p, zufall, statistik);
          statistik.dauerMs = Math.round(uhr() - beginn);
          ergebnis.bericht.statistik = statistik;
        }
      }
      return !!ergebnis;
    }

    function fortschritt() {
      const anteil = ergebnis ? 1
        : phase === 'konflikte' ? 0.05 + 0.25 * konflikt.anteil()
          : phase === 'optimierung' ? 0.3 + 0.65 * optimierung.anteil() : 0.97;
      return {
        phase, anteil, konflikte: p.konflikte, weich: optimierung ? Math.round(optimierung.aktuell() * 100) / 100 : null,
        ausfall: p.ausfall.reduce((s, a) => s + a.stunden, 0), restMs: Math.max(0, Math.round(restMs())),
      };
    }

    return {
      schritt,
      fortschritt,
      abbrechen() { abbruch = true; statistik.abgebrochen = true; },
      get fertig() { return !!ergebnis; },
      ergebnis: () => ergebnis,
    };
  }

  /** Plant vollständig (synchron) – für Tests und Werkzeuge. */
  function plane(z, optionen = {}) {
    const lauf = starte(z, optionen);
    while (!lauf.schritt(1000));
    return lauf.ergebnis();
  }

  /* =========================== Vorbereitung =========================== */

  function vorbereite(z) {
    const ix = Index.erstelle(z);
    const e = z.einstellungen;
    const T = ix.tage.length;
    const H = ix.stunden.length;
    const NS = T * H;
    const L = z.lehrkraefte;
    const K = z.klassen;
    const F = z.faecher;
    const lIdx = new Map(L.map((l, i) => [l.id, i]));
    const fIdx = new Map(F.map((f, i) => [f.id, i]));

    const gesperrt = new Uint8Array(L.length * NS);
    L.forEach((l, t) => {
      for (let d = 0; d < T; d++) for (let h = 0; h < H; h++) if (ix.lehrkraftGesperrt(l.id, ix.tage[d], ix.stunden[h])) gesperrt[t * NS + d * H + h] = 1;
    });
    const freieSlots = L.map((_, t) => NS - gesperrt.subarray(t * NS, (t + 1) * NS).reduce((a, b) => a + b, 0));

    // Raumtypen der Fächer und verfügbare Räume je Typ und Slot
    const typen = [...new Set(F.map((f) => f.raumtyp).filter(Boolean))];
    const typIdx = new Map(typen.map((t, i) => [t, i]));
    const fachTyp = F.map((f) => (f.raumtyp ? typIdx.get(f.raumtyp) : -1));
    const typDesRaums = (r) => (r.typ === 'fachraum' ? r.fachraumtyp : r.typ === 'klassenraum' ? null : r.typ);
    const raeumeJeTyp = typen.map((ty) => z.raeume.filter((r) => typDesRaums(r) === ty).sort((a, b) => a.kapazitaet - b.kapazitaet || a.id.localeCompare(b.id)));
    const kapTyp = new Int16Array(Math.max(1, typen.length) * NS);
    typen.forEach((_, ty) => {
      for (let d = 0; d < T; d++) {
        for (let h = 0; h < H; h++) {
          kapTyp[ty * NS + d * H + h] = raeumeJeTyp[ty].filter((r) => !ix.raumGesperrt(r.id, ix.tage[d], ix.stunden[h])).length;
        }
      }
    });
    // Heimatraum gesperrt → normale Stunden der Klasse dort nicht möglich
    const heimatGesperrt = new Uint8Array(K.length * NS);
    K.forEach((k, c) => {
      if (!k.heimatraum) return;
      for (let d = 0; d < T; d++) for (let h = 0; h < H; h++) if (ix.raumGesperrt(k.heimatraum, ix.tage[d], ix.stunden[h])) heimatGesperrt[c * NS + d * H + h] = 1;
    });

    // Gewichte und weitere Konstanten für die weichen Regeln
    const g = e.gewichte;
    const hauptfach = F.map((f) => !!f.hauptfach);
    const sport = F.map((f) => f.raumtyp === 'turnhalle' || f.raumtyp === 'schwimmhalle');
    const blockMax = F.map((f) => (f.blockbar ? 2 : 1));
    const nachmittag = ix.stunden.map((nr) => !ix.istVormittag(nr));
    const nachPause = ix.stunden.map((nr, h) => h > 0 && ix.pauseVor.has(nr));
    const doppelStart = ix.stunden.map((nr) => ix.doppelstundenStart.has(nr));

    return {
      z, ix, e, T, H, NS, L, K, F, lIdx, fIdx, gesperrt, freieSlots, typen, fachTyp, raeumeJeTyp, kapTyp, heimatGesperrt,
      g, hauptfach, sport, blockMax, nachmittag, nachPause, doppelStart,
      // werden in den folgenden Schritten gefüllt:
      items: [], ausfall: [], warnungen: [], vorpruefung: null, untereSchrankeK1: 0,
      itemsJeKlasse: K.map(() => []), laenge: new Int16Array(K.length * T), pos: null, grid: null,
      occT: new Int16Array(L.length * NS), useTyp: new Int16Array(Math.max(1, typen.length) * NS), konflikte: 0,
      stundenJeLehrkraft: new Int16Array(L.length),
    };
  }

  /* ======================= Bedarf und Zuweisung ======================= */

  function zuweisen(p) {
    const { z, ix, L, K, lIdx, fIdx } = p;
    const reserve = L.map((l) => ix.reserve(l));
    const nutzbar = L.map((l, t) => Math.min(l.sollStunden - reserve[t], p.freieSlots[t]));
    const grenze = L.map((l, t) => Math.min(l.maxStunden, p.freieSlots[t]));
    const belegt = new Float64Array(L.length);
    const auftraege = []; // { c, f, stunden, zuteilung: [{t, n}] }

    // 1. Festzuordnungen (nur qualifizierte Hauptlehrkräfte, bis zur Höchstgrenze)
    K.forEach((k, c) => {
      for (const eintrag of k.stundentafel) {
        const a = { c, f: fIdx.get(eintrag.fach), stunden: eintrag.stunden, rest: eintrag.stunden, zuteilung: [] };
        auftraege.push(a);
        const id = ix.zuordnungVon(k.id, eintrag.fach).haupt;
        if (!id) continue;
        const t = lIdx.get(id);
        if (!ix.istQualifiziert(id, eintrag.fach, k.stufe)) {
          p.warnungen.push(`${k.name} ${ix.name.fach(eintrag.fach)}: festgelegte Lehrkraft ${ix.name.lehrkraft(id)} ist nicht qualifiziert – die Stunden werden neu zugewiesen`);

        }
        const n = Math.max(0, Math.min(a.rest, grenze[t] - belegt[t]));
        if (n < a.rest) p.warnungen.push(`${k.name} ${ix.name.fach(eintrag.fach)}: ${ix.name.lehrkraft(id)} erreicht die Höchstgrenze – ${a.rest - n} Stunde(n) werden anders zugewiesen`);
        if (n > 0) { a.zuteilung.push({ t, n }); a.rest -= n; belegt[t] += n; }
      }

    // 2. Rest als Minimalkosten-Fluss: Auftrag → qualifizierte Lehrkraft → Senke
    const offen = auftraege.filter((a) => a.rest > 0);
    let flussErgebnis = { fluss: 0 };
    if (offen.length) {
      const q = 0;
      const s = 1;
      const g = Fluss.graph(2 + offen.length + L.length);

      offen.forEach((a, i) => {

        L.forEach((l, t) => {
          if (!ix.istQualifiziert(l.id, fachId, k.stufe)) return;

        });
      });
      L.forEach((_, t) => {
        const stufe1 = Math.max(0, nutzbar[t] - belegt[t]);
        const stufe2 = Math.max(0, grenze[t] - Math.max(belegt[t], nutzbar[t]));
        if (stufe1) Fluss.kante(g, knotenL(t), s, stufe1, 0);
        if (stufe2) Fluss.kante(g, knotenL(t), s, stufe2, 100); // Reserve/Mehrarbeit nur, wenn sonst Ausfall
      });
      flussErgebnis = Fluss.minKostenMaxFluss(g, q, s);
      for (const { a, t, e } of kanten) {
        const n = Fluss.flussVon(g, e);
        if (n > 0) { a.zuteilung.push({ t, n }); a.rest -= n; belegt[t] += n; }
      }
    }

    // 3. Ausfall aus der Zuweisung, Stunden erzeugen
    for (const a of auftraege) {
      const k = K[a.c];
      if (a.rest > 0) {

      }
      for (const { t, n } of a.zuteilung) {
        for (let i = 0; i < n; i++) p.items.push({ c: a.c, f: a.f, t, typ: p.fachTyp[a.f], ersatz: ix.zuordnungVon(k.id, p.F[a.f].id).haupt !== L[t].id });

    p.untereSchrankeK1 = p.ausfall.reduce((s, x) => s + x.stunden, 0);

    // Vorprüfung (§6.2)
    const jeFach = p.F.map((f, fi) => {
      const bedarf = auftraege.filter((a) => a.f === fi).reduce((s, a) => s + a.stunden, 0);

      jeFach,
      freieKapazitaet: L.map((l, t) => ({ lehrkraft: l.id, frei: Math.max(0, l.sollStunden - reserve[t] - belegt[t]) })),

      ausfallMindestens: p.untereSchrankeK1,

      p.warnungen.push(`Aufsichtssoll (${p.vorpruefung.aufsichten.soll}) reicht nicht für den Wochenbedarf (${aufsichtBedarf}) – Aufsichten bleiben unbesetzt`);
    }
    for (const x of jeFach) {
      if (x.erwarteterAusfall) p.warnungen.push(`${ix.name.fach(x.fach)}: Bedarf ${x.bedarf}, Kapazität qualifizierter Lehrkräfte ${x.kapazitaet} – mindestens ${x.erwarteterAusfall} Stunde(n) Ausfall`);
    }
  }

  /* ================= Tagesprofile und Startbelegung =================== */

  function profileUndStart(p, zufall) {
    const { T, H, NS, K, items } = p;
    p.pos = new Int32Array(items.length).fill(-1);
    p.grid = new Int32Array(K.length * NS).fill(-1);
    items.forEach((it, i) => p.itemsJeKlasse[it.c].push(i));
    const lastGesamt = new Int32Array(p.L.length);
    for (const it of items) lastGesamt[it.t]++;

    K.forEach((k, c) => {
      let liste = p.itemsJeKlasse[c];
      // Mehr Stunden als Zeitslots: Nebenfächer zuerst streichen
      if (liste.length > NS) {
        const sortiert = liste.slice().sort((a, b) => p.hauptfach[items[a].f] - p.hauptfach[items[b].f]);
        for (const i of sortiert.slice(0, liste.length - NS)) {
          items[i].entfernt = true;
          ausfallEintragen(p, i, 'passt nicht ins Zeitraster');
        }
        liste = p.itemsJeKlasse[c] = liste.filter((i) => !items[i].entfernt);
      }
      // Gleichmäßige Tageslängen; längere Tage vorn
      const basis = Math.floor(liste.length / T);
      const rest = liste.length % T;
      for (let d = 0; d < T; d++) p.laenge[c * T + d] = basis + (d < rest ? 1 : 0);
      const slots = [];
      for (let d = 0; d < T; d++) for (let h = 0; h < p.laenge[c * T + d]; h++) slots.push(d * H + h);
      // Schwierige Stunden zuerst: Fachraum, dann Lehrkräfte mit wenig Spielraum (Stunden / freie Slots)
      const enge = (i) => lastGesamt[items[i].t] / Math.max(1, p.freieSlots[items[i].t]);
      const reihenfolge = zufall.gemischt(liste).sort((a, b) => (items[b].typ >= 0) - (items[a].typ >= 0) || enge(b) - enge(a));
      const frei = new Set(slots);
      for (const i of reihenfolge) {
        let beste = [];
        let besteKosten = Infinity;
        for (const s of frei) {
          const k = startKosten(p, i, s);
          if (k < besteKosten) { besteKosten = k; beste = [s]; } else if (k === besteKosten) beste.push(s);

        frei.delete(s);
        setze(p, i, s);
