<script id="ui">
/* ---- src/ui/10-rechenkern.js ---- */
/* ==========================================================================
 * Modul Rechenkern (Oberfläche)
 * Erzeugt den Web Worker aus Kern- und Worker-Quelltext der Seite (Blob)
 * und bietet eine Promise-basierte Anfrage-Schnittstelle.
 * ========================================================================== */
const Rechenkern = (() => {
  'use strict';
  let worker = null;
  let naechsteId = 1;
  const offen = new Map();

  /** Startet den Worker. Liefert false, wenn der Browser es nicht erlaubt. */
  function starte() {
    if (worker) return true;
    const kern = document.getElementById('kern');
    const glue = document.getElementById('worker-quelle');
    if (!kern || !glue || typeof Worker === 'undefined') return false;
    const blob = new Blob([kern.textContent, '\n', glue.textContent], { type: 'text/javascript' });
    const url = URL.createObjectURL(blob);
    try {
      worker = new Worker(url);
    } catch (e) {
      console.error('Worker konnte nicht gestartet werden', e);
      worker = null;
      return false;
    } finally {
      // Der Worker hat das Skript beim Start geladen; die URL wird nicht mehr gebraucht.
      setTimeout(() => URL.revokeObjectURL(url), 0);
    }
    worker.onmessage = (e) => {
      const antwort = e.data || {};
      const eintrag = offen.get(antwort.id);
      if (!eintrag) return;
      if (antwort.typ === 'fortschritt') { eintrag.beiFortschritt?.(antwort); return; }
      offen.delete(antwort.id);
      if (antwort.typ === 'fehler') eintrag.ablehnen(new Error(antwort.meldung));
      else eintrag.erfuellen(antwort);
    };
    worker.onerror = (e) => {
      for (const eintrag of offen.values()) eintrag.ablehnen(new Error(e.message || 'Worker-Fehler'));
      offen.clear();
    };
    return true;
  }

  /** Sendet eine Anfrage und wartet auf die Antwort mit derselben id. */
  function anfrage(typ, daten = {}, beiFortschritt) {
    if (!starte()) return Promise.reject(new Error('Rechenkern nicht verfügbar'));
    const id = naechsteId++;
    return new Promise((erfuellen, ablehnen) => {
      offen.set(id, { erfuellen, ablehnen, beiFortschritt });
      worker.postMessage({ ...daten, typ, id });
    });
  }

  /** Sendet eine Nachricht ohne Antwort (z. B. „abbrechen“). */
  function sende(typ, daten = {}) {
    if (!starte()) return false;
    worker.postMessage({ ...daten, typ, id: naechsteId++ });
    return true;
  }

  return { starte, anfrage, sende };
})();

/* ---- src/ui/20-dialog.js ---- */
/* ==========================================================================
 * Modul Dialog (Oberfläche)
 * Modale Rückfrage auf Basis des <dialog>-Elements: Fokus bleibt im Dialog,
 * Esc bricht ab, Ergebnis als Promise.
 * ========================================================================== */
const Dialog = (() => {
  'use strict';
  let zaehler = 0;

  /**
   * @param {{titel: string, text: string, knoepfe: {text: string, wert: string, art?: 'primaer'|'gefahr', fokus?: boolean}[]}} o
   * @returns {Promise<string>} `wert` des gewählten Knopfs, „abbrechen“ bei Esc
   */
  function frage({ titel, text, knoepfe }) {
    return new Promise((erfuellen) => {
      const id = 'dialog-titel-' + (++zaehler);
      const d = document.createElement('dialog');
      d.className = 'dialog';
      d.setAttribute('aria-labelledby', id);
      const h = document.createElement('h2');
      h.id = id;
      h.textContent = titel;
      const p = document.createElement('p');
      p.textContent = text;
      const leiste = document.createElement('div');
      leiste.className = 'dialog-knoepfe';
      let fokus = null;
      for (const k of knoepfe) {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = k.text;
        b.className = 'knopf' + (k.art ? ' knopf-' + k.art : '');
        b.dataset.wert = k.wert;
        b.addEventListener('click', () => d.close(k.wert));
        if (k.fokus) fokus = b;
        leiste.append(b);
      }
      d.append(h, p, leiste);
      d.addEventListener('close', () => {
        erfuellen(d.returnValue || 'abbrechen');
        d.remove();
      });
      document.body.append(d);
      d.showModal();
      (fokus || leiste.lastElementChild)?.focus();
    });
  }

  return { frage };
})();

/* ---- src/ui/22-tabelle.js ---- */
/* ==========================================================================
 * Modul Tabelle (Oberfläche)
 * Bearbeitbare Tabelle für Stammdaten (§7): Zeilen hinzufügen, bearbeiten,
 * löschen; sofortige Prüfung jeder Eingabe; Tastaturbedienung:
 *   Enter / ↓   übernehmen und eine Zeile nach unten (gleiche Spalte)
 *   ↑           übernehmen und eine Zeile nach oben
 *   Esc         Eingabe verwerfen
 *   Tab         nächstes Feld (Standard des Browsers)
 * Jede Änderung läuft über App.aendere (geprüft, rückgängig machbar).
 * ========================================================================== */
const Tabelle = (() => {
  'use strict';

  /** Hilfen zum Lesen und Schreiben kompakter Texteingaben. */
  const Text = {
    /** „1–4, 6“ → [1,2,3,4,6] */
    zahlen(text) {
      const ergebnis = [];
      for (const teil of text.split(',').map((t) => t.trim()).filter(Boolean)) {
        const m = /^(\d+)\s*(?:[-–]\s*(\d+))?$/.exec(teil);
        if (!m) return null;
        const von = Number(m[1]);
        const bis = m[2] ? Number(m[2]) : von;
        if (bis < von) return null;
        for (let x = von; x <= bis; x++) ergebnis.push(x);
      }
      return [...new Set(ergebnis)].sort((a, b) => a - b);
    },
    /** [1,2,3,5] → „1–3, 5“ */
    bereiche(zahlen) {
      const s = [...zahlen].sort((a, b) => a - b);
      const teile = [];
      for (let i = 0; i < s.length;) {
        let j = i;
        while (j + 1 < s.length && s[j + 1] === s[j] + 1) j++;
        teile.push(j > i ? `${s[i]}–${s[j]}` : String(s[i]));
        i = j + 1;
      }
      return teile.join(', ');
    },
  };

  /**
   * @param {object} o
   * @param {string} o.id              HTML-ID der Tabelle
   * @param {string} o.beschriftung     Tabellenüberschrift
   * @param {string} o.einzahl          z. B. „Lehrkraft“ (für Knöpfe und Verlauf)
   * @param {(d: object) => object[]} o.liste       Zeilen im Datenstand
   * @param {(zeile: object, i: number) => string} [o.schluessel]  stabiler Zeilenschlüssel (Standard: id)
   * @param {(zeile: object) => string} [o.name]   lesbarer Zeilenname
   * @param {object[]} o.spalten        { feld, titel, art: text|zahl|bool|wahl|anzeige, breite, min, max, ganz,
   *                                     optionen(d) → [[wert, text]], anzeigen(zeile, d), setzen(zeile, wert, d) → Fehlertext|undefined }
   * @param {(d: object) => (object|string)} [o.neu]   neue Zeile anlegen (oder Fehlertext)
   * @param {(d: object, zeile: object) => ({pfad,text}[]|undefined)} [o.verweise] blockierende Verweise
   * @param {(d: object, schluessel: string) => void} [o.entferne] Zeile entfernen (Standard: aus liste)
   */
  function erstelle(o) {
    const el = App.el;
    const schluessel = o.schluessel || ((z) => z.id);
    const name = o.name || ((z) => z.name || z.kuerzel || z.id);
    const tabelle = el('table', { class: 'tabelle bearbeitbar', id: o.id });
    const meldung = el('div', { class: 'meldungen', 'aria-live': 'polite' });
    const wurzel = el('div', { class: 'tabellen-block' }, el('div', { class: 'tabellen-rahmen' }, tabelle));
    if (o.neu) {
      wurzel.append(el('div', { class: 'knopfleiste' },
        el('button', { type: 'button', class: 'knopf', 'data-aktion': 'neu', text: `+ ${o.einzahl} hinzufügen`, onclick: hinzufuegen })));
    }
    wurzel.append(meldung);
    let fokusNach = null; // { zeile, spalte }

    function zeige(art, titel, eintraege = []) {
      meldung.replaceChildren(el('div', { class: 'meldung meldung-' + art, role: art === 'fehler' ? 'alert' : 'status' },
        el('p', { class: 'meldung-titel', text: (art === 'fehler' ? '⚠ ' : art === 'ok' ? '✓ ' : 'ℹ ') + titel }),
        eintraege.length ? el('ul', { class: 'pfadliste' }, ...eintraege.map((f) => el('li', {}, f.pfad ? el('code', { text: f.pfad }) : null, f.pfad ? ': ' : '', f.meldung || f.text))) : null));
    }

    function render() {
      const d = App.zustand.daten;
      const aktiv = document.activeElement;
      if (!fokusNach && aktiv && tabelle.contains(aktiv) && aktiv.dataset.zeile) fokusNach = { zeile: aktiv.dataset.zeile, spalte: aktiv.dataset.spalte };
      const zeilen = o.liste(d);
      const kopf = el('tr', {}, ...o.spalten.map((s) => el('th', { scope: 'col', class: s.art === 'zahl' ? 'zahl' : null, style: s.breite ? `min-width:${s.breite}` : null, text: s.titel })));
      if (o.verweise || o.entferne) kopf.append(el('th', { scope: 'col' }, el('span', { class: 'versteckt', text: 'Aktionen' })));
      const koerper = el('tbody', {}, ...zeilen.map((z, i) => zeile(z, i, d)));
      tabelle.replaceChildren(el('caption', { text: `${o.beschriftung} (${zeilen.length})` }), el('thead', {}, kopf), koerper);
      if (!zeilen.length) koerper.append(el('tr', {}, el('td', { colspan: String(o.spalten.length + 1), class: 'leise', text: 'Noch keine Einträge.' })));
      if (fokusNach) {
        const ziel = tabelle.querySelector(`[data-zeile="${CSS.escape(fokusNach.zeile)}"][data-spalte="${CSS.escape(fokusNach.spalte)}"]`);
        fokusNach = null;
        if (ziel) { ziel.focus(); ziel.select?.(); }
      }
    }

    function zeile(z, i, d) {
      const key = schluessel(z, i);
      const tr = el('tr', { 'data-schluessel': key });
      for (const s of o.spalten) {
        const beschr = `${s.titel} – ${name(z)}`;
        const wert = s.anzeigen ? s.anzeigen(z, d) : z[s.feld];
        const gemeinsam = { 'data-zeile': key, 'data-spalte': s.feld, 'aria-label': beschr };
        let feld;
        if (s.art === 'anzeige') {
          feld = el('span', { text: String(wert ?? '') });
        } else if (s.art === 'bool') {
          feld = el('input', { type: 'checkbox', ...gemeinsam, checked: !!wert, onchange: (e) => uebernehme(key, s, e.target.checked, e.target) });
        } else if (s.art === 'wahl') {
          feld = el('select', { ...gemeinsam, onchange: (e) => uebernehme(key, s, e.target.value, e.target) },
            ...s.optionen(d).map(([w, t]) => el('option', { value: w, text: t, selected: String(w) === String(wert ?? '') })));
          feld.addEventListener('keydown', (e) => tasten(e, key, s, i, d));
        } else {
          feld = el('input', {
            type: 'text', ...gemeinsam, value: String(wert ?? ''), spellcheck: 'false', autocomplete: 'off',
            inputmode: s.art === 'zahl' ? 'decimal' : null, class: s.art === 'zahl' ? 'zahl' : null, list: s.liste || null,
            placeholder: s.platzhalter || null,
            onchange: (e) => uebernehme(key, s, e.target.value, e.target),
          });
          feld.addEventListener('keydown', (e) => tasten(e, key, s, i, d));
        }
        tr.append(el('td', { class: s.art === 'zahl' ? 'zahl' : null }, feld));
      }
      if (o.verweise || o.entferne) {
        tr.append(el('td', {}, el('button', {
          type: 'button', class: 'knopf knopf-klein knopf-gefahr', 'data-aktion': 'loeschen', 'aria-label': `${o.einzahl} ${name(z)} löschen`,
          title: `${o.einzahl} ${name(z)} löschen`, text: 'Löschen', onclick: () => loesche(key),
        })));
      }
      return tr;
    }

    function tasten(e, key, s, i) {
      const zeilen = o.liste(App.zustand.daten);
      const nachbar = (r) => {
        const j = i + r;
        if (j < 0 || j >= zeilen.length) return null;
        return { zeile: schluessel(zeilen[j], j), spalte: s.feld };
      };
      if (e.key === 'Escape') {
        e.preventDefault();
        render();
        tabelle.querySelector(`[data-zeile="${CSS.escape(key)}"][data-spalte="${CSS.escape(s.feld)}"]`)?.focus();
        meldung.replaceChildren();
        return;
      }
      const richtung = e.key === 'Enter' || (e.key === 'ArrowDown' && e.target.tagName === 'INPUT') ? 1
        : e.key === 'ArrowUp' && e.target.tagName === 'INPUT' ? -1 : 0;
      if (!richtung) return;
      e.preventDefault();
      const ziel = nachbar(richtung);
      const gespeichert = e.target.tagName === 'INPUT' && e.target.value !== String((s.anzeigen ? s.anzeigen(zeilen[i], App.zustand.daten) : zeilen[i][s.feld]) ?? '')
        ? uebernehme(key, s, e.target.value, e.target, ziel) : true;
      if (gespeichert && ziel && !fokusNach) {
        tabelle.querySelector(`[data-zeile="${CSS.escape(ziel.zeile)}"][data-spalte="${CSS.escape(ziel.spalte)}"]`)?.focus();
      }
    }

    function finde(d, key) {
      return o.liste(d).find((z, i) => schluessel(z, i) === key);
    }

    /** Übernimmt eine Eingabe; liefert true bei Erfolg. */
    function uebernehme(key, s, roh, eingabe, danach) {
      let lokal = null;
      const alt = finde(App.zustand.daten, key);
      const r = App.aendere(`${o.einzahl} ${alt ? name(alt) : key}: ${s.titel} geändert`, (d) => {
        const z = finde(d, key);
        if (!z) return false;
        lokal = s.setzen ? s.setzen(z, roh, d) : setzeStandard(z, s, roh);
        if (lokal) return false;
      });
      if (lokal || !r.ok) {
        eingabe.setAttribute('aria-invalid', 'true');
        zeige('fehler', `${s.titel} von „${alt ? name(alt) : key}“ nicht übernommen`, lokal ? [{ meldung: lokal }] : r.fehler.slice(0, 8));
        return false;
      }
      meldung.replaceChildren();
      if (danach) fokusNach = danach;
      render();
      return true;
    }

    function hinzufuegen() {
      let fehlerText = null;
      let neueZeile = null;
      const r = App.aendere(`${o.einzahl} hinzugefügt`, (d) => {
        const z = o.neu(d);
        if (typeof z === 'string') { fehlerText = z; return false; }
        neueZeile = z;
      });
      if (fehlerText || !r.ok) { zeige('fehler', `${o.einzahl} nicht hinzugefügt`, fehlerText ? [{ meldung: fehlerText }] : r.fehler.slice(0, 8)); return; }
      const liste = o.liste(App.zustand.daten);
      fokusNach = { zeile: schluessel(neueZeile, liste.length - 1), spalte: o.spalten.find((s) => s.art !== 'anzeige' && s.art !== 'bool').feld };
      zeige('ok', `${o.einzahl} „${name(neueZeile)}“ hinzugefügt – bitte Angaben ergänzen.`);
      render();
    }

    function loesche(key) {
      const d = App.zustand.daten;
      const z = finde(d, key);
      if (!z) return;
      const verweise = o.verweise ? o.verweise(d, z) || [] : [];
      if (verweise.length) {
        zeige('fehler', `${o.einzahl} „${name(z)}“ kann nicht gelöscht werden – ${verweise.length} Verweis(e):`,
          verweise.slice(0, 30).map((v) => ({ meldung: v.text })).concat(verweise.length > 30 ? [{ meldung: `… und ${verweise.length - 30} weitere` }] : []));
        return;
      }
      const r = App.aendere(`${o.einzahl} ${name(z)} gelöscht`, (neu) => {
        if (o.entferne) return o.entferne(neu, key);
        const liste = o.liste(neu);
        liste.splice(liste.findIndex((x, i) => schluessel(x, i) === key), 1);
      });
      if (!r.ok) { zeige('fehler', `${o.einzahl} „${name(z)}“ nicht gelöscht`, r.fehler.slice(0, 8)); return; }
      zeige('ok', `${o.einzahl} „${name(z)}“ gelöscht (rückgängig mit Strg+Z).`);
      render();
    }

    return { element: wurzel, render, zeige };
  }

  /** Standard-Übernahme nach Spaltenart. */
  function setzeStandard(z, s, roh) {
    if (s.art === 'bool') { z[s.feld] = !!roh; return; }
    if (s.art === 'wahl') { z[s.feld] = roh === '' ? null : roh; return; }
    if (s.art === 'zahl') {
      const t = String(roh).trim().replace(',', '.');
      const n = Number(t);
      if (t === '' || !Number.isFinite(n)) return `Bitte eine Zahl eingeben${s.min !== undefined ? ` (${s.min}–${s.max})` : ''}.`;
      if (s.ganz && !Number.isInteger(n)) return 'Bitte eine ganze Zahl eingeben.';
      if ((s.min !== undefined && n < s.min) || (s.max !== undefined && n > s.max)) return `Erlaubt sind Werte von ${s.min} bis ${s.max}.`;
      z[s.feld] = n;
      return;
    }
    const t = String(roh).trim();
    if (s.pflicht && !t) return `${s.titel} ist ein Pflichtfeld.`;
    if (s.max && t.length > s.max) return `${s.titel} darf höchstens ${s.max} Zeichen lang sein.`;
    z[s.feld] = t;
  }

  return { erstelle, Text };
})();

/* ---- src/ui/24-stammdaten.js ---- */
/* ==========================================================================
 * Modul StammdatenReiter (Oberfläche, Reiter „Stammdaten“)
 * Tabellen für Lehrkräfte, Fächer, Räume, Klassen, Zeitraster mit Pausen und
 * Schule (§7). Kompakte Eingaben:
 *   Qualifikationen „MA 1–4; DE 5–10“  (Fachkürzel, optional Stufenbereich)
 *   Sperrzeiten     „Fr 5–6; Mo 1“      (Tag, Stunden)
 *   Nachbarräume    „102, 103“          (Raumnamen)
 * Löschen ist gesperrt, solange die Entität referenziert wird (mit Liste).
 * ========================================================================== */
const StammdatenReiter = (() => {
  'use strict';
  let panel = null;
  let sichtbar = () => {};
  let aktiv = 'lehrkraefte';
  const tabellen = {};

  const BEREICHE = [
    ['lehrkraefte', 'Lehrkräfte'], ['faecher', 'Fächer'], ['raeume', 'Räume'], ['klassen', 'Klassen'],
    ['zeitraster', 'Zeitraster und Pausen'], ['schule', 'Schule'],
  ];

  /* ------------------------ Text ↔ Daten ------------------------------ */

  const kuerzelVon = (d, id) => d.faecher.find((f) => f.id === id)?.kuerzel || id;

  function qualiText(z, d) {
    return z.qualifikationen.map((q) => `${kuerzelVon(d, q.fach)} ${q.stufenVon === q.stufenBis ? q.stufenVon : q.stufenVon + '–' + q.stufenBis}`).join('; ');
  }
  function qualiLesen(text, d) {
    const ergebnis = [];
    for (const teil of text.split(';').map((t) => t.trim()).filter(Boolean)) {
      const m = /^(\S+)(?:\s+(\d+)(?:\s*[-–]\s*(\d+))?)?$/.exec(teil);
      if (!m) return `„${teil}“ verstehe ich nicht. Beispiel: MA 1–4; DE 5–10`;
      const fach = d.faecher.find((f) => f.kuerzel.toLowerCase() === m[1].toLowerCase());
      if (!fach) return `Fachkürzel „${m[1]}“ gibt es nicht. Vorhanden: ${d.faecher.map((f) => f.kuerzel).join(', ') || '–'}`;
      const von = m[2] ? Number(m[2]) : 1;
      const bis = m[3] ? Number(m[3]) : m[2] ? von : 13;
      if (von < 1 || bis > 13 || bis < von) return `Stufenbereich bei „${teil}“ muss zwischen 1 und 13 liegen.`;
      ergebnis.push({ fach: fach.id, stufenVon: von, stufenBis: bis });
    }
    return ergebnis;
  }
  function sperrText(z) {
    return (z.gesperrt || []).map((g) => `${g.tag} ${Tabelle.Text.bereiche(g.stunden)}`).join('; ');
  }
  function sperrLesen(text, d) {
    const ergebnis = new Map();
    for (const teil of text.split(';').map((t) => t.trim()).filter(Boolean)) {
      const m = /^(Mo|Di|Mi|Do|Fr)\s+(.+)$/i.exec(teil);
      if (!m) return `„${teil}“ verstehe ich nicht. Beispiel: Fr 5–6; Mo 1`;
      const tag = m[1][0].toUpperCase() + m[1][1].toLowerCase();
      if (!d.zeitraster.tage.includes(tag)) return `${tag} liegt nicht im Zeitraster.`;
      const stunden = Tabelle.Text.zahlen(m[2]);
      if (!stunden || !stunden.length) return `Stunden bei „${teil}“ verstehe ich nicht. Beispiel: 1–2, 5`;
      const nr = d.zeitraster.stunden.map((s) => s.nr);
      const fremd = stunden.filter((s) => !nr.includes(s));
      if (fremd.length) return `Stunde ${fremd.join(', ')} gibt es im Zeitraster nicht.`;
      ergebnis.set(tag, [...new Set([...(ergebnis.get(tag) || []), ...stunden])].sort((a, b) => a - b));
    }
    return [...ergebnis].map(([tag, stunden]) => ({ tag, stunden }));
  }
  const setzeMit = (leser, feld) => (z, roh, d) => {
    const r = leser(String(roh), d);
    if (typeof r === 'string') return r;
    z[feld] = r;
  };

  const eindeutigesKuerzel = (liste, stamm) => {
    for (let n = 1; ; n++) { const k = stamm + n; if (!liste.some((x) => (x.kuerzel || x.name).toLowerCase() === k.toLowerCase())) return k; }
  };
  const neueId = (liste, praefix, stamm) => Kern.Hilfen.neueId(praefix, new Set(liste.map((x) => x.id)), stamm);
  const verweiseAuf = (sammlung) => (d, z) => Kern.Verweise.finde(d, sammlung, z.id);

  /* ----------------------------- Tabellen ----------------------------- */

  function baueTabellen() {
    const lehrerOptionen = (d) => [['', '– keine –'], ...d.lehrkraefte.map((l) => [l.id, `${l.kuerzel} – ${l.name}`])];
    const raumOptionen = (d) => [['', '– keiner –'], ...d.raeume.map((r) => [r.id, `${r.name} (${r.kapazitaet})`])];

    tabellen.lehrkraefte = Tabelle.erstelle({
      id: 'tabelle-lehrkraefte', beschriftung: 'Lehrkräfte', einzahl: 'Lehrkraft', liste: (d) => d.lehrkraefte,
      spalten: [
        { feld: 'name', titel: 'Name', art: 'text', pflicht: true, breite: '12em' },
        { feld: 'kuerzel', titel: 'Kürzel', art: 'text', pflicht: true, max: 12, breite: '5em' },
        { feld: 'qualifikationen', titel: 'Qualifikationen (Fach Stufen)', art: 'text', breite: '14em', platzhalter: 'z. B. MA 1–4; DE 1–4', anzeigen: qualiText, setzen: setzeMit(qualiLesen, 'qualifikationen') },
        { feld: 'sollStunden', titel: 'Soll', art: 'zahl', min: 0, max: 40 },
        { feld: 'minStunden', titel: 'Min', art: 'zahl', min: 0, max: 40 },
        { feld: 'maxStunden', titel: 'Max', art: 'zahl', min: 0, max: 40 },
        { feld: 'aufsichtenProWoche', titel: 'Aufsichten/Woche', art: 'zahl', min: 0, max: 50, ganz: true },
        { feld: 'gesperrt', titel: 'Gesperrt (Tag Stunden)', art: 'text', breite: '10em', platzhalter: 'z. B. Fr 5–6', anzeigen: sperrText, setzen: setzeMit(sperrLesen, 'gesperrt') },
        { feld: 'abwesenheiten', titel: 'Abwesenheiten', art: 'anzeige', anzeigen: (z) => (z.abwesenheiten.length ? `${z.abwesenheiten.length} (Reiter Ausfall)` : '–') },
      ],
      neu: (d) => {
        const kuerzel = eindeutigesKuerzel(d.lehrkraefte, 'NEU');
        const l = { id: neueId(d.lehrkraefte, 'l', kuerzel), name: 'Neue Lehrkraft', kuerzel, qualifikationen: [], sollStunden: 0, minStunden: 0, maxStunden: 0, aufsichtenProWoche: 0, gesperrt: [], abwesenheiten: [] };
        d.lehrkraefte.push(l);
        return l;
      },
      verweise: verweiseAuf('lehrkraefte'),
    });

    tabellen.faecher = Tabelle.erstelle({
      id: 'tabelle-faecher', beschriftung: 'Fächer', einzahl: 'Fach', liste: (d) => d.faecher,
      spalten: [
        { feld: 'name', titel: 'Name', art: 'text', pflicht: true, breite: '12em' },
        { feld: 'kuerzel', titel: 'Kürzel', art: 'text', pflicht: true, max: 12, breite: '5em' },
        { feld: 'raumtyp', titel: 'Benötigter Raumtyp', art: 'text', liste: 'liste-raumtypen', platzhalter: 'Klassenraum', breite: '10em',
          setzen: (z, roh) => { const t = String(roh).trim(); z.raumtyp = t ? t : null; } },
        { feld: 'blockbar', titel: 'Doppelstunden erlaubt', art: 'bool' },
        { feld: 'hauptfach', titel: 'Hauptfach', art: 'bool' },
      ],
      neu: (d) => {
        const kuerzel = eindeutigesKuerzel(d.faecher, 'F');
        const f = { id: neueId(d.faecher, 'f', kuerzel), name: 'Neues Fach', kuerzel, raumtyp: null, blockbar: true, hauptfach: false };
        d.faecher.push(f);
        return f;
      },
      verweise: verweiseAuf('faecher'),
    });

    tabellen.raeume = Tabelle.erstelle({
      id: 'tabelle-raeume', beschriftung: 'Räume', einzahl: 'Raum', liste: (d) => d.raeume,
      spalten: [
        { feld: 'name', titel: 'Name', art: 'text', pflicht: true, breite: '8em' },
        { feld: 'typ', titel: 'Typ', art: 'wahl', optionen: () => [['klassenraum', 'Klassenraum'], ['fachraum', 'Fachraum'], ['turnhalle', 'Turnhalle'], ['schwimmhalle', 'Schwimmhalle']],
          setzen: (z, roh) => {
            z.typ = roh;
            if (roh === 'fachraum' && !z.fachraumtyp) z.fachraumtyp = 'fachraum';
            if (roh !== 'fachraum') delete z.fachraumtyp;
          } },
        { feld: 'fachraumtyp', titel: 'Fachraumtyp', art: 'text', liste: 'liste-raumtypen', breite: '8em',
          setzen: (z, roh) => {
            const t = String(roh).trim();
            if (z.typ !== 'fachraum') return t ? 'Ein Fachraumtyp gilt nur für Fachräume. Bitte zuerst den Typ „Fachraum“ wählen.' : undefined;
            if (!t) return 'Fachräume brauchen einen Fachraumtyp (z. B. nawi, musik).';
            z.fachraumtyp = t;
          } },
        { feld: 'kapazitaet', titel: 'Plätze', art: 'zahl', min: 1, max: 500, ganz: true },
        { feld: 'nahe', titel: 'Nachbarräume (Namen)', art: 'text', breite: '10em', platzhalter: 'z. B. 102, 103',
          anzeigen: (z, d) => z.nahe.map((id) => d.raeume.find((r) => r.id === id)?.name || id).join(', '),
          setzen: (z, roh, d) => {
            const namen = String(roh).split(',').map((t) => t.trim()).filter(Boolean);
            const ids = [];
            for (const n of namen) {
              const r = d.raeume.find((x) => x.name.toLowerCase() === n.toLowerCase());
              if (!r) return `Raum „${n}“ gibt es nicht.`;
              if (r.id === z.id) return 'Ein Raum kann nicht neben sich selbst liegen.';
              ids.push(r.id);
            }
            // „nahe“ ist symmetrisch: Gegenseite mitpflegen
            for (const r of d.raeume) {
              if (r.id === z.id) continue;
              const soll = ids.includes(r.id);
              const ist = r.nahe.includes(z.id);
              if (soll && !ist) r.nahe.push(z.id);
              if (!soll && ist) r.nahe = r.nahe.filter((x) => x !== z.id);
            }
            z.nahe = [...new Set(ids)];
          } },
        { feld: 'gesperrt', titel: 'Gesperrt (Tag Stunden)', art: 'text', breite: '10em', platzhalter: 'z. B. Mi 1–2', anzeigen: sperrText, setzen: setzeMit(sperrLesen, 'gesperrt') },
      ],
      neu: (d) => {
        const name = eindeutigesKuerzel(d.raeume, 'Raum ');
        const r = { id: neueId(d.raeume, 'r', name), name, typ: 'klassenraum', kapazitaet: 30, nahe: [], gesperrt: [], abwesenheiten: [] };
        d.raeume.push(r);
        return r;
      },
      verweise: verweiseAuf('raeume'),
    });

    tabellen.klassen = Tabelle.erstelle({
      id: 'tabelle-klassen', beschriftung: 'Klassen', einzahl: 'Klasse', liste: (d) => d.klassen,
      spalten: [
        { feld: 'name', titel: 'Name', art: 'text', pflicht: true, breite: '6em' },
        { feld: 'stufe', titel: 'Stufe', art: 'zahl', min: 1, max: 13, ganz: true },
        { feld: 'schueler', titel: 'Schüler:innen', art: 'zahl', min: 1, max: 60, ganz: true },
        { feld: 'klassenlehrkraft', titel: 'Klassenlehrkraft', art: 'wahl', optionen: lehrerOptionen },
        { feld: 'heimatraum', titel: 'Heimatraum', art: 'wahl', optionen: raumOptionen },
        { feld: 'stundentafel', titel: 'Wochenstunden (Reiter Zuordnung)', art: 'anzeige', anzeigen: (z) => z.stundentafel.reduce((s, e) => s + e.stunden, 0) },
      ],
      neu: (d) => {
        const name = eindeutigesKuerzel(d.klassen, 'Klasse ');
        const k = { id: neueId(d.klassen, 'k', name), name, stufe: 1, schueler: 20, klassenlehrkraft: null, heimatraum: null, stundentafel: [] };
        d.klassen.push(k);
        return k;
      },
      verweise: verweiseAuf('klassen'),
    });

    tabellen.zeitraster = Tabelle.erstelle({
      id: 'tabelle-zeitraster', beschriftung: 'Unterrichtsstunden und Pausen', einzahl: 'Stunde',
      liste: (d) => d.zeitraster.stunden, schluessel: (z) => String(z.nr), name: (z) => `${z.nr}. Stunde`,
      spalten: [
        { feld: 'nr', titel: 'Stunde', art: 'anzeige' },
        { feld: 'von', titel: 'Beginn', art: 'text', platzhalter: '08:00', setzen: zeit('von') },
        { feld: 'bis', titel: 'Ende', art: 'text', platzhalter: '08:45', setzen: zeit('bis') },
        { feld: 'doppel', titel: 'Doppelstunde kann hier beginnen', art: 'bool',
          anzeigen: (z, d) => d.zeitraster.doppelstundenStart.includes(z.nr),
          setzen: (z, an, d) => {
            const liste = d.zeitraster.doppelstundenStart.filter((n) => n !== z.nr);
            if (an) liste.push(z.nr);
            d.zeitraster.doppelstundenStart = liste.sort((a, b) => a - b);
          } },
        { feld: 'pause', titel: 'Pause davor', art: 'bool',
          anzeigen: (z, d) => d.zeitraster.pausen.some((p) => p.vorStunde === z.nr),
          setzen: (z, an, d) => {
            const ohne = d.zeitraster.pausen.filter((p) => p.vorStunde !== z.nr);
            if (an) ohne.push({ vorStunde: z.nr, name: z.nr === 1 ? 'Frühaufsicht' : 'Pause', aufsichten: 1 });
            d.zeitraster.pausen = ohne.sort((a, b) => a.vorStunde - b.vorStunde);
          } },
        { feld: 'pausenname', titel: 'Name der Pause', art: 'text',
          anzeigen: (z, d) => d.zeitraster.pausen.find((p) => p.vorStunde === z.nr)?.name ?? '',
          setzen: (z, roh, d) => {
            const p = d.zeitraster.pausen.find((x) => x.vorStunde === z.nr);
            if (!p) return 'Vor dieser Stunde ist keine Pause – zuerst „Pause davor“ ankreuzen.';
            p.name = String(roh).trim();
          } },
        { feld: 'aufsichten', titel: 'Aufsichten', art: 'zahl', min: 0, max: 50, ganz: true,
          anzeigen: (z, d) => d.zeitraster.pausen.find((p) => p.vorStunde === z.nr)?.aufsichten ?? '',
          setzen: (z, roh, d) => {
            const p = d.zeitraster.pausen.find((x) => x.vorStunde === z.nr);
            if (!p) return 'Vor dieser Stunde ist keine Pause – zuerst „Pause davor“ ankreuzen.';
            const n = Number(String(roh).trim());
            if (!Number.isInteger(n) || n < 0 || n > 50) return 'Bitte eine ganze Zahl von 0 bis 50 eingeben.';
            p.aufsichten = n;
          } },
      ],
      neu: (d) => {
        const st = d.zeitraster.stunden;
        if (st.length >= 10) return 'Höchstens 10 Stunden je Tag.';
        const letzte = st[st.length - 1];
        const minuten = letzte ? Number(letzte.bis.slice(0, 2)) * 60 + Number(letzte.bis.slice(3)) + 5 : 8 * 60;
        const fmt = (m) => String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
        const s = { nr: st.length + 1, von: fmt(minuten), bis: fmt(minuten + 45) };
        st.push(s);
        return s;
      },
      entferne: (d, key) => {
        const st = d.zeitraster.stunden;
        if (String(st[st.length - 1]?.nr) !== key) return false; // nur die letzte Stunde
        const nr = st.pop().nr;
        d.zeitraster.pausen = d.zeitraster.pausen.filter((p) => p.vorStunde !== nr);
        d.zeitraster.doppelstundenStart = d.zeitraster.doppelstundenStart.filter((n) => n !== nr && n + 1 !== nr);
      },
      verweise: (d, z) => {
        if (z.nr !== d.zeitraster.stunden.length) return [{ text: 'Nur die letzte Stunde des Tages kann entfernt werden.' }];
        const treffer = [];
        d.plan.regelplan.forEach((s) => { if (s.stunde === z.nr) treffer.push({ text: `Regelplan ${d.klassen.find((k) => k.id === s.klasse)?.name} ${s.tag} ${s.stunde}. Stunde` }); });
        d.plan.vertretungen.forEach((s) => { if (s.stunde === z.nr) treffer.push({ text: `Vertretung ${s.datum} ${s.stunde}. Stunde` }); });
        for (const l of d.lehrkraefte) for (const g of l.gesperrt) if (g.stunden.includes(z.nr)) treffer.push({ text: `Lehrkraft ${l.kuerzel}: gesperrt ${g.tag}` });
        for (const r of d.raeume) for (const g of r.gesperrt) if (g.stunden.includes(z.nr)) treffer.push({ text: `Raum ${r.name}: gesperrt ${g.tag}` });
        return treffer;
      },
    });
  }

  function zeit(feld) {
    return (z, roh) => {
      const t = String(roh).trim().replace(/^(\d):/, '0$1:').replace('.', ':');
      if (!/^([01]\d|2[0-3]):[0-5]\d$/.test(t)) return 'Bitte eine Uhrzeit im Format HH:MM eingeben, z. B. 08:00.';
      z[feld] = t;
    };
  }

  /* ----------------------------- Aufbau ------------------------------- */

  function baue(ziel) {
    panel = ziel;
    const el = App.el;
    baueTabellen();
    const auswahl = el('div', { class: 'umschalter', role: 'group', 'aria-label': 'Bereich der Stammdaten' },
      ...BEREICHE.map(([id, titel]) => el('button', { type: 'button', class: 'knopf', id: 'stamm-' + id, 'aria-pressed': String(id === aktiv), text: titel, onclick: () => wechsle(id) })));
    const tage = el('fieldset', { class: 'tage', id: 'stamm-tage' }, el('legend', { text: 'Unterrichtstage' }),
      ...Kern.Modell.TAGE.map((t) => el('label', { class: 'feld-haken' },
        el('input', { type: 'checkbox', 'data-tag': t, onchange: (e) => setzeTag(t, e.target.checked, e.target) }), el('span', { text: t }))));
    const meldungTage = el('div', { class: 'meldungen', id: 'stamm-tage-meldung', 'aria-live': 'polite' });
    const schule = el('div', { class: 'formular', id: 'stamm-schule-formular' },
      ...[['name', 'Name der Schule'], ['schuljahr', 'Schuljahr']].map(([feld, titel]) => el('label', { class: 'feld' },
        el('span', { text: titel }),
        el('input', { type: 'text', 'data-schulfeld': feld, onchange: (e) => App.aendere(`Schule: ${titel} geändert`, (d) => { d.schule[feld] = e.target.value.trim(); }) }))));
    const listen = el('datalist', { id: 'liste-raumtypen' });
    const bereiche = {
      lehrkraefte: el('div', {}, el('p', { class: 'hinweis', text: 'Qualifikationen als „Fachkürzel Stufen“, mehrere durch Semikolon: MA 1–4; DE 1–4. Sperrzeiten als „Tag Stunden“: Fr 5–6; Mo 1.' }), tabellen.lehrkraefte.element),
      faecher: el('div', {}, el('p', { class: 'hinweis', text: 'Raumtyp leer lassen für Unterricht im Klassenraum; sonst turnhalle, schwimmhalle oder ein Fachraumtyp wie nawi.' }), tabellen.faecher.element),
      raeume: el('div', {}, tabellen.raeume.element),
      klassen: el('div', {}, el('p', { class: 'hinweis', text: 'Stundentafeln und Lehrkräfte je Fach werden im Reiter „Zuordnung“ gepflegt.' }), tabellen.klassen.element),
      zeitraster: el('div', {}, tage, meldungTage, el('p', { class: 'hinweis', text: 'Neue Stunden werden am Tagesende angehängt; entfernt werden kann nur die letzte Stunde.' }), tabellen.zeitraster.element),
      schule: el('div', {}, schule),
    };
    for (const [id, b] of Object.entries(bereiche)) { b.id = 'stamm-bereich-' + id; b.hidden = id !== aktiv; }
    panel.append(auswahl, listen, ...Object.values(bereiche));
    sichtbar = App.beobachteSichtbar(panel, render);
    render();
  }

  function wechsle(id) {
    aktiv = id;
    for (const [b] of BEREICHE) {
      panel.querySelector('#stamm-' + b).setAttribute('aria-pressed', String(b === id));
      panel.querySelector('#stamm-bereich-' + b).hidden = b !== id;
    }
    render();
  }

  function setzeTag(tag, an, eingabe) {
    const r = App.aendere(`Unterrichtstag ${tag} ${an ? 'hinzugefügt' : 'entfernt'}`, (d) => {
      const tage = new Set(d.zeitraster.tage);
      if (an) tage.add(tag); else tage.delete(tag);
      d.zeitraster.tage = Kern.Modell.TAGE.filter((t) => tage.has(t));
    });
    const meldung = panel.querySelector('#stamm-tage-meldung');
    if (!r.ok) {
      eingabe.checked = !an;
      meldung.replaceChildren(App.el('div', { class: 'meldung meldung-fehler', role: 'alert' },
        App.el('p', { class: 'meldung-titel', text: `⚠ ${tag} kann nicht ${an ? 'hinzugefügt' : 'entfernt'} werden – der Tag wird noch verwendet:` }),
        App.el('ul', { class: 'pfadliste' }, ...r.fehler.slice(0, 8).map((f) => App.el('li', {}, App.el('code', { text: f.pfad }), ': ' + f.meldung)))));
    } else meldung.replaceChildren();
  }

  function render() {
    const d = App.zustand.daten;
    const typen = new Set(['turnhalle', 'schwimmhalle', ...d.raeume.map((r) => r.fachraumtyp).filter(Boolean), ...d.faecher.map((f) => f.raumtyp).filter(Boolean)]);
    panel.querySelector('#liste-raumtypen').replaceChildren(...[...typen].map((t) => App.el('option', { value: t })));
    for (const input of panel.querySelectorAll('#stamm-tage input')) input.checked = d.zeitraster.tage.includes(input.dataset.tag);
    for (const input of panel.querySelectorAll('[data-schulfeld]')) if (input !== document.activeElement) input.value = d.schule[input.dataset.schulfeld] || '';
    tabellen[aktiv]?.render();
  }

  return { sichtbar: () => sichtbar(), baue, wechsle, qualiLesen, sperrLesen };
})();

/* ---- src/ui/26-zuordnung.js ---- */
/* ==========================================================================
 * Modul ZuordnungReiter (Oberfläche, Reiter „Zuordnung“)
 * Matrix Klasse × Fach (§7): Wochenstunden der Stundentafel, Haupt- und
 * Zweitlehrkraft (Kürzel), Doppelstunde gewünscht. Daneben Soll-/Ist-Stunden
 * je Lehrkraft mit Warnung bei Überschreitung.
 * Tastatur: Enter/↓/↑ wechseln in dieselbe Spalte der nächsten/vorigen Klasse.
 * ========================================================================== */
const ZuordnungReiter = (() => {
  'use strict';
  let panel = null;
  let sichtbar = () => {};
  let fokusNach = null;

  function baue(ziel) {
    panel = ziel;
    const el = App.el;
    panel.append(
      el('p', { class: 'hinweis', text: 'Je Zelle: Wochenstunden (Std), Hauptlehrkraft (H) und Zweitlehrkraft (Z) als Kürzel, D = Doppelstunde gewünscht. Leere Stunden entfernen das Fach aus der Stundentafel.' }),
      el('datalist', { id: 'liste-lehrkraefte' }),
      el('div', { class: 'meldungen', id: 'zuordnung-meldung', 'aria-live': 'polite' }),
      el('div', { class: 'tabellen-rahmen' }, el('table', { class: 'tabelle matrix', id: 'zuordnung-matrix' })),
      el('h3', { text: 'Soll- und Ist-Stunden laut Zuordnung' }),
      el('div', { class: 'tabellen-rahmen' }, el('table', { class: 'tabelle', id: 'zuordnung-soll-ist' })),
    );
    sichtbar = App.beobachteSichtbar(panel, render);
    render();
  }

  const kuerzel = (d, id) => d.lehrkraefte.find((l) => l.id === id)?.kuerzel || '';

  function render() {
    const d = App.zustand.daten;
    const el = App.el;
    const aktiv = document.activeElement;
    if (!fokusNach && aktiv && panel.contains(aktiv) && aktiv.dataset.zeile) fokusNach = { zeile: aktiv.dataset.zeile, spalte: aktiv.dataset.spalte };
    panel.querySelector('#liste-lehrkraefte').replaceChildren(...d.lehrkraefte.map((l) => el('option', { value: l.kuerzel, label: l.name })));
    const ix = Kern.Index.erstelle(d);
    const matrix = panel.querySelector('#zuordnung-matrix');
    const kopf = el('tr', {}, el('th', { scope: 'col', text: 'Klasse' }), ...d.faecher.map((f) => el('th', { scope: 'col', text: f.kuerzel, title: f.name })), el('th', { scope: 'col', class: 'zahl', text: 'Summe' }));
    const zeilen = d.klassen.map((k) => {
      const tafel = new Map(k.stundentafel.map((e) => [e.fach, e]));
      return el('tr', {}, el('th', { scope: 'row', text: k.name }),
        ...d.faecher.map((f) => zelle(d, ix, k, f, tafel.get(f.id))),
        el('td', { class: 'zahl', text: String(k.stundentafel.reduce((s, e) => s + e.stunden, 0)) }));
    });
    matrix.replaceChildren(el('caption', { text: 'Stundentafel und Lehrkräfte je Klasse und Fach' }), el('thead', {}, kopf),
      el('tbody', {}, ...(zeilen.length ? zeilen : [el('tr', {}, el('td', { colspan: String(d.faecher.length + 2), class: 'leise', text: 'Noch keine Klassen – bitte im Reiter „Stammdaten“ anlegen.' }))])));
    renderSollIst(d, ix);
    if (fokusNach) {
      const z = panel.querySelector(`[data-zeile="${CSS.escape(fokusNach.zeile)}"][data-spalte="${CSS.escape(fokusNach.spalte)}"]`);
      fokusNach = null;
      if (z) { z.focus(); z.select?.(); }
    }
  }

  function zelle(d, ix, k, f, eintrag) {
    const el = App.el;
    const zu = ix.zuordnungVon(k.id, f.id);
    const wo = `${f.kuerzel} ${k.name}`;
    const feld = (art, wert, beschr, extra = {}) => el('input', {
      type: 'text', class: 'eingabe-' + art, value: wert, 'data-zeile': k.id, 'data-spalte': f.id + '|' + art,
      'aria-label': `${beschr} ${wo}`, spellcheck: 'false', autocomplete: 'off', ...extra,
      onchange: (e) => uebernehme(k.id, f.id, art, e.target.value, e.target),
      onkeydown: (e) => tasten(e, k.id, f.id, art),
    });
    const td = el('td', { class: 'matrix-zelle' + (eintrag ? '' : ' leer') },
      el('label', {}, el('span', { text: 'Std' }), feld('std', eintrag ? String(eintrag.stunden) : '', 'Wochenstunden', { inputmode: 'numeric' })),
      el('label', {}, el('span', { text: 'H' }), feld('haupt', kuerzel(d, zu.haupt), 'Hauptlehrkraft', { list: 'liste-lehrkraefte' })),
      el('label', {}, el('span', { text: 'Z' }), feld('zweit', kuerzel(d, zu.zweit[0]), 'Zweitlehrkraft', { list: 'liste-lehrkraefte' })),
      el('label', { class: 'matrix-doppel' }, el('input', {
        type: 'checkbox', checked: !!eintrag?.doppelt, disabled: !eintrag, 'aria-label': `Doppelstunde gewünscht ${wo}`,
        'data-zeile': k.id, 'data-spalte': f.id + '|doppelt', onchange: (e) => uebernehme(k.id, f.id, 'doppelt', e.target.checked, e.target),
      }), el('span', { text: 'D' })));
    if (zu.haupt && eintrag && !ix.istQualifiziert(zu.haupt, f.id, k.stufe)) {
      td.classList.add('warnung');
      td.append(el('span', { class: 'marke', title: `${kuerzel(d, zu.haupt)} ist für ${f.kuerzel} in Stufe ${k.stufe} nicht qualifiziert (H8) – der Planer weist die Stunden neu zu`, text: '⚠ H8' }));
    }
    return td;
  }

  function tasten(e, klasse, fach, art) {
    const d = App.zustand.daten;
    const i = d.klassen.findIndex((k) => k.id === klasse);
    const r = e.key === 'Enter' || e.key === 'ArrowDown' ? 1 : e.key === 'ArrowUp' ? -1 : 0;
    if (e.key === 'Escape') { e.preventDefault(); render(); return; }
    if (!r) return;
    e.preventDefault();
    const ziel = d.klassen[i + r];
    const naechstes = ziel ? { zeile: ziel.id, spalte: fach + '|' + art } : null;
    const vorher = e.target.defaultValue;
    if (e.target.value !== vorher) {
      if (!uebernehme(klasse, fach, art, e.target.value, e.target, naechstes)) return;
    } else if (naechstes) {
      panel.querySelector(`[data-zeile="${CSS.escape(naechstes.zeile)}"][data-spalte="${CSS.escape(naechstes.spalte)}"]`)?.focus();
    }
  }

  /** Übernimmt eine Zelleneingabe; liefert true bei Erfolg. */
  function uebernehme(klasseId, fachId, art, roh, eingabe, danach) {
    let lokal = null;
    const d0 = App.zustand.daten;
    const wo = `${d0.faecher.find((f) => f.id === fachId)?.kuerzel} ${d0.klassen.find((k) => k.id === klasseId)?.name}`;
    const titel = { std: 'Wochenstunden', haupt: 'Hauptlehrkraft', zweit: 'Zweitlehrkraft', doppelt: 'Doppelstunde' }[art];
    const r = App.aendere(`Zuordnung ${wo}: ${titel} geändert`, (d) => {
      const k = d.klassen.find((x) => x.id === klasseId);
      const eintrag = k.stundentafel.find((e) => e.fach === fachId);
      if (art === 'std') {
        const t = String(roh).trim();
        if (t === '' || t === '0') {
          k.stundentafel = k.stundentafel.filter((e) => e.fach !== fachId);
          d.zuordnungen = d.zuordnungen.filter((z) => !(z.klasse === klasseId && z.fach === fachId));
          return;
        }
        const n = Number(t);
        if (!Number.isInteger(n) || n < 1 || n > 20) { lokal = 'Bitte eine ganze Zahl von 0 bis 20 eingeben.'; return false; }
        if (eintrag) eintrag.stunden = n;
        else {
          k.stundentafel.push({ fach: fachId, stunden: n, doppelt: false });
          const reihenfolge = d.faecher.map((f) => f.id);
          k.stundentafel.sort((a, b) => reihenfolge.indexOf(a.fach) - reihenfolge.indexOf(b.fach));
        }
        return;
      }
      if (!eintrag) { lokal = 'Bitte zuerst Wochenstunden eintragen.'; return false; }
      if (art === 'doppelt') { eintrag.doppelt = !!roh; return; }
      const t = String(roh).trim();
      let lehrkraft = null;
      if (t) {
        lehrkraft = d.lehrkraefte.find((l) => l.kuerzel.toLowerCase() === t.toLowerCase());
        if (!lehrkraft) { lokal = `Kürzel „${t}“ gibt es nicht.`; return false; }
      }
      // bisherige Einträge dieser Rolle entfernen, ebenso dieselbe Lehrkraft in der anderen Rolle
      d.zuordnungen = d.zuordnungen.filter((z) => !(z.klasse === klasseId && z.fach === fachId && (z.rolle === art || (lehrkraft && z.lehrkraft === lehrkraft.id))));
      if (lehrkraft) d.zuordnungen.push({ klasse: klasseId, fach: fachId, lehrkraft: lehrkraft.id, rolle: art });
    });
    const meldung = panel.querySelector('#zuordnung-meldung');
    if (lokal || !r.ok) {
      eingabe.setAttribute('aria-invalid', 'true');
      if (eingabe.type === 'checkbox') eingabe.checked = !eingabe.checked;
      meldung.replaceChildren(App.el('div', { class: 'meldung meldung-fehler', role: 'alert' },
        App.el('p', { class: 'meldung-titel', text: `⚠ ${titel} für ${wo} nicht übernommen` }),
        App.el('ul', { class: 'pfadliste' }, ...(lokal ? [{ meldung: lokal }] : r.fehler.slice(0, 8)).map((f) => App.el('li', {}, f.pfad ? App.el('code', { text: f.pfad }) : null, f.pfad ? ': ' : '', f.meldung)))));
      return false;
    }
    meldung.replaceChildren();
    if (danach) fokusNach = danach;
    render();
    return true;
  }

  function renderSollIst(d, ix) {
    const el = App.el;
    const haupt = new Map();
    const zweit = new Map();
    for (const z of d.zuordnungen) {
      const h = ix.tafel.get(z.klasse)?.get(z.fach)?.stunden || 0;
      const ziel = z.rolle === 'haupt' ? haupt : zweit;
      ziel.set(z.lehrkraft, (ziel.get(z.lehrkraft) || 0) + h);
    }
    const tabelle = panel.querySelector('#zuordnung-soll-ist');
    tabelle.replaceChildren(
      el('caption', { text: 'Stunden laut Festzuordnung (der Planer verteilt Stunden ohne Zuordnung und vergibt weitere Zweitbesetzungen)' }),
      el('thead', {}, el('tr', {}, ...['Kürzel', 'Name', 'Soll', 'Reserve', 'Max', 'Haupt', 'Zweit', 'Gesamt', 'Hinweis'].map((t, i) => el('th', { scope: 'col', class: i >= 2 && i <= 7 ? 'zahl' : null, text: t })))),
      el('tbody', {}, ...d.lehrkraefte.map((l) => {
        const h = haupt.get(l.id) || 0;
        const z = zweit.get(l.id) || 0;
        const g = h + z;
        const reserve = ix.reserve(l);
        let hinweis = '';
        let art = '';
        if (g > l.maxStunden) { hinweis = `⚠ ${g - l.maxStunden} über der Höchstgrenze (H7)`; art = 'fehler-text'; } else if (z > 0 && g > l.sollStunden - reserve) { hinweis = '⚠ Zweitbesetzung greift die Vertretungsreserve an (H11)'; art = 'fehler-text'; } else if (g > l.sollStunden - reserve) { hinweis = 'Reserve wird für Hauptunterricht genutzt'; art = 'warnung-text'; } else if (g < l.minStunden) { hinweis = `unter Mindeststunden (${l.minStunden})`; art = 'leise'; }
        return el('tr', { 'data-lehrkraft': l.id }, el('th', { scope: 'row', text: l.kuerzel }), el('td', { text: l.name }),
          ...[l.sollStunden, reserve, l.maxStunden, h, z, g].map((x) => el('td', { class: 'zahl', text: String(x) })),
          el('td', { class: art, text: hinweis }));
      })));
  }

  return { sichtbar: () => sichtbar(), baue };
})();

/* ---- src/ui/30-daten.js ---- */
/* ==========================================================================
 * Modul DatenReiter (Oberfläche, Reiter „Daten“)
 * JSON exportieren (gesamt oder Teil), importieren (Dateiauswahl oder
 * Drag-and-drop), Daten zurücksetzen, Speicherstand anzeigen (§7, §8).
 * ========================================================================== */
const DatenReiter = (() => {
  'use strict';
  let panel = null;
  let sichtbar = () => {};
  let meldungen = null;

  /* ---------------------------- Aufbau ---------------------------------- */

  function baue(ziel) {
    panel = ziel;
    const el = App.el;
    const dateiwahl = el('input', {
      type: 'file', accept: '.json,application/json', id: 'daten-datei', class: 'versteckt',
      onchange: (e) => { const f = e.target.files[0]; e.target.value = ''; if (f) importiereDatei(f); },
    });
    meldungen = el('div', { id: 'daten-meldungen', class: 'meldungen', 'aria-live': 'polite' });
    panel.append(
      el('section', { class: 'abschnitt', 'aria-labelledby': 'daten-stand-titel' },
        el('h3', { id: 'daten-stand-titel', text: 'Aktueller Stand' }),
        el('dl', { id: 'daten-uebersicht', class: 'uebersicht' }),
        el('p', { id: 'daten-speicherstand' })),
      el('section', { class: 'abschnitt', 'aria-labelledby': 'daten-export-titel' },
        el('h3', { id: 'daten-export-titel', text: 'Exportieren' }),
        el('p', { class: 'hinweis', text: 'Das Programm speichert nichts selbst. Sichern Sie Ihre Arbeit als JSON-Datei und importieren Sie sie später wieder.' }),
        el('div', { class: 'knopfleiste' },
          el('button', { type: 'button', class: 'knopf knopf-primaer', id: 'export-gesamt', text: 'Alles exportieren', onclick: () => exportiere('gesamt') }),
          el('button', { type: 'button', class: 'knopf', id: 'export-stammdaten', text: 'Nur Stammdaten exportieren', onclick: () => exportiere('stammdaten') }),
          el('button', { type: 'button', class: 'knopf', id: 'export-plan', text: 'Nur Plan exportieren', onclick: () => exportiere('plan') }))),
      el('section', { class: 'abschnitt', 'aria-labelledby': 'daten-import-titel' },
        el('h3', { id: 'daten-import-titel', text: 'Importieren' }),
        el('div', { class: 'ablage', id: 'daten-ablage' },
          el('p', { text: 'JSON-Datei hierher ziehen (oder irgendwo auf die Seite) oder' }),
          el('button', { type: 'button', class: 'knopf', id: 'import-waehlen', text: 'Datei auswählen …', onclick: () => dateiwahl.click() }),
          dateiwahl),
        meldungen),
      el('section', { class: 'abschnitt', 'aria-labelledby': 'daten-reset-titel' },
        el('h3', { id: 'daten-reset-titel', text: 'Zurücksetzen' }),
        el('button', { type: 'button', class: 'knopf knopf-gefahr', id: 'daten-zuruecksetzen', text: 'Alle Daten zurücksetzen …', onclick: zuruecksetzen })),
    );
    richteSeitenAblageEin();
    sichtbar = App.beobachteSichtbar(panel, aktualisiere);
    aktualisiere();
  }

  /** Datei-Drag-and-drop auf die ganze Seite (andere Drags, z. B. im Plan, bleiben unberührt). */
  function richteSeitenAblageEin() {
    let tiefe = 0;
    const hatDateien = (e) => Array.from(e.dataTransfer?.types || []).includes('Files');
    document.addEventListener('dragenter', (e) => { if (hatDateien(e)) { tiefe++; document.body.classList.add('ablage-aktiv'); } });
    document.addEventListener('dragleave', (e) => { if (hatDateien(e) && --tiefe <= 0) { tiefe = 0; document.body.classList.remove('ablage-aktiv'); } });
    document.addEventListener('dragover', (e) => { if (hatDateien(e)) { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; } });
    document.addEventListener('drop', (e) => {
      if (!hatDateien(e)) return;
      e.preventDefault();
      tiefe = 0;
      document.body.classList.remove('ablage-aktiv');
      const datei = e.dataTransfer.files[0];
      if (!datei) return;
      App.aktiviere('daten');
      importiereDatei(datei);
    });
  }

  /* ---------------------------- Anzeige --------------------------------- */

  function aktualisiere() {
    const d = App.zustand.daten;
    const el = App.el;
    const p = d.plan || {};
    const zeilen = [
      ['Schule', d.schule?.name || '–'],
      ['Schuljahr', d.schule?.schuljahr || '–'],
      ['Lehrkräfte', d.lehrkraefte.length],
      ['Fächer', d.faecher.length],
      ['Räume', d.raeume.length],
      ['Klassen', d.klassen.length],
      ['Zuordnungen', d.zuordnungen.length],
      ['Stunden im Regelplan', (p.regelplan || []).length],
      ['Vertretungseinträge', (p.vertretungen || []).length + (p.aufsichtsVertretungen || []).length],
    ];
    const dl = panel.querySelector('#daten-uebersicht');
    dl.replaceChildren(...zeilen.flatMap(([k, v]) => [el('dt', { text: k }), el('dd', { text: String(v), 'data-feld': k })]));
    dl.append(...planpruefung(d));
    const stand = panel.querySelector('#daten-speicherstand');
    const exportText = App.zustand.letzterExport ? 'Zuletzt exportiert: ' + formatiere(App.zustand.letzterExport) : 'Noch nicht exportiert.';
    stand.replaceChildren(
      el('span', { text: exportText }),
      document.createTextNode(' · '),
      App.zustand.geaendert
        ? el('strong', { class: 'warnung-text', text: '⚠ Ungespeicherte Änderungen' })
        : el('span', { text: 'Keine ungespeicherten Änderungen' }));
  }

  /** Prüfung des Regelplans: harte Regeln (gültig/ungültig) und Kostenvektor (§3, §4). */
  function planpruefung(d) {
    const el = App.el;
    if (!(d.plan?.regelplan || []).length) return [];
    let verstoesse;
    let bewertung;
    try {
      verstoesse = Kern.Regeln.pruefeHart(d);
      bewertung = Kern.Kosten.bewerte(d, undefined, { mitPosten: false });
    } catch (e) {
      return [el('dt', { text: 'Regelplan' }), el('dd', { class: 'warnung-text', text: '⚠ Prüfung nicht möglich: ' + e.message })];
    }
    const zahl = Kern.Regeln.zaehle(verstoesse);
    const status = verstoesse.length
      ? el('dd', { 'data-feld': 'Regelplan', class: 'fehler-text', title: verstoesse.slice(0, 20).map((v) => v.regel + ': ' + v.text).join('\n') },
        `⚠ ungültig – ${verstoesse.length} Verstoß/Verstöße gegen harte Regeln (${Object.entries(zahl).map(([r, n]) => `${r} ×${n}`).join(', ')})`)
      : el('dd', { 'data-feld': 'Regelplan', text: '✓ gültig – keine Verstöße gegen harte Regeln' });
    return [
      el('dt', { text: 'Regelplan' }), status,
      el('dt', { text: 'Kostenvektor' }), el('dd', { 'data-feld': 'Kostenvektor', text: Kern.Kosten.formatiere(bewertung.vektor) }),
    ];
  }

  function formatiere(zeitpunkt) {
    const d = zeitpunkt instanceof Date ? zeitpunkt : new Date(zeitpunkt);
    if (Number.isNaN(d.getTime())) return String(zeitpunkt);
    return d.toLocaleString('de-DE', { dateStyle: 'medium', timeStyle: 'short' });
  }

  /** Meldung oberhalb aller älteren anzeigen (ersetzt vorherige). */
  function zeige(art, titel, ...inhalt) {
    const el = App.el;
    const symbol = { ok: '✓', fehler: '⚠', info: 'ℹ', warnung: '⚠' }[art];
    meldungen.replaceChildren(el('div', { class: 'meldung meldung-' + art, role: art === 'fehler' ? 'alert' : 'status' },
      el('p', { class: 'meldung-titel' }, el('span', { 'aria-hidden': 'true', text: symbol + ' ' }), titel),
      ...inhalt));
  }

  function liste(eintraege, klasse) {
    const el = App.el;
    return el('ul', { class: 'pfadliste ' + (klasse || '') },
      ...eintraege.map((f) => el('li', {}, f.pfad ? el('code', { text: f.pfad }) : null, f.pfad ? ': ' : '', f.meldung)));
  }

  /* ---------------------------- Export ---------------------------------- */

  function exportiere(teil) {
    const jetzt = new Date();
    const { dateiname, text } = Kern.Io.exportiere(App.zustand.daten, { teil, jetzt });
    herunterladen(dateiname, text);
    App.vermerkeExport(jetzt, teil === 'gesamt');
    zeige('ok', `Exportiert: ${dateiname}`, App.el('p', { text: teil === 'gesamt'
      ? 'Die Datei enthält den vollständigen Stand.'
      : `Die Datei enthält nur: ${Kern.Io.TEILNAMEN[teil]}.` }));
  }

  /** Download über Blob und <a download> (§8). */
  function herunterladen(dateiname, text) {
    const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    const a = App.el('a', { href: url, download: dateiname, class: 'versteckt' });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  }

  /* ---------------------------- Import ---------------------------------- */

  /** Liest eine Datei als Text (FileReader, §8). */
  function leseDatei(datei) {
    return new Promise((erfuellen, ablehnen) => {
      const r = new FileReader();
      r.onload = () => erfuellen(String(r.result));
      r.onerror = () => ablehnen(r.error || new Error('Datei konnte nicht gelesen werden'));
      r.readAsText(datei, 'utf-8');
    });
  }

  async function importiereDatei(datei) {
    let text;
    try {
      text = await leseDatei(datei);
    } catch (e) {
      zeige('fehler', `Import abgelehnt: ${datei.name}`, App.el('p', { text: e.message + ' Es wurden keine Daten verändert.' }));
      return false;
    }
    return importiereText(datei.name, text);
  }

  async function importiereText(name, text, optionen = {}) {
    const el = App.el;
    const erg = Kern.Io.importiere(text, App.zustand.daten, optionen);
    if (!erg.ok) {
      const n = erg.fehler.length;
      const inhalt = [el('p', { text: `Die Datei enthält ${n === 1 ? 'einen Fehler' : n + ' Fehler'}. Es wurden keine Daten verändert.` }), liste(erg.fehler)];
      if (erg.planUnvertraeglich) {
        inhalt.splice(1, 0, el('p', { text: 'Die Stammdaten selbst sind in Ordnung, aber der vorhandene Plan verweist auf Einträge, die es darin nicht mehr gibt.' }),
          el('button', { type: 'button', class: 'knopf', id: 'import-plan-verwerfen', text: 'Stammdaten übernehmen und Plan verwerfen',
            onclick: () => importiereText(name, text, { ...optionen, planVerwerfen: true }) }));
      }
      zeige('fehler', `Import abgelehnt: ${name}`, ...inhalt);
      return false;
    }
    if (!Kern.Modell.istLeer(App.zustand.daten)) {
      const bereich = { gesamt: 'alle vorhandenen Daten', stammdaten: 'die vorhandenen Stammdaten', plan: 'den vorhandenen Plan' }[erg.teil]
        + (optionen.planVerwerfen ? ' und verwirft den vorhandenen Plan' : '');
      const ja = await bestaetigeErsetzen('Vorhandene Daten ersetzen?', `Der Import von „${name}“ ersetzt ${bereich}.`);
      if (!ja) {
        zeige('info', 'Import abgebrochen', el('p', { text: 'Es wurden keine Daten verändert.' }));
        return false;
      }
    }
    // Ein vollständiger Import entspricht einem gespeicherten Stand; nach einem Teil-Import ist der Gesamtstand neu.
    App.setzeDaten(erg.zustand, {
      beschreibung: `Import ${name}`,
      geaendert: erg.teil !== 'gesamt',
      letzterExport: erg.teil === 'gesamt' ? (erg.zustand.exportedAt || null) : App.zustand.letzterExport,
    });
    const inhalt = [el('p', { text: `Übernommen: ${Kern.Io.TEILNAMEN[erg.teil]}.` + (erg.migriertVon !== undefined ? ` Die Datei wurde von Schemaversion ${erg.migriertVon} aktualisiert.` : '') })];
    if (erg.warnungen.length) inhalt.push(el('p', { text: `Hinweise (${erg.warnungen.length}):` }), liste(erg.warnungen, 'hinweise'));
    zeige(erg.warnungen.length ? 'warnung' : 'ok', `Importiert: ${name}`, ...inhalt);
    return true;
  }

  /**
   * Rückfrage vor dem Überschreiben mit der Möglichkeit, vorher zu exportieren (§8).
   * @returns {Promise<boolean>}
   */
  async function bestaetigeErsetzen(titel, text) {
    for (;;) {
      const wert = await Dialog.frage({
        titel,
        text: text + (App.zustand.geaendert ? ' Es gibt ungespeicherte Änderungen.' : '') + ' Sie können den aktuellen Stand vorher exportieren.',
        knoepfe: [
          { text: 'Aktuellen Stand exportieren', wert: 'export' },
          { text: 'Ersetzen', wert: 'ersetzen', art: 'gefahr' },
          { text: 'Abbrechen', wert: 'abbrechen', fokus: true },
        ],
      });
      if (wert === 'export') { exportiere('gesamt'); continue; }
      return wert === 'ersetzen';
    }
  }

  async function zuruecksetzen() {
    if (!Kern.Modell.istLeer(App.zustand.daten)) {
      const ja = await bestaetigeErsetzen('Alle Daten zurücksetzen?', 'Alle Stammdaten, Pläne und Einstellungen werden gelöscht.');
      if (!ja) return;
    }
    App.setzeDaten(Kern.Modell.leererZustand(), { geaendert: false, letzterExport: null, beschreibung: 'Daten zurückgesetzt' });
    zeige('ok', 'Daten zurückgesetzt', App.el('p', { text: 'Das Programm ist jetzt leer.' }));
  }

  return { sichtbar: () => sichtbar(), baue, importiereDatei, importiereText, exportiere };
})();

/* ---- src/ui/40-planung.js ---- */
/* ==========================================================================
 * Modul PlanungReiter (Oberfläche, Reiter „Planung“)
 * Optionen (Zeitbudget, Startwert, Zweitbesetzung, Vertretungsreserve,
 * Gewichte), „Plan erstellen“ im Web Worker mit Fortschritt und Abbruch,
 * Ergebnis mit Kostenvektor, Vorprüfung, Ausfall und Hinweisen (§6, §7).
 * ========================================================================== */
const PlanungReiter = (() => {
  'use strict';
  let panel = null;
  let laufId = 0;
  let laeuft = false;
  let lokalerLauf = null;

  const PHASEN = { konflikte: 'Stunden setzen und Konflikte lösen', optimierung: 'Nachoptimierung', abschluss: 'Räume, Zweitbesetzung, Aufsichten' };

  /** Eingabefelder für Einstellungen: [Schlüssel, Beschriftung, min, max, Schritt]. */
  const FELDER = [
    ['zeitbudgetSekunden', 'Zeitbudget (Sekunden)', 1, 600, 1],
    ['zufallsStartwert', 'Startwert (gleicher Wert ⇒ gleicher Plan)', 0, 4294967295, 1],
    ['vertretungsreserveProzent', 'Vertretungsreserve (% der Sollstunden)', 0, 50, 1],
  ];

  function baue(ziel) {
    panel = ziel;
    const el = App.el;
    const felder = el('div', { class: 'formular' },
      ...FELDER.map(([schluessel, text, min, max, schritt]) => feld(schluessel, text, min, max, schritt)),
      el('label', { class: 'feld feld-haken' },
        el('input', { type: 'checkbox', id: 'opt-zweitbesetzungErlaubt', onchange: (e) => setze('zweitbesetzungErlaubt', e.target.checked) }),
        el('span', { text: 'Zweitbesetzung vergeben (freie Kontingente als zweite Lehrkraft)' })));
    const gewichte = el('details', { class: 'gewichte' },
      el('summary', { text: 'Gewichte der weichen Regeln (Ziel 6)' }),
      el('div', { class: 'formular formular-gewichte' },
        ...Kern.Kosten.WEICH.map((w) => feld('gewichte.' + w, `${w} – ${Kern.Kosten.WTITEL[w]}`, 0, 1000, 1))));
    panel.append(
      el('section', { class: 'abschnitt', 'aria-labelledby': 'planung-optionen-titel' },
        el('h3', { id: 'planung-optionen-titel', text: 'Optionen' }), felder, gewichte),
      el('section', { class: 'abschnitt', 'aria-labelledby': 'planung-lauf-titel' },
        el('h3', { id: 'planung-lauf-titel', text: 'Plan erstellen' }),
        el('div', { class: 'knopfleiste' },
          el('button', { type: 'button', class: 'knopf knopf-primaer', id: 'plan-erstellen', text: 'Plan erstellen', onclick: erstelle }),
          el('button', { type: 'button', class: 'knopf', id: 'plan-abbrechen', text: 'Abbrechen (beste Lösung übernehmen)', disabled: true, onclick: abbrechen })),
        el('div', { class: 'fortschritt', id: 'planung-fortschritt', hidden: true },
          el('progress', { id: 'planung-balken', max: '1', value: '0', 'aria-label': 'Fortschritt der Planung' }),
          el('p', { id: 'planung-status', 'aria-live': 'polite' }))),
      el('section', { class: 'abschnitt', id: 'planung-ergebnis', 'aria-live': 'polite' }),
    );
    App.beobachte(zeigeEinstellungen);
    zeigeEinstellungen();
  }

  function feld(schluessel, text, min, max, schritt) {
    const el = App.el;
    const id = 'opt-' + schluessel.replace('.', '-');
    return el('label', { class: 'feld', for: id },
      el('span', { text }),
      el('input', {
        type: 'number', id, min: String(min), max: String(max), step: String(schritt), 'data-schluessel': schluessel,
        onchange: (e) => {
          const wert = Number(e.target.value);
          const ok = e.target.value !== '' && Number.isFinite(wert) && wert >= min && wert <= max && (schritt !== 1 || Number.isInteger(wert));
          e.target.setAttribute('aria-invalid', String(!ok));
          const hinweis = e.target.parentElement.querySelector('.feld-fehler');
          if (!ok) {
            const meldung = `Bitte eine ganze Zahl von ${min} bis ${max} eingeben.`;
            if (hinweis) hinweis.textContent = '⚠ ' + meldung;
            else e.target.parentElement.append(el('span', { class: 'feld-fehler', text: '⚠ ' + meldung }));
            return;
          }
          hinweis?.remove();
          setze(schluessel, wert);
        },
      }));
  }

  /** Schreibt eine Einstellung in den Zustand. */
  function setze(schluessel, wert) {
    App.aendere(`Einstellung ${schluessel} = ${wert}`, (d) => {
      if (schluessel.startsWith('gewichte.')) d.einstellungen.gewichte[schluessel.slice(9)] = wert;
      else d.einstellungen[schluessel] = wert;
    }, { pruefen: false });
  }

  function zeigeEinstellungen() {
    const e = App.zustand.daten.einstellungen;
    for (const input of panel.querySelectorAll('input[data-schluessel]')) {
      if (input === document.activeElement || input.getAttribute('aria-invalid') === 'true') continue;
      const k = input.dataset.schluessel;
      input.value = String(k.startsWith('gewichte.') ? e.gewichte[k.slice(9)] : e[k]);
    }
    panel.querySelector('#opt-zweitbesetzungErlaubt').checked = !!e.zweitbesetzungErlaubt;
  }

  /* ----------------------------- Lauf ---------------------------------- */

  async function erstelle() {
    if (laeuft) return;
    const d = App.zustand.daten;
    const ergebnis = panel.querySelector('#planung-ergebnis');
    const el = App.el;
    const { fehler } = Kern.Schema.validiere(Kern.Schema.normalisiere(Kern.Hilfen.tiefeKopie(d)));
    if (fehler.length) {
      ergebnis.replaceChildren(el('div', { class: 'meldung meldung-fehler', role: 'alert' },
        el('p', { class: 'meldung-titel', text: '⚠ Die Daten sind nicht vollständig gültig' }),
        el('p', { text: `${fehler.length} Fehler, z. B. ${fehler[0].pfad}: ${fehler[0].meldung}` })));
      return;
    }
    if (!d.klassen.length) {
      ergebnis.replaceChildren(el('div', { class: 'meldung meldung-info', role: 'status' },
        el('p', { class: 'meldung-titel', text: 'ℹ Keine Klassen vorhanden' }),
        el('p', { text: 'Bitte zuerst Stammdaten erfassen oder im Reiter „Daten“ importieren.' })));
      return;
    }
    if (d.plan.regelplan.length) {
      const wert = await Dialog.frage({
        titel: 'Regelplan neu erstellen?',
        text: 'Der vorhandene Regelplan und die Pausenaufsichten werden ersetzt. Vertretungen bleiben erhalten. Sie können den aktuellen Stand vorher exportieren.',
        knoepfe: [
          { text: 'Aktuellen Stand exportieren', wert: 'export' },
          { text: 'Neu erstellen', wert: 'ja', art: 'primaer' },
          { text: 'Abbrechen', wert: 'abbrechen', fokus: true },
        ],
      });
      if (wert === 'export') DatenReiter.exportiere('gesamt');
      if (wert !== 'ja' && wert !== 'export') return;
      if (wert === 'export') {
        const nochmal = await Dialog.frage({ titel: 'Regelplan neu erstellen?', text: 'Der Stand wurde exportiert.', knoepfe: [{ text: 'Neu erstellen', wert: 'ja', art: 'primaer' }, { text: 'Abbrechen', wert: 'abbrechen', fokus: true }] });
        if (nochmal !== 'ja') return;
      }
    }
    starteLauf(Kern.Hilfen.tiefeKopie(d));
  }

  function starteLauf(zustand) {
    laeuft = true;
    const id = ++laufId;
    const beginn = Date.now();
    zeigeLaufend(true);
    aktualisiereFortschritt({ phase: 'konflikte', anteil: 0, konflikte: 0, weich: null, restMs: zustand.einstellungen.zeitbudgetSekunden * 1000 });
    const fertig = (antwort) => {
      if (id !== laufId) return;
      laeuft = false;
      lokalerLauf = null;
      zeigeLaufend(false);
      uebernehme(antwort, Date.now() - beginn);
    };
    const fehler = (e) => {
      if (id !== laufId) return;
      laeuft = false;
      zeigeLaufend(false);
      panel.querySelector('#planung-ergebnis').replaceChildren(App.el('div', { class: 'meldung meldung-fehler', role: 'alert' },
        App.el('p', { class: 'meldung-titel', text: '⚠ Planung fehlgeschlagen' }), App.el('p', { text: e.message })));
    };
    if (Rechenkern.starte()) {
      Rechenkern.anfrage('planen', { zustand }, aktualisiereFortschritt).then(fertig, fehler);
    } else {
      // Rückfall ohne Worker: in Zeitscheiben im Hauptthread
      lokalerLauf = Kern.Planer.starte(zustand);
      const takt = () => {
        try {
          const ende = lokalerLauf.schritt(30);
          aktualisiereFortschritt(lokalerLauf.fortschritt());
          if (ende) fertig(lokalerLauf.ergebnis()); else setTimeout(takt, 0);
        } catch (e) { fehler(e); }
      };
      setTimeout(takt, 0);
    }
  }

  function abbrechen() {
    if (!laeuft) return;
    if (lokalerLauf) lokalerLauf.abbrechen(); else Rechenkern.sende('abbrechen');
    panel.querySelector('#planung-status').textContent = 'Abbruch angefordert – beste bisherige Lösung wird übernommen …';
  }

  function zeigeLaufend(an) {
    panel.querySelector('#plan-erstellen').disabled = an;
    panel.querySelector('#plan-abbrechen').disabled = !an;
    panel.querySelector('#planung-fortschritt').hidden = false;
    panel.setAttribute('aria-busy', String(an));
  }

  function aktualisiereFortschritt(f) {
    panel.querySelector('#planung-balken').value = f.anteil;
    const teile = [`Phase: ${PHASEN[f.phase] || f.phase}`];
    if (f.phase === 'konflikte') teile.push(`Konflikte: ${f.konflikte}`);
    if (f.weich !== null && f.weich !== undefined) teile.push(`Zwischenwert der Optimierung: ${f.weich}`);
    if (f.ausfall) teile.push(`Ausfall bisher: ${f.ausfall} Stunde(n)`);
    teile.push(`noch höchstens ${Math.ceil(f.restMs / 1000)} s`);
    panel.querySelector('#planung-status').textContent = teile.join(' · ');
  }

  /* ---------------------------- Ergebnis -------------------------------- */

  function uebernehme(antwort, dauerMs) {
    const { plan, bericht } = antwort;
    panel.querySelector('#planung-balken').value = 1;
    panel.querySelector('#planung-status').textContent = `Fertig nach ${(dauerMs / 1000).toFixed(1)} s${bericht.statistik.abgebrochen ? ' (abgebrochen)' : ''}.`;
    App.aendere('Regelplan erstellt', (d) => {
      d.plan.regelplan = plan.regelplan;
      d.plan.aufsichten = plan.aufsichten;
    }, { pruefen: false });
    zeigeErgebnis(bericht, dauerMs);
  }

  function zeigeErgebnis(b, dauerMs) {
    const el = App.el;
    const ix = Kern.Index.erstelle(App.zustand.daten);
    const s = b.statistik;
    const kopf = s.abgebrochen ? 'Plan erstellt (abgebrochen – beste bisherige Lösung übernommen)' : 'Plan erstellt und übernommen';
    const tabelle = el('table', { class: 'tabelle', id: 'planung-vektor' },
      el('caption', { text: 'Kostenvektor (lexikografisch: ein früheres Ziel geht immer vor)' }),
      el('thead', {}, el('tr', {}, el('th', { scope: 'col', text: 'Ziel' }), el('th', { scope: 'col', text: 'Bedeutung' }), el('th', { scope: 'col', class: 'zahl', text: 'Wert' }))),
      el('tbody', {}, ...Kern.Kosten.ZIELE.map((k, i) => el('tr', { 'data-ziel': k },
