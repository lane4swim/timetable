  }

  function startKosten(p, i, s) {
    const it = p.items[i];
    let k = p.occT[it.t * p.NS + s] * 2 + gesperrtWert(p, i, s) * 3;
    if (it.typ >= 0 && p.useTyp[it.typ * p.NS + s] >= p.kapTyp[it.typ * p.NS + s]) k += 2;
    return k;
  }

  /* ================== Konfliktzählung und Züge ======================== */

  function gesperrtWert(p, i, s) {
    const it = p.items[i];
    return p.gesperrt[it.t * p.NS + s] + (it.typ < 0 ? p.heimatGesperrt[it.c * p.NS + s] : 0);
  }

  function setze(p, i, s) {
    const it = p.items[i];
    p.pos[i] = s;
    p.grid[it.c * p.NS + s] = i;
    p.occT[it.t * p.NS + s]++;
    if (it.typ >= 0) p.useTyp[it.typ * p.NS + s]++;
    p.stundenJeLehrkraft[it.t]++;
  }

  function loese(p, i) {
    const it = p.items[i];
    const s = p.pos[i];
    if (p.grid[it.c * p.NS + s] === i) p.grid[it.c * p.NS + s] = -1;
    p.occT[it.t * p.NS + s]--;
    if (it.typ >= 0) p.useTyp[it.typ * p.NS + s]--;
    p.stundenJeLehrkraft[it.t]--;
    p.pos[i] = -1;
  }

  function gesamtKonflikte(p) {
    let k = 0;
    for (let x = 0; x < p.occT.length; x++) if (p.occT[x] > 1) k += p.occT[x] - 1;
    for (let x = 0; x < p.typen.length * p.NS; x++) if (p.useTyp[x] > p.kapTyp[x]) k += p.useTyp[x] - p.kapTyp[x];
    p.items.forEach((it, i) => { if (p.pos[i] >= 0) k += gesperrtWert(p, i, p.pos[i]); });
    return k;
  }

  /** Konfliktbeitrag rund um die Stunden `idx` an ihren aktuellen Positionen plus Slots `extra`. */
  function lokal(p, idx, slots) {
    const tKeys = [];
    const yKeys = [];
    for (const i of idx) {
      const it = p.items[i];
      for (const s of slots) {
        const kt = it.t * p.NS + s;
        if (!tKeys.includes(kt)) tKeys.push(kt);
        if (it.typ >= 0) { const ky = it.typ * p.NS + s; if (!yKeys.includes(ky)) yKeys.push(ky); }
      }
    }
    let k = 0;
    for (const kt of tKeys) if (p.occT[kt] > 1) k += p.occT[kt] - 1;
    for (const ky of yKeys) if (p.useTyp[ky] > p.kapTyp[ky]) k += p.useTyp[ky] - p.kapTyp[ky];
    for (const i of idx) if (p.pos[i] >= 0) k += gesperrtWert(p, i, p.pos[i]);
    return k;
  }

  /** Tauscht die Plätze zweier Stunden derselben Klasse. */
  function tausche(p, i, j) {
    const si = p.pos[i];
    const sj = p.pos[j];
    loese(p, i);
    loese(p, j);
    setze(p, i, sj);
    setze(p, j, si);
  }

  /** Verschiebt die letzte Stunde eines Tages ans Ende eines anderen Tages der Klasse. */
  function verschiebeProfil(p, i, zielTag) {
    const it = p.items[i];
    const quelleTag = Math.floor(p.pos[i] / p.H);
    loese(p, i);
    p.laenge[it.c * p.T + quelleTag]--;
    const s = zielTag * p.H + p.laenge[it.c * p.T + zielTag];
    p.laenge[it.c * p.T + zielTag]++;
    setze(p, i, s);
    return quelleTag;
  }

  const istLetzte = (p, i) => {
    const s = p.pos[i];
    const d = Math.floor(s / p.H);
    return s % p.H === p.laenge[p.items[i].c * p.T + d] - 1;
  };

  /** Mögliche Züge für Stunde i: Tausch mit jeder anderen Stunde der Klasse, Profilverschiebung. */
  function zuege(p, i) {
    const it = p.items[i];
    const liste = [];
    for (const j of p.itemsJeKlasse[it.c]) {
      if (j === i || p.pos[j] < 0) continue;
      const jt = p.items[j];
      if (jt.t === it.t && jt.f === it.f) continue;
      liste.push({ art: 't', j });
    }
    if (istLetzte(p, i)) {
      const dQ = Math.floor(p.pos[i] / p.H);
      for (let d = 0; d < p.T; d++) if (d !== dQ && p.laenge[it.c * p.T + d] < p.H) liste.push({ art: 'p', d });
    }
    return liste;
  }

  /** Führt einen Zug aus und liefert eine Rücknahmefunktion sowie die betroffenen Slots. */
  function fuehreAus(p, i, zug) {
    if (zug.art === 't') {
      const si = p.pos[i];
      const sj = p.pos[zug.j];
      tausche(p, i, zug.j);
      return { slots: [si, sj], idx: [i, zug.j], zurueck: () => tausche(p, i, zug.j) };
    }
    const si = p.pos[i];
    const quelle = verschiebeProfil(p, i, zug.d);
    const neu = p.pos[i];
    return { slots: [si, neu], idx: [i], zurueck: () => verschiebeProfil(p, i, quelle) };
  }

  /** Konflikt-Delta eines Zugs (führt ihn aus, misst, nimmt ihn zurück, wenn `behalten` false). */
  function konfliktDelta(p, i, zug) {
    const vorherIdx = zug.art === 't' ? [i, zug.j] : [i];
    const vorherSlots = zug.art === 't' ? [p.pos[i], p.pos[zug.j]] : [p.pos[i], zug.d * p.H + p.laenge[p.items[i].c * p.T + zug.d]];
    const vorher = lokal(p, vorherIdx, vorherSlots);
    const r = fuehreAus(p, i, zug);
    const nachher = lokal(p, r.idx, vorherSlots);
    return { delta: nachher - vorher, r };
  }

  /* ======================= Konfliktsuche (Tabu) ======================= */

  function konfliktSuche(p, zufall, statistik) {
    const n = p.items.length;
    const maxIter = Math.max(20000, 300 * n);
    const tabu = new Int32Array(n * p.NS);
    let iter = 0;
    let besteKonflikte = p.konflikte;
    let ohneVerbesserung = 0;

    function konfliktbehaftet(i) {
      const s = p.pos[i];
      if (s < 0) return false;
      const it = p.items[i];
      return p.occT[it.t * p.NS + s] > 1 || gesperrtWert(p, i, s) > 0
        || (it.typ >= 0 && p.useTyp[it.typ * p.NS + s] > p.kapTyp[it.typ * p.NS + s]);
    }

    function lauf(schritte) {
      for (let x = 0; x < schritte && p.konflikte > 0 && iter < maxIter; x++, iter++) {
        // zufällige konfliktbehaftete Stunde suchen
        const start = Math.floor(zufall.naechste() * n);
        let i = -1;
        for (let k = 0; k < n; k++) { const c = (start + k) % n; if (konfliktbehaftet(c)) { i = c; break; } }
        if (i < 0) { p.konflikte = gesamtKonflikte(p); break; }
        const kandidaten = zuege(p, i);
        if (!kandidaten.length) continue;
        let beste = [];
        let besteDelta = Infinity;
        const rauschen = zufall.naechste() < 0.03;
        for (const zug of kandidaten) {
          const zielSlot = zug.art === 't' ? p.pos[zug.j] : zug.d * p.H + p.laenge[p.items[i].c * p.T + zug.d];
          const { delta, r } = konfliktDelta(p, i, zug);
          r.zurueck();
          const istTabu = tabu[i * p.NS + zielSlot] > iter && p.konflikte + delta >= besteKonflikte;
          if (istTabu && !rauschen) continue;
          if (delta < besteDelta) { besteDelta = delta; beste = [zug]; } else if (delta === besteDelta) beste.push(zug);
        }
        if (rauschen) { beste = [zufall.auswahl(kandidaten)]; }
        if (!beste.length) continue;
        const zug = zufall.auswahl(beste);
        const alterSlot = p.pos[i];
        const { delta } = konfliktDelta(p, i, zug);
        p.konflikte += delta;
        tabu[i * p.NS + alterSlot] = iter + 7 + Math.floor(zufall.naechste() * 5);
        if (p.konflikte < besteKonflikte) { besteKonflikte = p.konflikte; ohneVerbesserung = 0; } else ohneVerbesserung++;
      }
      statistik.iterationenKonflikte = iter;
    }

    return {
      lauf,
      erschoepft: () => iter >= maxIter || (ohneVerbesserung > 50 * n && p.konflikte > 0),
      anteil: () => Math.min(1, iter / maxIter),
    };
  }

  /**
   * Erzwingt Konfliktfreiheit: konfliktbehaftete Stunden bekommen eine andere
   * qualifizierte, freie Lehrkraft (zählt in K2) oder entfallen; die letzte
   * Stunde des Tages rückt in die Lücke (H12 bleibt gewahrt).
   */
  function repariere(p, statistik) {
    const { items, NS, ix } = p;
    p.konflikte = gesamtKonflikte(p);
    let schutz = items.length * 4 + 100;
    while (p.konflikte > 0 && schutz-- > 0) {
      const i = items.findIndex((it, k) => p.pos[k] >= 0 && (p.occT[it.t * NS + p.pos[k]] > 1 || gesperrtWert(p, k, p.pos[k]) > 0
        || (it.typ >= 0 && p.useTyp[it.typ * NS + p.pos[k]] > p.kapTyp[it.typ * NS + p.pos[k]])));
      if (i < 0) break;
      const it = items[i];
      const s = p.pos[i];
      const k = p.K[it.c];
      const fachId = p.F[it.f].id;
      // Raumproblem lässt sich nicht durch eine andere Lehrkraft lösen
      const raumProblem = it.typ >= 0 && p.useTyp[it.typ * NS + s] > p.kapTyp[it.typ * NS + s];
      let ersatz = -1;
      if (!raumProblem && p.heimatGesperrt[it.c * NS + s] === 0) {
        p.L.forEach((l, t) => {
          if (ersatz >= 0 || t === it.t) return;
          if (p.occT[t * NS + s] === 0 && !p.gesperrt[t * NS + s] && ix.istQualifiziert(l.id, fachId, k.stufe)
            && p.stundenJeLehrkraft[t] < Math.min(l.maxStunden, p.freieSlots[t])) ersatz = t;
        });
      }
      if (ersatz >= 0) {
        loese(p, i);
        it.t = ersatz;
        it.ersatz = ix.zuordnungVon(k.id, fachId).haupt !== p.L[ersatz].id;
        setze(p, i, s);
        statistik.ersetzt = (statistik.ersetzt || 0) + 1;
      } else {
        entferne(p, i, raumProblem ? 'kein passender Raum frei' : 'keine konfliktfreie Platzierung (Lehrkraft belegt oder gesperrt)');
      }
      p.konflikte = gesamtKonflikte(p);
    }
  }

  /** Entfernt Stunde i; die letzte Stunde ihres Tages rückt in die Lücke. */
  function entferne(p, i, grund) {
    const it = p.items[i];
    const s = p.pos[i];
    const d = Math.floor(s / p.H);
    const letzterSlot = d * p.H + p.laenge[it.c * p.T + d] - 1;
    loese(p, i);
    it.entfernt = true;
    if (s !== letzterSlot) {
      const j = p.grid[it.c * p.NS + letzterSlot];
      loese(p, j);
      setze(p, j, s);
    }
    p.laenge[it.c * p.T + d]--;
    ausfallEintragen(p, i, grund);
  }

  function ausfallEintragen(p, i, grund) {
    const it = p.items[i];
    const klasse = p.K[it.c].id;
    const fach = p.F[it.f].id;
    const vorhanden = p.ausfall.find((a) => a.klasse === klasse && a.fach === fach && a.grund === grund);
    if (vorhanden) vorhanden.stunden++;
    else p.ausfall.push({ klasse, fach, stunden: 1, grund });
  }

  /* ================= Nachoptimierung (Simulated Annealing) ============= */

  function annealing(p, zufall, iterationenVorgabe, statistik) {
    const { T, H, K, L, F, g, items } = p;
    const nF = F.length;
    const aktiv = items.map((it, i) => (it.entfernt ? -1 : i)).filter((i) => i >= 0);
    const n = aktiv.length;
    const maxIter = iterationenVorgabe ?? Math.min(4000000, Math.max(50000, n * 3000)); // fest ⇒ reproduzierbar
    const gesamtJeLehrkraft = new Float64Array(L.length);
    for (const i of aktiv) gesamtJeLehrkraft[items[i].t]++;
    const zielEnde = K.map((_, c) => Math.ceil(p.itemsJeKlasse[c].filter((i) => !items[i].entfernt).length / T));
    // Gewünschte Doppelstunden je Klasse und Fach
    const gewuenscht = new Int16Array(K.length * nF);
    K.forEach((k, c) => k.stundentafel.forEach((e) => {
      const f = p.fIdx.get(e.fach);
      if (e.doppelt && F[f].blockbar) gewuenscht[c * nF + f] = Math.floor(e.stunden / 2);
    }));
    const paare = new Int16Array(K.length * nF * T);
    const cd = new Float64Array(K.length * T);
    const w3 = new Float64Array(K.length);
    const td = new Float64Array(L.length * T);

    /** Kosten eines Klassentags (W1, W4, W5, W6) und Doppelstunden-Paare des Tages. */
    function klassentag(c, d) {
      const len = p.laenge[c * T + d];
      const basis = c * p.NS + d * H;
      let k = g.W1 * Math.max(0, len - zielEnde[c]);
      let w4 = 0;
      let w5 = 0;
      let w6 = 0;
      let letzterRaum = -2;
      for (let f = 0; f < nF; f++) paare[(c * nF + f) * T + d] = 0;
      for (let h = 0; h < len; h++) {
        const it = items[p.grid[basis + h]];
        if (p.hauptfach[it.f] && p.nachmittag[h]) w4++;
        if (p.sport[it.f] && p.nachPause[h]) w4++;
        const raum = it.typ;
        if (h > 0 && raum !== letzterRaum) w6++;
        letzterRaum = raum;
        // Läufe desselben Fachs
        const vorher = h > 0 ? items[p.grid[basis + h - 1]].f : -1;
        if (vorher !== it.f) {
          let laenge = 1;
          while (h + laenge < len && items[p.grid[basis + h + laenge]].f === it.f) laenge++;
          w5 += Math.max(0, laenge - p.blockMax[it.f]);
          // Doppelstunden in diesem Lauf (ab erlaubtem Beginn, nicht überlappend)
          for (let x = h; x + 1 < h + laenge;) {
            if (p.doppelStart[x]) { paare[(c * nF + it.f) * T + d]++; x += 2; } else x++;
          }
        }
      }
      // weitere Blöcke desselben Fachs am Tag
      const bloecke = new Map();
      for (let h = 0; h < len; h++) {
        const f = items[p.grid[basis + h]].f;
        if (h === 0 || items[p.grid[basis + h - 1]].f !== f) bloecke.set(f, (bloecke.get(f) || 0) + 1);
      }
      for (const b of bloecke.values()) w5 += b - 1;
      return k + g.W4 * w4 + g.W5 * w5 + g.W6 * w6;
    }
    function w3Klasse(c) {
      let fehlt = 0;
      for (let f = 0; f < nF; f++) {
        const wunsch = gewuenscht[c * nF + f];
        if (!wunsch) continue;
        let ist = 0;
        for (let d = 0; d < T; d++) ist += paare[(c * nF + f) * T + d];
        fehlt += Math.max(0, wunsch - ist);
      }
      return g.W3 * fehlt;
    }
    function lehrertag(t, d) {
      const basis = t * p.NS + d * H;
      let erste = -1;
      let letzte = -1;
      let anzahl = 0;
      for (let h = 0; h < H; h++) if (p.occT[basis + h] > 0) { if (erste < 0) erste = h; letzte = h; anzahl++; }
      const luecken = anzahl ? letzte - erste + 1 - anzahl : 0;
      return g.W2 * luecken + g.W7 * Math.abs(anzahl - gesamtJeLehrkraft[t] / T);
    }

    let summe = 0;
    for (let c = 0; c < K.length; c++) { for (let d = 0; d < T; d++) { cd[c * T + d] = klassentag(c, d); summe += cd[c * T + d]; } }
    for (let c = 0; c < K.length; c++) { w3[c] = w3Klasse(c); summe += w3[c]; }
    for (let t = 0; t < L.length; t++) for (let d = 0; d < T; d++) { td[t * T + d] = lehrertag(t, d); summe += td[t * T + d]; }

    let iter = 0;
    let beste = summe;
    let besteStand = sichere();
    // Starttemperatur aus der mittleren Verschlechterung zufälliger Züge
    let t0 = 1;
    {
      let s = 0;
      let m = 0;
      for (let x = 0; x < 300 && n > 1; x++) {
        const r = versuch(true);
        if (r > 0) { s += r; m++; }
      }
      t0 = m ? (s / m) * 0.6 : 1;
    }
    const tEnde = 0.02;

    function sichere() {
      return { pos: p.pos.slice(), laenge: p.laenge.slice(), lehrer: items.map((it) => it.t) };
    }

    /** Ein zufälliger Zug; mit nurMessen wird er immer zurückgenommen. Liefert das Kosten-Delta (oder NaN). */
    function versuch(nurMessen, temperatur = 1) {
      const i = aktiv[Math.floor(zufall.naechste() * n)];
      const it = items[i];
      let zug;
      if (istLetzte(p, i) && zufall.naechste() < 0.15) {
        const d = Math.floor(zufall.naechste() * T);
        if (d === Math.floor(p.pos[i] / H) || p.laenge[it.c * T + d] >= H) return NaN;
        zug = { art: 'p', d };
      } else {
        const liste = p.itemsJeKlasse[it.c];
        const j = liste[Math.floor(zufall.naechste() * liste.length)];
        if (j === i || p.pos[j] < 0) return NaN;
        if (items[j].t === it.t && items[j].f === it.f) return NaN;
        zug = { art: 't', j };
      }
      const tageVorher = [Math.floor(p.pos[i] / H)];
      if (zug.art === 't') tageVorher.push(Math.floor(p.pos[zug.j] / H));
      else tageVorher.push(zug.d);
      const { delta: dk, r } = konfliktDelta(p, i, zug);
      if (dk > 0) { r.zurueck(); return NaN; }
      // betroffene Klassentage und Lehrertage
      const c = it.c;
      const tage = [...new Set(tageVorher)];
      const lehrer = [...new Set(r.idx.map((x) => items[x].t))];
      const alt = [];
      let neu = 0;
      let vorher = 0;
      for (const d of tage) { alt.push(['cd', c * T + d, cd[c * T + d]]); vorher += cd[c * T + d]; cd[c * T + d] = klassentag(c, d); neu += cd[c * T + d]; }
      alt.push(['w3', c, w3[c]]); vorher += w3[c]; w3[c] = w3Klasse(c); neu += w3[c];
      for (const t of lehrer) for (const d of tage) { alt.push(['td', t * T + d, td[t * T + d]]); vorher += td[t * T + d]; td[t * T + d] = lehrertag(t, d); neu += td[t * T + d]; }
      const delta = neu - vorher;
      const annehmen = !nurMessen && (delta <= 1e-9 || zufall.naechste() < Math.exp(-delta / temperatur));
      if (!annehmen) {
        r.zurueck();
        for (const [art, k, v] of alt) (art === 'cd' ? cd : art === 'w3' ? w3 : td)[k] = v;
        // Paare der betroffenen Tage wiederherstellen
        for (const d of tage) klassentag(c, d);
        return delta;
      }
      summe += delta;
      if (summe < beste - 1e-9) { beste = summe; besteStand = sichere(); }
      return delta;
    }

    function lauf(schritte) {
      for (let x = 0; x < schritte && iter < maxIter && n > 1; x++, iter++) {
        const temperatur = t0 * Math.pow(tEnde / t0, iter / maxIter);
        versuch(false, temperatur);
      }
      statistik.iterationenOptimierung = iter;
    }

    /** Stellt den besten gefundenen Stand wieder her. */
    function stelleBesteHer() {
      // alles lösen, dann besten Stand setzen
      for (const i of aktiv) if (p.pos[i] >= 0) loese(p, i);
      p.laenge.set(besteStand.laenge);
      items.forEach((it, i) => { it.t = besteStand.lehrer[i]; });
      for (const i of aktiv) setze(p, i, besteStand.pos[i]);
      p.konflikte = gesamtKonflikte(p);
    }

    return {
      lauf,
      fertig: () => iter >= maxIter || n <= 1,
      anteil: () => (maxIter ? Math.min(1, iter / maxIter) : 1),
      aktuell: () => summe,
      beste: stelleBesteHer,
    };
  }

  /* ============================ Abschluss ============================= */

  function abschluss(z, p, zufall, statistik) {
    const { ix, T, H, NS, K, L, F, items } = p;
    // Sicherheitsnetz: Konflikte (sollten 0 sein) erzwungen beseitigen
    if (gesamtKonflikte(p) > 0) repariere(p, statistik);

    // 1. Räume je Slot: Fachräume per Zuordnung (größte Klasse → kleinster passender Raum)
    const raumVon = new Array(items.length).fill(null);
    let raumFehler = true;
    let schutz = items.length + 10;
    while (raumFehler && schutz-- > 0) {
      raumFehler = false;
      for (let s = 0; s < NS && !raumFehler; s++) {
        const d = Math.floor(s / H);
        const h = s % H;
        const belegt = new Set();
        const hier = [];
        for (let c = 0; c < K.length; c++) { const i = p.grid[c * NS + s]; if (i >= 0) hier.push(i); }
        // Heimaträume zuerst
        for (const i of hier) {
          const it = items[i];
          if (it.typ < 0 && K[it.c].heimatraum) { raumVon[i] = K[it.c].heimatraum; belegt.add(K[it.c].heimatraum); }
        }
        const sortiert = hier.filter((i) => items[i].typ >= 0 || !K[items[i].c].heimatraum)
          .sort((a, b) => K[items[b].c].schueler - K[items[a].c].schueler);
        for (const i of sortiert) {
          const it = items[i];
          const kandidaten = it.typ >= 0 ? p.raeumeJeTyp[it.typ]
            : z.raeume.filter((r) => r.typ === 'klassenraum').sort((a, b) => a.kapazitaet - b.kapazitaet);
          const raum = kandidaten.find((r) => !belegt.has(r.id) && r.kapazitaet >= K[it.c].schueler && !ix.raumGesperrt(r.id, ix.tage[d], ix.stunden[h]));
          if (raum) { raumVon[i] = raum.id; belegt.add(raum.id); } else {
            entferne(p, i, 'kein passender Raum frei');
            raumFehler = true;
            break;
          }
        }
      }
      if (raumFehler) {
        if (gesamtKonflikte(p) > 0) repariere(p, statistik);
        raumVon.fill(null);
      }
    }

    // 2. Einträge des Regelplans
    const eintraege = [];
    const eintragVon = new Int32Array(items.length).fill(-1);
    K.forEach((k, c) => {
      for (let d = 0; d < T; d++) {
        for (let h = 0; h < p.laenge[c * T + d]; h++) {
          const i = p.grid[c * NS + d * H + h];
          const it = items[i];
          eintragVon[i] = eintraege.length;
          eintraege.push({ klasse: k.id, fach: F[it.f].id, lehrkraefte: [L[it.t].id], raum: raumVon[i], tag: ix.tage[d], stunde: ix.stunden[h], status: 'regulaer' });
        }
      }
    });

    // 3. Zweitbesetzungen
    if (p.e.zweitbesetzungErlaubt) zweitbesetzung(p, eintraege, zufall);

    // 4. Pausenaufsichten
    const aufsichten = verteileAufsichten(p, eintraege);

    const plan = { stunden: eintraege, aufsichten };
    const verstoesse = Regeln.pruefeHart(z, plan);
    const bewertung = Kosten.bewerte(z, plan);
    return {
      plan: { regelplan: eintraege, aufsichten },
      bericht: {
        vektor: bewertung.vektor,
        bewertung,
        verstoesse,
        vorpruefung: p.vorpruefung,
        untereSchrankeK1: p.untereSchrankeK1,
        ausfallMinimalNachgewiesen: bewertung.vektor[0] === p.untereSchrankeK1,
        ausfall: p.ausfall,
        warnungen: p.warnungen,
      },
    };
  }

  /** Vergibt freie Kontingente als Zweitbesetzung (§6.5): Festzuordnungen zuerst, dann nach W9/W10. */
  function zweitbesetzung(p, eintraege, zufall) {
    const { ix, L, K, NS, H, z } = p;
    const maxL = p.e.maxLehrkraefteProKlasseUndSlot;
    if (maxL < 2) return;
    const slotVon = (e) => ix.tagIndex.get(e.tag) * H + ix.stunden.indexOf(e.stunde);
    const occ = p.occT; // Hauptunterricht ist bereits eingetragen
    const rest = L.map((l, t) => Math.max(0, Math.min(l.sollStunden - ix.reserve(l), l.maxStunden) - p.stundenJeLehrkraft[t]));
    const frei = (t, s) => occ[t * NS + s] === 0 && !p.gesperrt[t * NS + s];
    const kandidat = (e) => Index.STATUS.fachunterricht(e) && e.lehrkraefte.length < maxL;
    const vergib = (t, e) => {
      e.lehrkraefte.push(L[t].id);
      occ[t * NS + slotVon(e)]++;
      rest[t]--;
    };

    // a) feste Zweit-Zuordnungen
    for (const zu of z.zuordnungen) {
      if (zu.rolle !== 'zweit') continue;
      const t = p.lIdx.get(zu.lehrkraft);
      for (const e of eintraege) {
        if (rest[t] <= 0) break;
        if (e.klasse === zu.klasse && e.fach === zu.fach && kandidat(e) && frei(t, slotVon(e)) && !e.lehrkraefte.includes(L[t].id)) vergib(t, e);
      }
    }

    // b) übrige freie Kontingente nach Priorität (W9) und Beständigkeit (W10)
    const sch = K.map((k) => k.schueler);
    const stu = K.map((k) => k.stufe);
    const norm = (x, a, b) => (b > a ? (x - a) / (b - a) : 0.5);
    const [sMin, sMax, tMin, tMax] = [Math.min(...sch), Math.max(...sch), Math.min(...stu), Math.max(...stu)];
    const klasseVon = new Map(K.map((k) => [k.id, k]));
    const prio = (e) => {
      const k = klasseVon.get(e.klasse);
      return (norm(k.schueler, sMin, sMax) + (1 - norm(k.stufe, tMin, tMax)) + 1 / Math.max(1, ix.anzahlQualifizierte(e.fach, k.stufe))) / 3;
    };
    const prioVon = eintraege.map(prio);
    const reihenfolge = L.map((_, t) => t).filter((t) => rest[t] > 0).sort((a, b) => rest[b] - rest[a] || a - b);
    for (const t of reihenfolge) {
      const schonBei = new Set(); // Klasse|Fach, in denen t bereits Zweitbesetzung ist
      eintraege.forEach((e) => { if (e.lehrkraefte[1] === L[t].id) schonBei.add(e.klasse + '|' + e.fach); });
      while (rest[t] > 0) {
        let beste = -1;
        let besterWert = -Infinity;
        eintraege.forEach((e, k) => {
          if (!kandidat(e) || e.lehrkraefte.includes(L[t].id)) return;
          const s = slotVon(e);
          if (!frei(t, s)) return;
          const d = Math.floor(s / H);
          const h = s % H;
          // angrenzend an eigene Stunden desselben Tags (weniger Leerstunden, W2)
          const angrenzend = (h > 0 && occ[t * NS + d * H + h - 1] > 0) || (h + 1 < H && occ[t * NS + d * H + h + 1] > 0);
          const wert = prioVon[k] + (schonBei.has(e.klasse + '|' + e.fach) ? 1 : 0) + (angrenzend ? 0.3 : 0) + zufall.naechste() * 1e-6;
          if (wert > besterWert) { besterWert = wert; beste = k; }
        });
        if (beste < 0) break;
        vergib(t, eintraege[beste]);
        schonBei.add(eintraege[beste].klasse + '|' + eintraege[beste].fach);
      }
    }
  }

  /** Verteilt die Pausenaufsichten als Minimalkosten-Fluss (K1A, dann W12). */
  function verteileAufsichten(p, eintraege) {
    const { ix, L, T, H } = p;
    const pausen = ix.pausen.filter((pa) => pa.aufsichten > 0);
    if (!pausen.length) return [];
    const P = pausen.length;
    // Anwesenheit und Stunden je Lehrkraft und Tag; Bedarf je Tag und Pause
    const stundenVon = L.map(() => Array.from({ length: T }, () => new Set()));
    const klassenStunde = new Set();
    for (const e of eintraege) {
      const d = ix.tagIndex.get(e.tag);
      klassenStunde.add(d + '|' + e.stunde);
      for (const id of e.lehrkraefte) stundenVon[p.lIdx.get(id)][d].add(e.stunde);
    }
    const q = 0;
    const s = 1;
    const kL = (t) => 2 + t;
    const kLT = (t, d) => 2 + L.length + t * T + d;
    const kTP = (d, x) => 2 + L.length + L.length * T + d * P + x;
    const g = Fluss.graph(2 + L.length + L.length * T + T * P);
    const kanten = [];
    L.forEach((l, t) => {
      if (l.aufsichtenProWoche > 0) Fluss.kante(g, q, kL(t), l.aufsichtenProWoche, 0);
      for (let d = 0; d < T; d++) {
        if (!stundenVon[t][d].size) continue; // H13: nur an Unterrichtstagen
        Fluss.kante(g, kL(t), kLT(t, d), 1, 0);
        Fluss.kante(g, kL(t), kLT(t, d), P, p.g.W12 || 1); // weitere Aufsichten am selben Tag
        pausen.forEach((pa, x) => {
          const erste = pa.vorStunde === ix.stunden[0];
          const angrenzendeStunden = erste ? [pa.vorStunde] : [pa.vorStunde - 1, pa.vorStunde];
          if (angrenzendeStunden.some((st) => ix.lehrkraftGesperrt(l.id, ix.tage[d], st))) return; // H13
          const angrenzend = angrenzendeStunden.some((st) => stundenVon[t][d].has(st));
          kanten.push({ t, d, pa, e: Fluss.kante(g, kLT(t, d), kTP(d, x), 1, angrenzend ? 0 : (p.g.W12 || 1)) });
        });
      }
    });
    for (let d = 0; d < T; d++) {
      pausen.forEach((pa, x) => {
        if (klassenStunde.has(d + '|' + pa.vorStunde)) Fluss.kante(g, kTP(d, x), s, pa.aufsichten, 0);
      });
    }
    Fluss.minKostenMaxFluss(g, q, s);
    return kanten.filter((k) => Fluss.flussVon(g, k.e) > 0)
      .map((k) => ({ tag: ix.tage[k.d], vorStunde: k.pa.vorStunde, lehrkraft: L[k.t].id }))
      .sort((a, b) => ix.tagIndex.get(a.tag) - ix.tagIndex.get(b.tag) || a.vorStunde - b.vorStunde || a.lehrkraft.localeCompare(b.lehrkraft));
  }

  return { starte, plane };
})();

/* ---- src/kern/65-bearbeitung.js ---- */
/* ==========================================================================
 * Modul Bearbeitung
 * Manuelle Änderungen am Regelplan (§7 Plan-Ansicht): Stunden verschieben,
 * Zweitbesetzung setzen/entfernen, Aufsichten verschieben/hinzufügen/entfernen.
 * Alle Funktionen verändern den übergebenen Zustand (in der Oberfläche eine
 * Kopie innerhalb von App.aendere) und liefern eine Beschreibung für den
 * Verlauf oder einen Fehlertext. Harte Regeln werden NICHT erzwungen: Die
 * Oberfläche zeigt Verstöße an und markiert den Plan als ungültig (§4).
 * ========================================================================== */
const Bearbeitung = (() => {
  'use strict';

  const name = (z, sammlung, id, feld = 'name') => z[sammlung].find((x) => x.id === id)?.[feld] || id;

  /**
   * Verschiebt Stunde `index` der Klasse auf (tag, stunde). Hat die Klasse dort
   * bereits eine Stunde, tauschen beide ihre Plätze.
   * @returns {{text: string}|{fehler: string}}
   */
  function verschiebeStunde(z, index, tag, stunde) {
    const plan = z.plan.regelplan;
    const s = plan[index];
    if (!s) return { fehler: 'Diese Stunde gibt es nicht mehr.' };
    if (!z.zeitraster.tage.includes(tag) || !z.zeitraster.stunden.some((x) => x.nr === stunde)) return { fehler: 'Dieser Zeitslot liegt nicht im Zeitraster.' };
    if (s.tag === tag && s.stunde === stunde) return { fehler: 'Die Stunde liegt bereits dort.' };
    const andere = plan.findIndex((x, i) => i !== index && x.klasse === s.klasse && x.tag === tag && x.stunde === stunde);
    const text = `${name(z, 'klassen', s.klasse)} ${name(z, 'faecher', s.fach, 'kuerzel')} ${s.tag} ${s.stunde}. → ${tag} ${stunde}.`;
    if (andere >= 0) {
      plan[andere].tag = s.tag;
      plan[andere].stunde = s.stunde;
    }
    s.tag = tag;
    s.stunde = stunde;
    return { text: andere >= 0 ? `${text} (getauscht mit ${name(z, 'faecher', plan[andere].fach, 'kuerzel')})` : text };
  }

  /** Setzt (oder entfernt mit null) die Zweitbesetzung einer Stunde. */
  function setzeZweit(z, index, lehrkraft) {
    const s = z.plan.regelplan[index];
    if (!s) return { fehler: 'Diese Stunde gibt es nicht mehr.' };
    const wo = `${name(z, 'klassen', s.klasse)} ${s.tag} ${s.stunde}.`;
    if (lehrkraft === null) {
      if (s.lehrkraefte.length < 2) return { fehler: 'Die Stunde hat keine Zweitbesetzung.' };
      const alt = s.lehrkraefte[1];
      s.lehrkraefte = s.lehrkraefte.slice(0, 1);
      return { text: `Zweitbesetzung ${name(z, 'lehrkraefte', alt, 'kuerzel')} aus ${wo} entfernt` };
    }
    if (!(s.status === 'regulaer' || s.status === 'vertreten') || !s.lehrkraefte.length) return { fehler: 'Eine Zweitbesetzung ist nur in Unterrichtsstunden mit Hauptlehrkraft möglich.' };
    if (s.lehrkraefte[0] === lehrkraft) return { fehler: 'Die Lehrkraft ist bereits Hauptlehrkraft dieser Stunde.' };
    if (z.einstellungen.maxLehrkraefteProKlasseUndSlot < 2) return { fehler: 'Laut Einstellung ist nur eine Lehrkraft je Klasse und Stunde erlaubt.' };
    s.lehrkraefte = [s.lehrkraefte[0], lehrkraft];
    return { text: `${name(z, 'lehrkraefte', lehrkraft, 'kuerzel')} als Zweitbesetzung in ${wo}` };
  }

  function verschiebeAufsicht(z, index, tag, vorStunde) {
    const a = z.plan.aufsichten[index];
    if (!a) return { fehler: 'Diese Aufsicht gibt es nicht mehr.' };
    if (a.tag === tag && a.vorStunde === vorStunde) return { fehler: 'Die Aufsicht liegt bereits dort.' };
    if (z.plan.aufsichten.some((x, i) => i !== index && x.tag === tag && x.vorStunde === vorStunde && x.lehrkraft === a.lehrkraft)) return { fehler: 'Die Lehrkraft hat in dieser Pause bereits Aufsicht.' };
    const text = `Aufsicht ${name(z, 'lehrkraefte', a.lehrkraft, 'kuerzel')} ${a.tag} vor ${a.vorStunde}. → ${tag} vor ${vorStunde}.`;
    a.tag = tag;
    a.vorStunde = vorStunde;
    return { text };
  }

  function neueAufsicht(z, tag, vorStunde, lehrkraft) {
    if (z.plan.aufsichten.some((x) => x.tag === tag && x.vorStunde === vorStunde && x.lehrkraft === lehrkraft)) return { fehler: 'Die Lehrkraft hat in dieser Pause bereits Aufsicht.' };
    z.plan.aufsichten.push({ tag, vorStunde, lehrkraft });
    return { text: `Aufsicht ${name(z, 'lehrkraefte', lehrkraft, 'kuerzel')} ${tag} vor ${vorStunde}. eingeteilt` };
  }

  function entferneAufsicht(z, index) {
    const a = z.plan.aufsichten[index];
    if (!a) return { fehler: 'Diese Aufsicht gibt es nicht mehr.' };
    z.plan.aufsichten.splice(index, 1);
    return { text: `Aufsicht ${name(z, 'lehrkraefte', a.lehrkraft, 'kuerzel')} ${a.tag} vor ${a.vorStunde}. entfernt` };
  }

  /**
   * Lehrkräfte mit ungenutztem Kontingent für Zweitbesetzung (§7):
   * min(Soll − Reserve, Höchstgrenze) − Ist > 0.
   */
  function freieKontingente(z) {
    const ix = Index.erstelle(z);
    const stunden = Regeln.lehrkraftStunden(z.plan.regelplan);
    return z.lehrkraefte.map((l) => {
      const ist = stunden.get(l.id)?.slots.size || 0;
      return { lehrkraft: l.id, ist, frei: Math.min(l.sollStunden - ix.reserve(l), l.maxStunden) - ist };
    }).filter((x) => x.frei > 0);
  }

  /** Lehrkräfte, deren Aufsichtssoll noch nicht erfüllt ist. */
  function offeneAufsichten(z) {
    const zahl = new Map();
    for (const a of z.plan.aufsichten) zahl.set(a.lehrkraft, (zahl.get(a.lehrkraft) || 0) + 1);
    return z.lehrkraefte.map((l) => ({ lehrkraft: l.id, offen: l.aufsichtenProWoche - (zahl.get(l.id) || 0) })).filter((x) => x.offen > 0);
  }

  return { verschiebeStunde, setzeZweit, verschiebeAufsicht, neueAufsicht, entferneAufsicht, freieKontingente, offeneAufsichten };
})();

/* ---- src/kern/70-vertretung.js ---- */
/* ==========================================================================
 * Modul Vertretung
 * Datumsgenaue Vertretungsplanung (Spezifikation §5):
 *   - tagesplan(z, datum): Regelplan des Wochentags + bestätigte Vertretungen
 *   - betroffen(z, datum): Stunden/Aufsichten mit abwesender Lehrkraft bzw.
 *     nicht verfügbarem Raum
 *   - vorschlaege(z, von, bis): je betroffener Stunde die günstigste Lösung
 *     nach der Eskalationskette, dazu Alternativen. Die Stufen werden in
 *     fester Reihenfolge versucht; die erste Stufe mit einer zulässigen Lösung
 *     gewinnt, innerhalb der Stufe entscheidet der Kostenvektor (§3).
 *     „Zulässig“ heißt: die Lösung erzeugt in keinem betroffenen Tagesplan
 *     einen neuen Verstoß gegen harte Regeln und hält die Höchststunden ein.
 *   - uebernehmen(z, vorschlag): trägt die Einträge in plan.vertretungen bzw.
 *     plan.aufsichtsVertretungen ein (Bestätigung durch die Nutzerin, §5)
 * Der Regelplan wird nie verändert.
 * ========================================================================== */
const Vertretung = (() => {
  'use strict';

  /** Stufen der Eskalationskette je Art des Ausfalls. */
  const STUFEN = {
    lehrkraft: {
      0: 'Zweitbesetzung entfällt', 1: 'Zweitbesetzung rückt auf', 2: 'Umplanen in der Woche',
      3: 'Vertretung durch Lehrkraft der Klasse', 4: 'Vertretung durch andere Lehrkraft', 5: 'Doppelbetreuung',
      6: 'Aufteilung der Klasse', 7: 'Entfall, Nachrücken oder Aufsicht',
    },
    raum: { 1: 'Ersatzraum', 2: 'Umplanen in der Woche', 6: 'Aufteilung der Klasse', 7: 'Entfall, Nachrücken oder Aufsicht' },
    aufsicht: { 1: 'Aufsicht mit angrenzendem Unterricht', 2: 'Aufsicht durch anwesende Lehrkraft', 7: 'Aufsicht bleibt unbesetzt' },
  };

  const S = Index.schluessel;
  const kopie = (x) => JSON.parse(JSON.stringify(x));

  /* ------------------------------ Tagesplan ---------------------------- */

  /** Tagesplan eines Datums: Regelplan des Wochentags, überlagert von bestätigten Vertretungen. */
  function tagesplan(z, datum) {
    const tag = Hilfen.wochentag(datum);
    const je = new Map();
    for (const s of z.plan.regelplan) {
      if (s.tag === tag) je.set(S(s.klasse, s.stunde), { ...kopie(s), quelle: 'regel' });
    }
    for (const v of z.plan.vertretungen) {
      if (v.datum !== datum) continue;
      const alt = je.get(S(v.klasse, v.stunde));
      const e = { klasse: v.klasse, fach: v.fach ?? alt?.fach ?? null, lehrkraefte: v.lehrkraefte || [], raum: v.raum ?? null, tag, stunde: v.stunde, status: v.status, quelle: 'vertretung', grund: v.grund };
      if (v.mitKlasse) e.mitKlasse = v.mitKlasse;
      if (v.verteilung) e.verteilung = v.verteilung;
      je.set(S(v.klasse, v.stunde), e);
    }
    const aufsichten = z.plan.aufsichten.filter((a) => a.tag === tag).map((a) => ({ ...a }));
    for (const av of z.plan.aufsichtsVertretungen) {
      if (av.datum !== datum) continue;
      const i = aufsichten.findIndex((a) => a.vorStunde === av.vorStunde && a.lehrkraft === av.fuer);
      if (i >= 0) aufsichten.splice(i, 1);
      if (av.status === 'vertreten' && av.lehrkraft) aufsichten.push({ tag, vorStunde: av.vorStunde, lehrkraft: av.lehrkraft, quelle: 'vertretung' });
    }
    const stunden = [...je.values()].sort((a, b) => a.stunde - b.stunde || a.klasse.localeCompare(b.klasse));
    return { stunden, aufsichten };
  }

  const abwesend = (e, datum) => (e?.abwesenheiten || []).some((a) => a.von <= datum && datum <= a.bis);

  /** Betroffene Stunden und Aufsichten eines Datums (nach Stunde sortiert). */
  function betroffen(z, datum, tp = tagesplan(z, datum)) {
    const L = new Map(z.lehrkraefte.map((l) => [l.id, l]));
    const R = new Map(z.raeume.map((r) => [r.id, r]));
    const liste = [];
    for (const s of tp.stunden) {
      if (!Index.STATUS.belegt(s)) continue;
      const [haupt, zweit] = s.lehrkraefte;
      if (haupt && abwesend(L.get(haupt), datum)) liste.push({ art: 'lehrkraft', datum, klasse: s.klasse, stunde: s.stunde, lehrkraft: haupt });
      else if (zweit && abwesend(L.get(zweit), datum)) liste.push({ art: 'zweit', datum, klasse: s.klasse, stunde: s.stunde, lehrkraft: zweit });
      else if (s.raum && Index.STATUS.mitRaum(s) && abwesend(R.get(s.raum), datum)) liste.push({ art: 'raum', datum, klasse: s.klasse, stunde: s.stunde, raum: s.raum });
    }
    for (const a of tp.aufsichten) {
      if (abwesend(L.get(a.lehrkraft), datum)) liste.push({ art: 'aufsicht', datum, vorStunde: a.vorStunde, lehrkraft: a.lehrkraft });
    }
    return liste.sort((a, b) => (a.stunde ?? a.vorStunde - 0.5) - (b.stunde ?? b.vorStunde - 0.5));
  }

  /* ------------------------------ Kontext ------------------------------ */

  /** Arbeitskontext für ein Datum (wird nach jeder übernommenen Lösung neu gebildet). */
  function kontext(z, datum) {
    const ix = Index.erstelle(z);
    const tag = Hilfen.wochentag(datum);
    const tp = tagesplan(z, datum);
    const montag = Hilfen.wochenbeginn(datum);
    const wochentage = Array.from({ length: 7 }, (_, i) => Hilfen.plusTage(montag, i)).filter((d) => ix.tage.includes(Hilfen.wochentag(d)));
    // Wochenstunden je Lehrkraft (Tagespläne der ganzen Woche, inkl. bestätigter Vertretungen)
    const woche = new Map();
    const aufsichtenWoche = new Map();
    for (const d of wochentage) {
      const t = d === datum ? tp : tagesplan(z, d);
      for (const [l, info] of Regeln.lehrkraftStunden(t.stunden)) woche.set(l, (woche.get(l) || 0) + info.slots.size);
      for (const a of t.aufsichten) aufsichtenWoche.set(a.lehrkraft, (aufsichtenWoche.get(a.lehrkraft) || 0) + 1);
    }
    const belegtIm = (l, stunde) => tp.stunden.filter((s) => s.stunde === stunde && Index.STATUS.belegt(s) && s.lehrkraefte.includes(l));
    const frei = (l, stunde) => !abwesend(ix.lehrkraefte.get(l), datum) && !ix.lehrkraftGesperrt(l, tag, stunde) && !belegtIm(l, stunde).length;
    const stundenAmTag = (l) => new Set(tp.stunden.filter((s) => Index.STATUS.belegt(s) && s.lehrkraefte.includes(l)).map((s) => s.stunde));
    const reserveFrei = (l) => (woche.get(l) || 0) + 1 <= ix.lehrkraefte.get(l).maxStunden;
    return { z, ix, datum, tag, tp, wochentage, woche, aufsichtenWoche, belegtIm, frei, stundenAmTag, reserveFrei };
  }

  /* ------------------------- Bewertung von Lösungen --------------------- */

  /** Wendet eine Lösung auf eine Kopie an. */
  function mitLoesung(z, loesung) {
    const neu = kopie(z);
    eintragen(neu, loesung);
    return neu;
  }

  /** Trägt Einträge ein; gleiche Schlüssel (Datum, Klasse, Stunde bzw. Datum, Pause, Lehrkraft) werden ersetzt. */
  function eintragen(z, loesung) {
    for (const e of loesung.eintraege || []) {
      z.plan.vertretungen = z.plan.vertretungen.filter((v) => !(v.datum === e.datum && v.klasse === e.klasse && v.stunde === e.stunde));
      z.plan.vertretungen.push(e);
    }
    for (const e of loesung.aufsichtsEintraege || []) {
      z.plan.aufsichtsVertretungen = z.plan.aufsichtsVertretungen.filter((v) => !(v.datum === e.datum && v.vorStunde === e.vorStunde && v.fuer === e.fuer));
      z.plan.aufsichtsVertretungen.push(e);
    }
    const ordnung = (a, b) => a.datum.localeCompare(b.datum) || (a.stunde ?? a.vorStunde) - (b.stunde ?? b.vorStunde) || String(a.klasse ?? a.fuer).localeCompare(String(b.klasse ?? b.fuer));
    z.plan.vertretungen.sort(ordnung);
    z.plan.aufsichtsVertretungen.sort(ordnung);
  }

  const verstossSchluessel = (v) => v.regel + '|' + v.text;

  /**
   * Prüft eine Lösung: keine neuen Verstöße an den betroffenen Daten,
   * Höchststunden der Woche eingehalten. Liefert den Kostenvektor oder null.
   */
  function pruefe(z, loesung, vorherVerstoesse) {
    const neu = mitLoesung(z, loesung);
    const daten = [...new Set([...(loesung.eintraege || []), ...(loesung.aufsichtsEintraege || [])].map((e) => e.datum))];
    let vektor = null;
    for (const d of daten) {
      const tp = tagesplan(neu, d);
      const vorher = vorherVerstoesse(d);
      // Aufsichten abwesender Lehrkräfte werden ohnehin noch vertreten – ihre H13-Meldungen blockieren nicht
      const offeneAufsicht = (v) => v.regel === 'H13' && v.aufsichten.length
        && v.aufsichten.every((i) => abwesend(neu.lehrkraefte.find((l) => l.id === tp.aufsichten[i]?.lehrkraft), d));
      const nachher = Regeln.pruefeHart(neu, tp, { datum: d }).filter((v) => !offeneAufsicht(v));
      const zaehler = new Map();
      for (const v of vorher) zaehler.set(verstossSchluessel(v), (zaehler.get(verstossSchluessel(v)) || 0) + 1);
      for (const v of nachher) {
        const k = verstossSchluessel(v);
        if (!zaehler.get(k)) return null; // neuer Verstoß
        zaehler.set(k, zaehler.get(k) - 1);
      }
      const b = Kosten.bewerte(neu, tp, { datum: d, mitPosten: false }).vektor;
      vektor = vektor ? vektor.map((x, i) => x + b[i]) : b;
    }
    // Höchststunden der Woche (H7) für alle beteiligten Lehrkräfte
    const ix = Index.erstelle(neu);
    for (const e of loesung.eintraege || []) {
      for (const l of e.lehrkraefte || []) {
        const ctx = kontext(neu, e.datum);
        if ((ctx.woche.get(l) || 0) > ix.lehrkraefte.get(l).maxStunden) return null;
      }
    }
    return vektor || [0, 0, 0, 0, 0, 0, 0];
  }

  /* ------------------------------ Kandidaten --------------------------- */

  function eintrag(ctx, s, aenderung) {
    const e = { datum: ctx.datum, klasse: s.klasse, fach: s.fach, stunde: s.stunde, status: s.status, lehrkraefte: s.lehrkraefte.slice(), raum: s.raum, ...aenderung };
    for (const k of Object.keys(e)) if (e[k] === undefined) delete e[k];
    return e;
  }

  /** Lösungskandidaten für eine Stunde mit abwesender Hauptlehrkraft (Stufen 1–7). */
  function kandidatenLehrkraft(ctx, s, abw) {
    const { ix, z } = ctx;
    const n = ix.name;
    const k = ix.klassen.get(s.klasse);
    const wo = `${n.klasse(s.klasse)} ${ctx.datum} ${s.stunde}. Stunde ${n.fach(s.fach)}`;
    const liste = [];
    const zweit = s.lehrkraefte[1];

    // Stufe 1: Zweitbesetzung rückt auf
    if (zweit && !abwesend(ix.lehrkraefte.get(zweit), ctx.datum)) {
      liste.push({ stufe: 1, text: `${n.lehrkraft(zweit)} (Zweitbesetzung) übernimmt; Raum und Zeit bleiben`, eintraege: [eintrag(ctx, s, { lehrkraefte: [zweit], status: 'vertreten', grund: 'zweitbesetzungRueckt' })] });
    }

    // Stufe 2: Umplanen – Tausch mit einer Stunde derselben Klasse an einem anderen Tag der Woche
    for (const d2 of ctx.wochentage) {
      if (d2 === ctx.datum || abwesend(ix.lehrkraefte.get(abw), d2)) continue;
      const tp2 = tagesplan(z, d2);
      for (const m of tp2.stunden) {
        if (m.klasse !== s.klasse || m.status !== 'regulaer' || m.quelle !== 'regel' || m.lehrkraefte.includes(abw)) continue;
        if (m.lehrkraefte.some((l) => abwesend(ix.lehrkraefte.get(l), ctx.datum))) continue;
        liste.push({
          stufe: 2,
          text: `Tausch mit ${n.fach(m.fach)} (${m.lehrkraefte.map(n.lehrkraft).join(', ')}) vom ${d2} ${m.stunde}. Stunde; ${n.lehrkraft(abw)} unterrichtet ${n.fach(s.fach)} dann am ${d2}`,
          eintraege: [
            eintrag(ctx, s, { fach: m.fach, lehrkraefte: m.lehrkraefte.slice(), raum: m.raum, status: 'regulaer', grund: 'umgeplant' }),
            { datum: d2, klasse: s.klasse, fach: s.fach, stunde: m.stunde, status: 'regulaer', lehrkraefte: [abw], raum: s.raum, grund: 'umgeplant' },
          ],
        });
      }
    }

    // Stufen 3 und 4: freie Lehrkräfte
    const eigene = new Set([k.klassenlehrkraft, ...(ix.lehrkraefteDerKlasse.get(s.klasse) || [])].filter(Boolean));
    const springer = new Set(Bearbeitung.freieKontingente(z).map((x) => x.lehrkraft));
    const angrenzend = (l) => { const st = ctx.stundenAmTag(l); return st.has(s.stunde - 1) || st.has(s.stunde + 1); };
    const kandidaten = [];
    for (const l of z.lehrkraefte) {
      if (l.id === abw || !ctx.reserveFrei(l.id)) continue;
      const qual = ix.istQualifiziert(l.id, s.fach, k.stufe);
      if (ctx.frei(l.id, s.stunde)) {
        const stufe = eigene.has(l.id) ? 3 : 4;
        const art = stufe === 3 ? (l.id === k.klassenlehrkraft ? 'Klassenlehrkraft' : 'Lehrkraft der Klasse') : qual ? (springer.has(l.id) ? 'Springerpool' : 'freie qualifizierte Lehrkraft') : 'Notfalleinsatz ohne Fachqualifikation';
        const rang = stufe === 3 ? (qual ? 0 : 1) : qual ? (springer.has(l.id) ? 0 : 1) : 3;
        kandidaten.push({ l, stufe, rang, art, qual });
      } else if (!abwesend(l, ctx.datum) && !ix.lehrkraftGesperrt(l.id, ctx.tag, s.stunde)) {
        // nur Zweitbesetzung im Slot → abziehen (Stufe 4)
        const dort = ctx.belegtIm(l.id, s.stunde);
        // (qualifiziert vor Notfalleinsatz; fachfremd nur, wenn niemand anderes frei ist)
        if (dort.length === 1 && dort[0].lehrkraefte[1] === l.id && dort[0].lehrkraefte[0] !== l.id) {
          kandidaten.push({ l, stufe: 4, rang: qual ? 2 : 4, art: `Zweitbesetzung in ${n.klasse(dort[0].klasse)} wird abgezogen${qual ? '' : ', Notfalleinsatz ohne Fachqualifikation'}`, qual, abzug: dort[0] });
        }
      }
    }
    kandidaten.sort((a, b) => a.stufe - b.stufe || a.rang - b.rang || angrenzend(b.l.id) - angrenzend(a.l.id) || (ctx.woche.get(a.l.id) || 0) - (ctx.woche.get(b.l.id) || 0) || a.l.id.localeCompare(b.l.id));
    const proStufe = { 3: 0, 4: 0 };
    for (const c of kandidaten) {
      if (proStufe[c.stufe]++ >= 8) continue; // je Stufe die aussichtsreichsten prüfen
      const eintraege = [eintrag(ctx, s, { lehrkraefte: [c.l.id], status: 'vertreten', grund: c.stufe === 3 ? 'vertretungEigeneLehrkraft' : c.abzug ? 'zweitbesetzungAbgezogen' : c.qual ? 'vertretungQualifiziert' : 'notfalleinsatz' })];
      if (c.abzug) eintraege.push(eintrag(ctx, c.abzug, { lehrkraefte: [c.abzug.lehrkraefte[0]], grund: 'zweitbesetzungAbgezogen' }));
      liste.push({ stufe: c.stufe, text: `${n.lehrkraft(c.l.id)} vertritt (${c.art}${c.qual || c.stufe === 4 ? '' : ', fachfremd'})`, eintraege, rang: c.rang });
      if (c.abzug && !c.qual) eintraege[0].grund = 'notfalleinsatz';
    }

    // Stufe 5: Doppelbetreuung durch eine Lehrkraft, die im Slot eine andere Klasse unterrichtet
    const raumVon = (id) => ix.raeume.get(id);
    const partner = ctx.tp.stunden
      .filter((p) => p.stunde === s.stunde && p.klasse !== s.klasse && Index.STATUS.fachunterricht(p) && p.lehrkraefte.length === 1 && p.raum)
      .map((p) => ({ p, k2: ix.klassen.get(p.klasse) }))
      // bevorzugt Parallelklassen derselben Stufe im Klassenraum
      .sort((a, b) => (raumVon(a.p.raum)?.typ !== 'klassenraum') - (raumVon(b.p.raum)?.typ !== 'klassenraum') || Math.abs(a.k2.stufe - k.stufe) - Math.abs(b.k2.stufe - k.stufe));
    let zahl5 = 0;
    for (const { p, k2 } of partner) {
      if (zahl5 >= 6) break;
      const t = p.lehrkraefte[0];
      if (abwesend(ix.lehrkraefte.get(t), ctx.datum)) continue;
      const r2 = raumVon(p.raum);
      const eigenerRaum = s.raum && raumVon(s.raum);
      let raum = null;
      if (r2 && r2.kapazitaet >= k.schueler + k2.schueler) raum = p.raum;
      else if (eigenerRaum && eigenerRaum.typ === 'klassenraum' && (r2?.nahe || []).includes(s.raum)) raum = s.raum;
      if (!raum) continue;
      zahl5++;
      liste.push({
        stufe: 5,
        text: `${n.lehrkraft(t)} betreut zusätzlich zu ${n.klasse(p.klasse)} (${raum === p.raum ? 'gemeinsam in ' + n.raum(raum) : 'Räume nebeneinander'})`,
        eintraege: [eintrag(ctx, s, { lehrkraefte: [t], raum, status: 'doppeltBetreut', mitKlasse: p.klasse, grund: 'doppelbetreuung' })],
      });
    }

    liste.push(...kandidatenAufteilung(ctx, s), ...kandidatenEntfall(ctx, s, abw));
    return liste.map((c) => ({ ...c, wo }));
  }

  /** Stufe 6: Aufteilung auf Klassen, die im Slot Unterricht haben (Kapazität, H6). */
  function kandidatenAufteilung(ctx, s) {
    const { ix } = ctx;
    const n = ix.name;
    const k = ix.klassen.get(s.klasse);
    const gaeste = new Map();
    for (const x of ctx.tp.stunden) {
      if (x.stunde !== s.stunde || x.status !== 'aufgeteilt') continue;
      for (const v of x.verteilung || []) gaeste.set(v.zielKlasse, (gaeste.get(v.zielKlasse) || 0) + v.anzahl);
    }
    const ziele = ctx.tp.stunden
      .filter((x) => x.stunde === s.stunde && x.klasse !== s.klasse && Index.STATUS.mitRaum(x) && x.raum && x.status !== 'aufgeteilt')
      .map((x) => {
        const k2 = ix.klassen.get(x.klasse);
        const raum = ix.raeume.get(x.raum);
        const belegt = ctx.tp.stunden.filter((y) => y.stunde === s.stunde && y.raum === x.raum && Index.STATUS.mitRaum(y)).reduce((sum, y) => sum + (ix.klassen.get(y.klasse)?.schueler || 0), 0);
        return { klasse: x.klasse, frei: (raum?.kapazitaet || 0) - belegt - (gaeste.get(x.klasse) || 0), abstand: Math.abs(k2.stufe - k.stufe) };
      })
      .filter((x) => x.frei > 0)
      .sort((a, b) => a.abstand - b.abstand || b.frei - a.frei || a.klasse.localeCompare(b.klasse));
    // möglichst wenige Zielklassen, gleichmäßig verteilt (Wasserstand)
    for (let anzahl = 1; anzahl <= ziele.length; anzahl++) {
      const auswahl = ziele.slice(0, anzahl);
      if (auswahl.reduce((sum, x) => sum + x.frei, 0) < k.schueler) continue;
      const verteilung = auswahl.map((x) => ({ zielKlasse: x.klasse, anzahl: 0, frei: x.frei }));
      let rest = k.schueler;
      while (rest > 0) {
        const offen = verteilung.filter((v) => v.anzahl < v.frei).sort((a, b) => a.anzahl - b.anzahl);
        offen[0].anzahl++;
        rest--;
      }
      const gruppen = verteilung.map((v, i) => ({ zielKlasse: v.zielKlasse, anzahl: v.anzahl, gruppe: String.fromCharCode(65 + i) }));
      return [{
        stufe: 6,
        text: `Aufteilung: ${gruppen.map((g) => `Gruppe ${g.gruppe} → ${n.klasse(g.zielKlasse)}: ${g.anzahl} Schüler:innen`).join('; ')}`,
        eintraege: [eintrag(ctx, s, { lehrkraefte: [], raum: null, status: 'aufgeteilt', verteilung: gruppen, grund: 'aufteilung' })],
      }];
    }
    return [];
  }

  /** Stufe 7: Entfall am Tagesrand, Nachrücken der folgenden Stunden oder Aufsicht. */
  function kandidatenEntfall(ctx, s, abw) {
    const { ix, z } = ctx;
    const n = ix.name;
    const tagesStunden = ctx.tp.stunden.filter((x) => x.klasse === s.klasse && Index.STATUS.belegt(x)).sort((a, b) => a.stunde - b.stunde);
    const erste = tagesStunden[0]?.stunde;
    const letzte = tagesStunden[tagesStunden.length - 1]?.stunde;
    const liste = [];
    const entfall = (x, grund) => eintrag(ctx, x, { lehrkraefte: [], raum: null, status: 'entfaellt', grund });
    if (s.stunde === erste || s.stunde === letzte) {
      liste.push({ stufe: 7, rang: 0, text: s.stunde === erste ? 'Entfall: späterer Unterrichtsbeginn' : 'Entfall: früherer Unterrichtsschluss', eintraege: [entfall(s, 'entfallRand')] });
      return liste;
    }
    // Nachrücken: alle folgenden Stunden eine Stunde nach vorn, die letzte entfällt
    const folgende = tagesStunden.filter((x) => x.stunde > s.stunde);
    const eintraege = [];
    let vorher = s.stunde;
    for (const x of folgende) {
      eintraege.push(eintrag(ctx, { ...x, stunde: vorher }, { fach: x.fach, lehrkraefte: x.lehrkraefte.filter((l) => l !== abw), raum: x.raum, status: x.status === 'regulaer' ? 'regulaer' : x.status, grund: 'nachgerueckt' }));
      vorher = x.stunde;
    }
    eintraege.push(entfall({ ...s, stunde: letzte }, 'nachgerueckt')); // es entfällt das Fach der ausgefallenen Stunde
    if (eintraege.every((e) => e.status === 'entfaellt' || e.lehrkraefte.length)) {
      liste.push({ stufe: 7, rang: 1, text: `Nachrücken: die folgenden ${folgende.length} Stunde(n) rücken vor, Unterrichtsschluss eine Stunde früher (${n.fach(s.fach)} entfällt)`, eintraege });
    }
    // Aufsicht durch eine freie Lehrkraft (zählt als Ausfall)
    const raum = s.raum && ix.raeume.get(s.raum)?.typ === 'klassenraum' ? s.raum : ix.klassen.get(s.klasse).heimatraum;
    const frei = z.lehrkraefte.filter((l) => l.id !== abw && ctx.frei(l.id, s.stunde) && ctx.reserveFrei(l.id))
      .sort((a, b) => {
        const nah = (l) => { const st = ctx.stundenAmTag(l.id); return st.has(s.stunde - 1) || st.has(s.stunde + 1) ? 0 : 1; };
        return nah(a) - nah(b) || (ctx.woche.get(a.id) || 0) - (ctx.woche.get(b.id) || 0) || a.id.localeCompare(b.id);
      }).slice(0, 4);
    for (const l of frei) {
      liste.push({ stufe: 7, rang: 2, text: `Aufsicht durch ${n.lehrkraft(l.id)} (ohne Fachunterricht)`, eintraege: [eintrag(ctx, s, { lehrkraefte: [l.id], raum, status: 'aufsicht', grund: 'aufsicht' })] });
    }
    return liste;
  }

  /** Lösungskandidaten bei Raumausfall. */
  function kandidatenRaum(ctx, s) {
    const { ix, z } = ctx;
    const n = ix.name;
    const k = ix.klassen.get(s.klasse);
    const liste = [];
    const typ = ix.faecher.get(s.fach)?.raumtyp || null;
    const belegt = new Set(ctx.tp.stunden.filter((x) => x.stunde === s.stunde && x.raum && Index.STATUS.mitRaum(x)).map((x) => x.raum));
    const passend = z.raeume.filter((r) => !belegt.has(r.id) && r.kapazitaet >= k.schueler && !abwesend(r, ctx.datum) && !ix.raumGesperrt(r.id, ctx.tag, s.stunde)
      && (typ ? ix.raumPasst(r.id, s.fach) : r.typ === 'klassenraum'))
      .sort((a, b) => ((ix.raeume.get(s.raum)?.nahe || []).includes(b.id) - (ix.raeume.get(s.raum)?.nahe || []).includes(a.id)) || a.kapazitaet - b.kapazitaet);
    for (const r of passend.slice(0, 6)) {
      liste.push({ stufe: 1, text: `Ersatzraum ${n.raum(r.id)} (${r.kapazitaet} Plätze)`, eintraege: [eintrag(ctx, s, { raum: r.id, grund: 'raumausfall' })] });
    }
    liste.push(...kandidatenAufteilung(ctx, s), ...kandidatenEntfall(ctx, s, null).filter((c) => c.rang !== 2));
    return liste.map((c) => ({ ...c, wo: `${n.klasse(s.klasse)} ${ctx.datum} ${s.stunde}. Stunde ${n.fach(s.fach)}` }));
  }

  /** Lösungskandidaten für eine Aufsicht der abwesenden Lehrkraft. */
  function kandidatenAufsicht(ctx, a) {
    const { ix, z } = ctx;
    const n = ix.name;
    const erste = a.vorStunde === ix.stunden[0];
    const angrenzendeStunden = erste ? [a.vorStunde] : [a.vorStunde - 1, a.vorStunde];
    const schonDa = new Set(ctx.tp.aufsichten.filter((x) => x.vorStunde === a.vorStunde).map((x) => x.lehrkraft));
    const liste = [];
    const kandidaten = z.lehrkraefte.filter((l) => l.id !== a.lehrkraft && !schonDa.has(l.id) && !abwesend(l, ctx.datum)
      && ctx.stundenAmTag(l.id).size > 0 && !angrenzendeStunden.some((st) => ix.lehrkraftGesperrt(l.id, ctx.tag, st)))
      .map((l) => ({ l, nah: angrenzendeStunden.some((st) => ctx.stundenAmTag(l.id).has(st)) }))
      .sort((x, y) => y.nah - x.nah || (ctx.aufsichtenWoche.get(x.l.id) || 0) - (ctx.aufsichtenWoche.get(y.l.id) || 0) || x.l.id.localeCompare(y.l.id))
      .slice(0, 6);
    for (const { l, nah } of kandidaten) {
      liste.push({
        stufe: nah ? 1 : 2,
        text: `${n.lehrkraft(l.id)} übernimmt die Aufsicht (${nah ? 'hat direkt davor/danach Unterricht' : 'am Tag anwesend'}; ${ctx.aufsichtenWoche.get(l.id) || 0} Aufsichten in dieser Woche)`,
        aufsichtsEintraege: [{ datum: ctx.datum, vorStunde: a.vorStunde, fuer: a.lehrkraft, lehrkraft: l.id, status: 'vertreten' }],
      });
    }
    liste.push({ stufe: 7, text: 'Aufsicht bleibt unbesetzt (keine anwesende Lehrkraft frei)', aufsichtsEintraege: [{ datum: ctx.datum, vorStunde: a.vorStunde, fuer: a.lehrkraft, lehrkraft: null, status: 'unbesetzt' }] });
    return liste.map((c) => ({ ...c, wo: n.pause(ctx.tag, a.vorStunde) + ' am ' + ctx.datum }));
  }

  /* ------------------------------ Vorschläge --------------------------- */

  /**
   * Berechnet Vorschläge für alle betroffenen Stunden und Aufsichten im Zeitraum.
   * Die Vorschläge werden der Reihe nach (Datum, Stunde) auf einer Arbeitskopie
   * angewandt, damit spätere Vorschläge frühere berücksichtigen.
   * @param {{ausgeschlossen?: Set<string>, maxAlternativen?: number}} [optionen]
   *        ausgeschlossen: Schlüssel verworfener Vorschläge (werden übersprungen)
   * @returns {object[]} Vorschläge mit { schluessel, art, datum, stufe, stufeText, text, eintraege, aufsichtsEintraege, vektor, alternativen }
   */
  function vorschlaege(z, von, bis, optionen = {}) {
    const ausgeschlossen = optionen.ausgeschlossen || new Set();
    const maxAlt = optionen.maxAlternativen ?? 6;
    let arbeit = kopie(z);
    const ergebnis = [];
    for (const datum of Hilfen.unterrichtstage(von, bis, z.zeitraster.tage)) {
      const erledigt = new Set();
      for (let schutz = 0; schutz < 500; schutz++) {
        const offen = betroffen(arbeit, datum).filter((b) => !erledigt.has(schluesselVon(b)) && !ausgeschlossen.has(schluesselVon(b)));
        if (!offen.length) break;
        const b = offen[0];
        erledigt.add(schluesselVon(b));
        const v = loese(arbeit, b, maxAlt);
        if (!v) continue;
        ergebnis.push(v);
        arbeit = mitLoesung(arbeit, v);
      }
    }
    return ergebnis;
  }

  const schluesselVon = (b) => [b.datum, b.art, b.klasse ?? b.lehrkraft, b.stunde ?? b.vorStunde].join('|');

  /** Löst einen betroffenen Eintrag nach der Eskalationskette. */
  function loese(z, b, maxAlt = 6) {
    const ctx = kontext(z, b.datum);
    const vorherCache = new Map();
    const vorherVerstoesse = (d) => {
      if (!vorherCache.has(d)) vorherCache.set(d, Regeln.pruefeHart(z, tagesplan(z, d), { datum: d }));
      return vorherCache.get(d);
    };
    let kandidaten;
    let art = b.art;
    if (b.art === 'aufsicht') {
      kandidaten = kandidatenAufsicht(ctx, b);
    } else {
      const s = ctx.tp.stunden.find((x) => x.klasse === b.klasse && x.stunde === b.stunde);
      if (!s) return null;
      if (b.art === 'zweit') {
        kandidaten = [{ stufe: 0, text: `Zweitbesetzung ${ctx.ix.name.lehrkraft(b.lehrkraft)} entfällt; ${ctx.ix.name.lehrkraft(s.lehrkraefte[0])} unterrichtet allein`, eintraege: [eintrag(ctx, s, { lehrkraefte: [s.lehrkraefte[0]], grund: 'zweitbesetzungAbwesend' })], wo: `${ctx.ix.name.klasse(s.klasse)} ${b.datum} ${s.stunde}. Stunde` }];
        art = 'lehrkraft';
      } else if (b.art === 'raum') {
        kandidaten = kandidatenRaum(ctx, s);
      } else {
        kandidaten = kandidatenLehrkraft(ctx, s, b.lehrkraft);
        // „Nicht zweimal hintereinander aufteilen, wenn es eine Alternative gibt“: Aufteilung hinter Stufe 7 einordnen
        const nachbarAufgeteilt = ctx.tp.stunden.some((x) => x.klasse === s.klasse && Math.abs(x.stunde - s.stunde) === 1 && x.status === 'aufgeteilt');
        if (nachbarAufgeteilt) kandidaten = kandidaten.map((c) => (c.stufe === 6 ? { ...c, stufe: 6.5, text: c.text + ' (Klasse war bereits in der Nachbarstunde aufgeteilt)' } : c));
      }
    }
    // Bewerten: Stufe für Stufe; zulässige Kandidaten mit Kostenvektor
    const bewertet = [];
    for (const c of kandidaten) {
      const vektor = pruefe(z, c, vorherVerstoesse);
      if (vektor) bewertet.push({ ...c, vektor });
    }
    if (!bewertet.length) {
      // keine zulässige Lösung: Entfall (ggf. mit Verstoß) als letzte Möglichkeit anbieten
      const s = ctx.tp.stunden.find((x) => x.klasse === b.klasse && x.stunde === b.stunde);
      if (!s) return null;
      const notfall = { stufe: 8, text: 'Keine Lösung ohne Regelverstoß – Stunde entfällt (prüfen!)', eintraege: [eintrag(ctx, s, { lehrkraefte: [], raum: null, status: 'entfaellt', grund: 'keineLoesung' })], wo: `${ctx.ix.name.klasse(s.klasse)} ${b.datum} ${s.stunde}. Stunde` };
      bewertet.push({ ...notfall, vektor: null });
    }
    bewertet.sort((x, y) => x.stufe - y.stufe || (x.vektor && y.vektor ? Kosten.vergleiche(x.vektor, y.vektor) : 0) || (x.rang ?? 0) - (y.rang ?? 0));
    const [beste, ...rest] = bewertet;
    // Alternativen: weitere der gleichen Stufe und die besten späteren Stufen
    const alternativen = [];
    const stufenGesehen = new Set([beste.stufe]);
    for (const c of rest) {
      if (alternativen.length >= maxAlt) break;
      if (c.stufe === beste.stufe || !stufenGesehen.has(c.stufe) || alternativen.filter((x) => x.stufe === c.stufe).length < 2) {
        alternativen.push(c);
        stufenGesehen.add(c.stufe);
      }
    }
    const stufenText = (st) => STUFEN[art][Math.floor(st)] || (st === 8 ? 'Keine regelkonforme Lösung' : '');
    const form = (c) => ({
      stufe: Math.floor(c.stufe), stufeText: stufenText(c.stufe), text: c.text, vektor: c.vektor,
      eintraege: c.eintraege || [], aufsichtsEintraege: c.aufsichtsEintraege || [],
    });
    return {
      schluessel: schluesselVon(b), art: b.art, datum: b.datum, klasse: b.klasse, stunde: b.stunde, vorStunde: b.vorStunde,
      lehrkraft: b.lehrkraft, raum: b.raum, wo: beste.wo, ...form(beste), alternativen: alternativen.map(form),
    };
  }

  /** Übernimmt einen (bestätigten) Vorschlag in den Zustand. */
  function uebernehmen(z, vorschlag) {
    eintragen(z, vorschlag);
  }

  /** Ausfallbericht (§5 Stufe 7): Entfall und Aufsicht im Zeitraum, mit Grund. */
  function ausfallbericht(z, von, bis) {
    const ix = Index.erstelle(z);
    return z.plan.vertretungen
      .filter((v) => v.datum >= von && v.datum <= bis && (v.status === 'entfaellt' || v.status === 'aufsicht'))
      .map((v) => ({ datum: v.datum, klasse: ix.name.klasse(v.klasse), stunde: v.stunde, fach: ix.name.fach(v.fach), status: v.status, grund: GRUENDE[v.grund] || v.grund || '' }));
  }

  /** Lesbare Gründe (Feld „grund“ der Vertretungen). */
  const GRUENDE = {
    zweitbesetzungRueckt: 'Zweitbesetzung rückt auf', zweitbesetzungAbwesend: 'Zweitbesetzung abwesend', umgeplant: 'Umgeplant (Tausch in der Woche)',
    vertretungEigeneLehrkraft: 'Vertretung durch Lehrkraft der Klasse', vertretungQualifiziert: 'Vertretung durch qualifizierte Lehrkraft',
    zweitbesetzungAbgezogen: 'Zweitbesetzung für Vertretung abgezogen', notfalleinsatz: 'Notfalleinsatz (fachfremd)', doppelbetreuung: 'Doppelbetreuung',
    aufteilung: 'Aufteilung der Klasse', entfallRand: 'Entfall am Tagesrand', nachgerueckt: 'Folgende Stunden nachgerückt', aufsicht: 'Aufsicht statt Unterricht',
    raumausfall: 'Raumausfall – Ersatzraum', keineLoesung: 'Keine regelkonforme Lösung gefunden',
  };

  return { STUFEN, GRUENDE, tagesplan, betroffen, vorschlaege, loese, uebernehmen, ausfallbericht };
})();

/* ---- src/kern/80-io.js ---- */
/* ==========================================================================
 * Modul Io (Import/Export)
 * Wandelt den Zustand in JSON-Text und zurück (Spezifikation §8).
 *   - exportiere(): vollständig oder als Teil („stammdaten“ / „plan“)
 *   - importiere(): prüft vollständig, bevor irgendetwas übernommen wird;
 *                   bei einem Fehler bleibt der aktuelle Zustand unverändert
 * Beide Funktionen sind rein (kein DOM, keine Seiteneffekte). Das
 * Herunterladen und das Lesen der Datei übernimmt die Oberfläche.
 * ========================================================================== */
const Io = (() => {
  'use strict';

  const TEILNAMEN = { gesamt: 'alle Daten', stammdaten: 'Stammdaten', plan: 'Plan' };

  /** Kanonischer JSON-Text (Schemareihenfolge, 2 Leerzeichen, Zeilenende). */
  function serialisiere(daten) {
    return JSON.stringify(Schema.ordne(daten), null, 2) + '\n';
  }

  /**
   * Erzeugt Dateiname und Inhalt für einen Export.
   * @param {object} zustand aktueller Zustand
   * @param {{teil?: 'gesamt'|'stammdaten'|'plan', jetzt?: Date}} [optionen]
   * @returns {{dateiname: string, text: string, daten: object}}
   */
  function exportiere(zustand, { teil = 'gesamt', jetzt = new Date() } = {}) {
    if (!(teil in TEILNAMEN)) throw new Error('Unbekannter Exportteil: ' + teil);
    const kopf = { schemaVersion: Modell.SCHEMA_VERSION, exportedAt: Hilfen.isoMitZeitzone(jetzt) };
    let daten;
    if (teil === 'gesamt') {
      daten = { ...Hilfen.tiefeKopie(zustand), ...kopf };
      delete daten.teil;
    } else if (teil === 'stammdaten') {
      // Alles außer dem Plan – auch unbekannte Felder der obersten Ebene bleiben so erhalten.
      daten = { ...Hilfen.tiefeKopie(zustand), ...kopf, teil };
      delete daten.plan;
    } else {
      daten = { ...kopf, teil, plan: Hilfen.tiefeKopie(zustand.plan) };
    }
    const geordnet = Schema.ordne(daten);
    return {
      dateiname: Hilfen.exportDateiname(jetzt, teil === 'gesamt' ? '' : teil),
      text: JSON.stringify(geordnet, null, 2) + '\n',
      daten: geordnet,
    };
  }

  /**
   * Liest eine Exportdatei ein. Verändert `aktuell` nicht.
   * @param {string} text Dateiinhalt
   * @param {object} aktuell aktueller Zustand (für Teil-Importe)
   * @param {{planVerwerfen?: boolean, migrationen?: object}} [optionen]
   *        planVerwerfen: beim Stammdaten-Import den bisherigen Plan nicht übernehmen
   * @returns {{ok: boolean, zustand?: object, teil: 'gesamt'|'stammdaten'|'plan',
   *            fehler: {pfad,meldung}[], warnungen: {pfad,meldung}[],
   *            planUnvertraeglich?: boolean, migriertVon?: number}}
   */
  function importiere(text, aktuell, { planVerwerfen = false, migrationen } = {}) {
    const abgelehnt = (fehler, teil = 'gesamt', extra = {}) => ({ ok: false, teil, fehler, warnungen: [], ...extra });

    // 1. JSON lesen
    let daten;
    try {
      daten = JSON.parse(typeof text === 'string' ? text.replace(/^﻿/, '') : text);
    } catch (e) {
      return abgelehnt([{ pfad: '', meldung: 'Die Datei ist keine gültige JSON-Datei (' + e.message + ')' }]);
    }
    if (daten === null || typeof daten !== 'object' || Array.isArray(daten)) {
      return abgelehnt([{ pfad: '', meldung: 'Die Datei muss ein JSON-Objekt enthalten' }]);
    }

    // 2. Version prüfen und ggf. migrieren
    const m = migrationen ? Schema.migriere(daten, migrationen) : Schema.migriere(daten);
    if (m.fehler.length) return abgelehnt(m.fehler);
    daten = m.daten;

    // 3. Teil bestimmen und mit dem aktuellen Zustand zusammenführen
    const teil = daten.teil === undefined ? 'gesamt' : daten.teil;
    if (!(teil in TEILNAMEN) || teil === 'gesamt' && daten.teil !== undefined) {
      return abgelehnt([{ pfad: 'teil', meldung: `unbekannter Teil „${daten.teil}“; erlaubt: stammdaten, plan` }]);
    }
    let kandidat;
    if (teil === 'gesamt') {
      kandidat = daten;
    } else if (teil === 'stammdaten') {
      if (daten.plan !== undefined) return abgelehnt([{ pfad: 'plan', meldung: 'eine Stammdaten-Datei darf keinen Plan enthalten' }], teil);
      kandidat = { ...daten, plan: planVerwerfen ? {} : Hilfen.tiefeKopie(aktuell.plan) };
    } else {
      if (daten.plan === undefined) return abgelehnt([{ pfad: 'plan', meldung: 'Pflichtfeld fehlt' }], teil);
      const unerwartet = Object.keys(daten).filter((k) => !['schemaVersion', 'exportedAt', 'teil', 'plan'].includes(k) && Schema.ZUSTAND.felder[k]);
      if (unerwartet.length) return abgelehnt(unerwartet.map((k) => ({ pfad: k, meldung: 'eine Plan-Datei darf keine Stammdaten enthalten' })), teil);
      kandidat = { ...Hilfen.tiefeKopie(aktuell), plan: daten.plan };
    }
    delete kandidat.teil;

    // 4. Standardwerte ergänzen und vollständig prüfen
    Schema.normalisiere(kandidat);
    const { fehler, warnungen } = Schema.validiere(kandidat);
    if (fehler.length) {
      const planBetroffen = teil === 'stammdaten' && !planVerwerfen && fehler.every((f) => f.pfad.startsWith('plan'));
      return { ok: false, teil, fehler, warnungen, planUnvertraeglich: planBetroffen };
    }
    if (teil === 'plan') kandidat.exportedAt = aktuell.exportedAt;
    if (kandidat.exportedAt === undefined) delete kandidat.exportedAt;
    return { ok: true, teil, zustand: Schema.ordne(kandidat), fehler: [], warnungen, migriertVon: m.migriertVon };
  }

  return { TEILNAMEN, serialisiere, exportiere, importiere };
})();

/* ==========================================================================
 * Kern-Sammelobjekt
 * Bündelt alle Kernmodule unter einem Namen. Wird vom Worker, von der
 * Oberfläche und von den Node-Tests verwendet. Neue Kernmodule hier eintragen.
 * ========================================================================== */
const Kern = Object.freeze({
  version: '0.1.0',
  Hilfen,
  Modell,
  Schema,
  Verweise,
  Index,
  Regeln,
  Kosten,
  Fluss,

  Bearbeitung,

<!-- Worker-Anbindung: wird nicht hier ausgeführt, sondern mit dem Kern als Blob-Worker gestartet -->
<script id="worker-quelle" type="text/plain">
/* ---- src/worker/worker.js ---- */
/* ==========================================================================
 * Worker-Anbindung
 * Wird nicht im Hauptthread ausgeführt: Der Build legt diesen Text in ein
 * <script type="text/plain">; die Oberfläche erzeugt daraus zusammen mit dem
 * Kern einen Blob-Worker (Spezifikation §6, nur eine HTML-Datei).
 *
 * Nachrichtenprotokoll (Hauptthread → Worker): { typ, id, ...daten }
 * Antworten (Worker → Hauptthread):           { typ, id, ...daten }
 *   ping                      → pong { version }
 *   planen { zustand, optionen } → fortschritt {…} (mehrfach), dann ergebnis { plan, bericht }
 *   abbrechen                 → (keine Antwort; der laufende Plan endet mit der besten Lösung)
 *   unbekannt                 → fehler { meldung }
 * ========================================================================== */
(() => {
  'use strict';
  let laufend = null;

  const behandler = {
    ping(nachricht) {
      return { typ: 'pong', id: nachricht.id, version: Kern.version };
    },

    planen(nachricht) {
      if (laufend) throw new Error('Es läuft bereits eine Planung');
      const lauf = Kern.Planer.starte(nachricht.zustand, nachricht.optionen || {});
      laufend = lauf;
      const id = nachricht.id;
      let letzteMeldung = 0;
      const takt = () => {
        try {
          const fertig = lauf.schritt(40);
          const jetzt = Date.now();
          if (fertig || jetzt - letzteMeldung > 150) {
            self.postMessage({ typ: 'fortschritt', id, ...lauf.fortschritt() });
            letzteMeldung = jetzt;
          }
          if (fertig) {
            laufend = null;
            self.postMessage({ typ: 'ergebnis', id, ...lauf.ergebnis() });
          } else {
            setTimeout(takt, 0); // Nachrichten (z. B. „abbrechen“) dazwischen zulassen
          }
        } catch (fehler) {
          laufend = null;
          self.postMessage({ typ: 'fehler', id, meldung: String(fehler && fehler.message || fehler) });
        }
      };
      setTimeout(takt, 0);
      return null; // Antwort folgt asynchron
    },

    abbrechen() {
      if (laufend) laufend.abbrechen();
      return null;
    },
  };

  self.onmessage = (ereignis) => {
    const nachricht = ereignis.data || {};
    const fn = behandler[nachricht.typ];
    try {
      if (!fn) throw new Error('Unbekannte Nachricht: ' + nachricht.typ);
      const antwort = fn(nachricht);
      if (antwort) self.postMessage(antwort);
    } catch (fehler) {
      self.postMessage({ typ: 'fehler', id: nachricht.id, meldung: String(fehler && fehler.message || fehler) });
    }
  };
})();
</script>
