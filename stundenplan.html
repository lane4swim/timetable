/* ==========================================================================
 * Modul PlanReiter (Oberfläche, Reiter „Plan“)
 * Wochenraster des Regelplans (§7) mit Umschalter Klasse / Lehrkraft / Raum /
 * Aufsicht. Pausen stehen als schmale Zeilen zwischen den Stunden.
 *   - Drag-and-drop: Stunde verschieben (in der Klasse tauschen), Aufsicht
 *     verschieben, Lehrkraft aus „Freie Kontingente“ als Zweitbesetzung bzw.
 *     aus „Aufsichtssoll offen“ als Aufsicht ablegen
 *   - Tastatur: Pfeiltasten wählen die Zelle, Enter/Leertaste nimmt auf bzw.
 *     legt ab, Esc bricht ab, Entf entfernt Zweitbesetzung bzw. Aufsicht
 *   - Konflikte: rot umrandet, mit ⚠ und Regelnummer (nie nur Farbe)
 *   - Druckansicht je Klasse und Lehrkraft (einzeln oder alle)
 * ========================================================================== */
const PlanReiter = (() => {
  'use strict';
  const MIME = 'application/x-stundenplan';
  let panel = null;
  let sichtbar = () => {};
  const ansicht = { art: 'klasse', id: null };
  let aufgenommen = null; // { art: 'stunde'|'aufsicht'|'zweit'|'aufsichtNeu', index?, lehrkraft? }
  let aktiv = { zeile: 0, spalte: 0 };
  let letzteDauerMs = 0;

  const ARTEN = [['klasse', 'Klasse'], ['lehrkraft', 'Lehrkraft'], ['raum', 'Raum'], ['aufsicht', 'Aufsicht']];

  /* ------------------------------ Aufbau ------------------------------- */

  function baue(ziel) {
    panel = ziel;
    const el = App.el;
    panel.append(
      el('div', { class: 'plan-werkzeuge' },
        el('div', { class: 'umschalter', role: 'group', 'aria-label': 'Ansicht' },
          ...ARTEN.map(([art, titel]) => el('button', { type: 'button', class: 'knopf', id: 'ansicht-' + art, 'aria-pressed': String(art === ansicht.art), text: titel, onclick: () => wechsle(art) }))),
        el('label', { class: 'feld-zeile' }, el('span', { id: 'plan-auswahl-titel', text: 'Klasse' }),
          el('select', { id: 'plan-auswahl', 'aria-labelledby': 'plan-auswahl-titel', onchange: (e) => { ansicht.id = e.target.value; render(); } })),
        el('button', { type: 'button', class: 'knopf', id: 'plan-drucken', text: 'Drucken', onclick: () => drucke(false) }),
        el('button', { type: 'button', class: 'knopf', id: 'plan-drucken-alle', text: 'Alle drucken', onclick: () => drucke(true) })),
      el('p', { class: 'hinweis', text: 'Ziehen Sie Stunden auf andere Zeitslots (in der Klasse wird getauscht). Tastatur: Pfeiltasten, Enter zum Aufnehmen und Ablegen, Esc zum Abbrechen, Entf entfernt Zweitbesetzung oder Aufsicht.' }),
      el('p', { id: 'plan-ansage', class: 'ansage', 'aria-live': 'polite' }),
      el('div', { class: 'plan-layout' },
        el('div', { class: 'plan-raster-rahmen', id: 'plan-raster-rahmen' }),
        el('aside', { class: 'plan-seite', id: 'plan-seite', 'aria-label': 'Konflikte und freie Lehrkräfte' })),
    );
    if (!document.getElementById('druckbereich')) document.body.append(el('div', { id: 'druckbereich' }));
    window.addEventListener('afterprint', () => document.getElementById('druckbereich').replaceChildren());
    sichtbar = App.beobachteSichtbar(panel, render);
    render();
  }

  function wechsle(art, id) {
    ansicht.art = art;
    ansicht.id = id ?? null;
    aufgenommen = null;
    aktiv = { zeile: 0, spalte: 0 };
    for (const [a] of ARTEN) panel.querySelector('#ansicht-' + a).setAttribute('aria-pressed', String(a === art));
    render();
  }

  const listeFuer = (d, art) => (art === 'klasse' ? d.klassen.map((k) => [k.id, k.name])
    : art === 'lehrkraft' ? d.lehrkraefte.map((l) => [l.id, `${l.kuerzel} – ${l.name}`])
      : art === 'raum' ? d.raeume.map((r) => [r.id, r.name]) : []);

  /* --------------------------- Daten aufbereiten ----------------------- */

  /** Konflikte je Stunde/Aufsicht und Gäste aus Aufteilungen. */
  function analysiere(d) {
    const verstoesse = Kern.Regeln.pruefeHart(d);
    const stundeRegeln = new Map();
    const aufsichtRegeln = new Map();
    const texte = new Map();
    for (const v of verstoesse) {
      for (const i of v.stunden) { if (!stundeRegeln.has(i)) stundeRegeln.set(i, new Set()); stundeRegeln.get(i).add(v.regel); texte.set('s' + i, [...(texte.get('s' + i) || []), `${v.regel}: ${v.text}`]); }
      for (const i of v.aufsichten) { if (!aufsichtRegeln.has(i)) aufsichtRegeln.set(i, new Set()); aufsichtRegeln.get(i).add(v.regel); texte.set('a' + i, [...(texte.get('a' + i) || []), `${v.regel}: ${v.text}`]); }
    }
    const gaeste = new Map(); // Klasse|Tag|Stunde → Anzahl
    for (const s of d.plan.regelplan) {
      if (s.status !== 'aufgeteilt') continue;
      for (const v of s.verteilung || []) { const k = `${v.zielKlasse}|${s.tag}|${s.stunde}`; gaeste.set(k, (gaeste.get(k) || 0) + v.anzahl); }
    }
    return { verstoesse, stundeRegeln, aufsichtRegeln, texte, gaeste };
  }

  /* ------------------------------ Darstellung -------------------------- */

  function render() {
    const t0 = performance.now();
    const d = App.zustand.daten;
    const ix = Kern.Index.erstelle(d);
    const liste = listeFuer(d, ansicht.art);
    if (ansicht.art !== 'aufsicht' && !liste.some(([id]) => id === ansicht.id)) ansicht.id = liste[0]?.[0] ?? null;
    const auswahl = panel.querySelector('#plan-auswahl');
    panel.querySelector('#plan-auswahl-titel').textContent = ARTEN.find(([a]) => a === ansicht.art)[1];
    auswahl.closest('label').hidden = ansicht.art === 'aufsicht';
    auswahl.replaceChildren(...liste.map(([id, text]) => App.el('option', { value: id, text, selected: id === ansicht.id })));
    panel.querySelector('#plan-drucken-alle').textContent = ansicht.art === 'lehrkraft' ? 'Alle Lehrkräfte drucken' : ansicht.art === 'raum' ? 'Alle Räume drucken' : ansicht.art === 'aufsicht' ? 'Aufsichtsplan drucken' : 'Alle Klassen drucken';

    const info = analysiere(d);
    const rahmen = panel.querySelector('#plan-raster-rahmen');
    const imRaster = rahmen.contains(document.activeElement);
    if (!d.plan.regelplan.length && ansicht.art !== 'aufsicht') {
      rahmen.replaceChildren(App.el('p', { class: 'leise', id: 'plan-leer', text: 'Noch kein Regelplan – bitte im Reiter „Planung“ erstellen oder im Reiter „Daten“ importieren.' }));
    } else if (!ix.tage.length) {
      rahmen.replaceChildren();
    } else {
      rahmen.replaceChildren(raster(d, ix, info, ansicht.art, ansicht.id, false));
    }
    renderSeite(d, ix, info);
    setzeAktiv(imRaster);
    letzteDauerMs = performance.now() - t0;
    panel.dataset.renderMs = letzteDauerMs.toFixed(1);
  }

  /** Erzeugt das Wochenraster (Bildschirm oder Druck). */
  function raster(d, ix, info, art, id, fuerDruck) {
    const el = App.el;
    const pausen = new Map(ix.pausen.map((p) => [p.vorStunde, p]));
    const titel = art === 'aufsicht' ? 'Aufsichtsplan' : `Stundenplan ${ARTEN.find(([a]) => a === art)[1]} ${listeFuer(d, art).find(([x]) => x === id)?.[1] || ''}`;
    const tabelle = el('table', { class: 'raster', role: fuerDruck ? null : 'grid', 'aria-label': titel, 'data-art': art });
    tabelle.append(el('thead', {}, el('tr', {}, el('th', { scope: 'col', class: 'raster-ecke', text: art === 'aufsicht' ? 'Pause' : 'Stunde' }), ...ix.tage.map((t) => el('th', { scope: 'col', text: t })))));
    const koerper = el('tbody');
    const eintraege = d.plan.regelplan.map((s, i) => [s, i]).filter(([s]) => art === 'klasse' ? s.klasse === id
      : art === 'lehrkraft' ? s.lehrkraefte.includes(id) : art === 'raum' ? s.raum === id : false);
    const proSlot = new Map();
    for (const [s, i] of eintraege) { const k = s.tag + '|' + s.stunde; if (!proSlot.has(k)) proSlot.set(k, []); proSlot.get(k).push(i); }
    const aufsichtenJe = new Map();
    d.plan.aufsichten.forEach((a, i) => { if (art === 'lehrkraft' && a.lehrkraft !== id) return; const k = a.tag + '|' + a.vorStunde; if (!aufsichtenJe.has(k)) aufsichtenJe.set(k, []); aufsichtenJe.get(k).push(i); });
    const klassenDa = new Set(d.plan.regelplan.filter((s) => s.status !== 'entfaellt').map((s) => s.tag + '|' + s.stunde));

    for (const st of d.zeitraster.stunden) {
      const p = pausen.get(st.nr);
      if (p && (art === 'aufsicht' || art === 'lehrkraft' || art === 'klasse' || art === 'raum')) {
        const tr = el('tr', { class: 'pausenzeile' }, el('th', { scope: 'row', text: `${p.name || 'Pause'}${art === 'aufsicht' ? ` (vor ${st.nr}.) · Bedarf ${p.aufsichten}` : ''}` }));
        for (const tag of ix.tage) {
          const td = el('td', { 'data-tag': tag, 'data-pause': String(st.nr), class: 'zelle pause' });
          if (art === 'aufsicht' || art === 'lehrkraft') {
            for (const i of aufsichtenJe.get(tag + '|' + st.nr) || []) td.append(aufsichtChip(d, info, i, fuerDruck));
            if (art === 'aufsicht') {
              const ist = (aufsichtenJe.get(tag + '|' + st.nr) || []).length;
              const bedarf = klassenDa.has(tag + '|' + st.nr) ? p.aufsichten : 0;
              td.append(el('span', { class: 'bedarf' + (ist < bedarf ? ' fehlt' : ''), title: ist < bedarf ? 'Aufsicht unbesetzt (Ziel 1A)' : null, text: `${ist < bedarf ? '⚠ ' : ''}${ist}/${bedarf}` }));
            }
          }
          if (!fuerDruck) zielZelle(td);
          tr.append(td);
        }
        koerper.append(tr);
      }
      if (art === 'aufsicht') continue;
      const tr = el('tr', {}, el('th', { scope: 'row' }, el('span', { class: 'stunde-nr', text: `${st.nr}.` }), el('span', { class: 'stunde-zeit', text: `${st.von}–${st.bis}` })));
      for (const tag of ix.tage) {
        const td = el('td', { 'data-tag': tag, 'data-stunde': String(st.nr), class: 'zelle' });
        for (const i of proSlot.get(tag + '|' + st.nr) || []) td.append(karte(d, ix, info, art, id, i, fuerDruck));
        if (art === 'klasse') {
          const g = info.gaeste.get(`${id}|${tag}|${st.nr}`);
          if (g) td.append(el('span', { class: 'gaeste', text: `+ ${g} Gäste` }));
        }
        if (!fuerDruck) zielZelle(td);
        tr.append(td);
      }
      koerper.append(tr);
    }
    tabelle.append(koerper);
    return tabelle;
  }

  /** Karte einer Unterrichtsstunde. */
  function karte(d, ix, info, art, id, i, fuerDruck) {
    const el = App.el;
    const s = d.plan.regelplan[i];
    const n = ix.name;
    const regeln = info.stundeRegeln.get(i);
    const k = el('div', {
      class: 'karte' + (regeln ? ' konflikt' : '') + ' status-' + s.status, 'data-index': String(i),
      draggable: fuerDruck ? null : 'true', title: regeln ? info.texte.get('s' + i).join('\n') : null,
    });
    const fach = s.fach ? n.fach(s.fach) : '–';
    const statusText = { vertreten: 'vertreten', doppeltBetreut: '⇄', aufgeteilt: 'aufgeteilt', entfaellt: 'entfällt', aufsicht: 'Aufsicht' }[s.status];
    if (art === 'klasse') {
      k.append(el('strong', { text: fach }));
    } else {
      k.append(el('strong', { text: n.klasse(s.klasse) }), document.createTextNode(' ' + fach));
    }
    if (art === 'lehrkraft' && s.lehrkraefte[1] === id) k.append(el('span', { class: 'zweit-hinweis', text: ' (2.)' }));
    if (statusText) k.append(el('span', { class: 'status-marke', text: ' ' + statusText }));
    if (s.status === 'doppeltBetreut' && s.mitKlasse) k.append(el('span', { class: 'status-marke', text: ` mit ${n.klasse(s.mitKlasse)}` }));
    // Lehrkräfte (in der Lehrkraft-Ansicht die jeweils andere)
    const lehrer = el('div', { class: 'karte-lehrer' });
    s.lehrkraefte.forEach((l, rolle) => {
      if (art === 'lehrkraft' && l === id) return;
      const span = el('span', { class: rolle ? 'zweit' : 'haupt', text: (rolle ? '+' : '') + n.lehrkraft(l) });
      lehrer.append(span, document.createTextNode(' '));
      if (rolle && !fuerDruck && art === 'klasse') {
        lehrer.append(el('button', { type: 'button', class: 'mini', tabindex: '-1', 'aria-label': `Zweitbesetzung ${n.lehrkraft(l)} entfernen`, title: 'Zweitbesetzung entfernen', text: '×', onclick: (e) => { e.stopPropagation(); fuehreAus({ art: 'zweitWeg', index: i }); } }));
      }
    });
    if (lehrer.childNodes.length) k.append(lehrer);
    if (art !== 'raum' && s.raum) k.append(el('div', { class: 'karte-raum', text: n.raum(s.raum) }));
    if (regeln) k.append(el('div', { class: 'konflikt-marke', text: '⚠ ' + [...regeln].join(' ') }));
    if (!fuerDruck) {
      k.addEventListener('dragstart', (e) => { e.dataTransfer.setData(MIME, JSON.stringify({ art: 'stunde', index: i })); e.dataTransfer.effectAllowed = 'move'; });
    }
    return k;
  }

  function aufsichtChip(d, info, i, fuerDruck) {
    const el = App.el;
    const a = d.plan.aufsichten[i];
    const regeln = info.aufsichtRegeln.get(i);
    const chip = el('span', {
      class: 'chip' + (regeln ? ' konflikt' : ''), 'data-aufsicht': String(i), draggable: fuerDruck ? null : 'true',
      title: regeln ? info.texte.get('a' + i).join('\n') : null,
    }, ansicht.art === 'lehrkraft' && !fuerDruck ? 'Aufsicht' : (d.lehrkraefte.find((l) => l.id === a.lehrkraft)?.kuerzel || a.lehrkraft));
    if (regeln) chip.append(el('span', { class: 'konflikt-marke', text: ' ⚠ ' + [...regeln].join(' ') }));
    if (!fuerDruck) {
      chip.append(el('button', { type: 'button', class: 'mini', tabindex: '-1', 'aria-label': 'Aufsicht entfernen', title: 'Aufsicht entfernen', text: '×', onclick: (e) => { e.stopPropagation(); fuehreAus({ art: 'aufsichtWeg', index: i }); } }));
      chip.addEventListener('dragstart', (e) => { e.dataTransfer.setData(MIME, JSON.stringify({ art: 'aufsicht', index: i })); e.dataTransfer.effectAllowed = 'move'; });
    }
    return chip;
  }

  /** Macht eine Zelle zum Ablageziel und zur Tastatur-Zelle. */
  function zielZelle(td) {
    td.setAttribute('role', 'gridcell');
    td.tabIndex = -1;
    td.addEventListener('dragover', (e) => {
      if (!Array.from(e.dataTransfer.types).includes(MIME)) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      td.classList.add('ziel');
    });
    td.addEventListener('dragleave', () => td.classList.remove('ziel'));
    td.addEventListener('drop', (e) => {
      const roh = e.dataTransfer.getData(MIME);
      if (!roh) return;
      e.preventDefault();
      td.classList.remove('ziel');
      const nutzlast = JSON.parse(roh);
      const karte = e.target.closest?.('.karte');
      lege(nutzlast, td, karte ? Number(karte.dataset.index) : null);
    });
    td.addEventListener('click', () => { const r = koordinaten(td); if (r) { aktiv = r; setzeAktiv(true); } });
    td.addEventListener('focus', () => { const r = koordinaten(td); if (r && (r.zeile !== aktiv.zeile || r.spalte !== aktiv.spalte)) { aktiv = r; setzeAktiv(false); } });
    td.addEventListener('keydown', tasten);
  }

  function renderSeite(d, ix, info) {
    const el = App.el;
    const seite = panel.querySelector('#plan-seite');
    const v = info.verstoesse;
    const konflikte = el('section', { class: 'seiten-block', id: 'plan-konflikte' },
      el('h3', { text: v.length ? `⚠ Konflikte (${v.length})` : '✓ Keine Verstöße gegen harte Regeln' }));
    if (v.length) {
      konflikte.append(el('p', { class: 'fehler-text', text: 'Der Regelplan ist ungültig. Klicken Sie auf einen Eintrag, um ihn anzuzeigen.' }),
        el('ul', { class: 'konfliktliste' }, ...v.slice(0, 100).map((x) => el('li', {}, el('button', {
          type: 'button', class: 'link', onclick: () => zeigeVerstoss(x),
        }, el('strong', { text: x.regel }), ' ' + x.text)))));
    }

    const offen = Kern.Bearbeitung.offeneAufsichten(d);
    const kontingente = el('section', { class: 'seiten-block', id: 'plan-frei' },
      el('h3', { text: 'Freie Kontingente (Zweitbesetzung)' }),
      el('p', { class: 'leise', text: 'Auf eine Stunde ziehen oder mit Enter aufnehmen.' }),
      frei.length ? el('div', { class: 'chips' }, ...frei.map((f) => quelle(d, f.lehrkraft, `noch ${f.frei}`, 'zweit'))) : el('p', { class: 'leise', text: 'Keine.' }));
    const aufsicht = el('section', { class: 'seiten-block', id: 'plan-aufsicht-offen' },
      el('h3', { text: 'Aufsichtssoll offen' }),
      offen.length ? el('div', { class: 'chips' }, ...offen.map((f) => quelle(d, f.lehrkraft, `noch ${f.offen}`, 'aufsichtNeu'))) : el('p', { class: 'leise', text: 'Keine.' }));
    const legende = el('section', { class: 'seiten-block' }, el('h3', { text: 'Zeichen' }),
      el('ul', { class: 'legende' }, ...[['⚠ H1', 'Verstoß gegen harte Regel (Nummer)'], ['+KÜR', 'Zweitbesetzung'], ['(2.)', 'Lehrkraft ist hier Zweitbesetzung'], ['⇄', 'Doppelbetreuung'], ['aufgeteilt / + n Gäste', 'Aufteilung einer Klasse']]
        .map(([z, t]) => el('li', {}, el('strong', { text: z }), ' – ' + t))));
    const teile = [konflikte];
    if (ansicht.art !== 'aufsicht') teile.push(kontingente);
    if (ansicht.art === 'aufsicht' || ansicht.art === 'lehrkraft') teile.push(aufsicht);
    teile.push(legende);
    seite.replaceChildren(...teile);
  }

  function quelle(d, lehrkraft, zusatz, art) {
    const l = d.lehrkraefte.find((x) => x.id === lehrkraft);
    const chip = App.el('button', {
      type: 'button', class: 'chip quelle', draggable: 'true', 'data-quelle': art, 'data-lehrkraft': lehrkraft,
      'aria-label': `${l.kuerzel} (${l.name}) ${zusatz} – aufnehmen`, text: `${l.kuerzel} · ${zusatz}`,
      onclick: () => { aufgenommen = { art, lehrkraft }; ansage(`${l.kuerzel} aufgenommen – Zielzelle mit den Pfeiltasten wählen und Enter drücken (Esc bricht ab).`); setzeAktiv(true); },
    });
    chip.addEventListener('dragstart', (e) => { e.dataTransfer.setData(MIME, JSON.stringify({ art, lehrkraft })); e.dataTransfer.effectAllowed = 'copy'; });
    return chip;
  }

  function zeigeVerstoss(v) {
    const d = App.zustand.daten;
    if (v.stunden.length) {
      const s = d.plan.regelplan[v.stunden[0]];
      const art = v.regel === 'H3' || v.regel === 'H5' || v.regel === 'H6' ? 'raum' : v.regel === 'H1' || v.regel === 'H4' || v.regel === 'H7' || v.regel === 'H11' ? 'lehrkraft' : 'klasse';
      const id = art === 'raum' && s.raum ? s.raum : art === 'lehrkraft' ? s.lehrkraefte[0] : s.klasse;
      wechsle(id ? art : 'klasse', id || s.klasse);
      fokussiereSlot(s.tag, s.stunde);
    } else if (v.aufsichten.length) {
      const a = d.plan.aufsichten[v.aufsichten[0]];

    }

  }

  /* ------------------------------ Aktionen ----------------------------- */

  /** Legt eine Nutzlast auf einer Zelle ab. */
  function lege(nutzlast, td, kartenIndex) {
    const tag = td.dataset.tag;
    const stunde = td.dataset.stunde ? Number(td.dataset.stunde) : null;
    const pause = td.dataset.pause ? Number(td.dataset.pause) : null;
    if (nutzlast.art === 'stunde') {
      if (stunde === null) return ansage('Stunden können nur auf Stunden-Zellen abgelegt werden.');
      return fuehreAus({ art: 'stunde', index: nutzlast.index, tag, stunde });
    }
    if (nutzlast.art === 'zweit') {
      const index = kartenIndex ?? (td.querySelector('.karte') ? Number(td.querySelector('.karte').dataset.index) : null);
      if (index === null) return ansage('Bitte auf eine Unterrichtsstunde ablegen.');
      return fuehreAus({ art: 'zweit', index, lehrkraft: nutzlast.lehrkraft });
    }
    if (pause === null) return ansage('Aufsichten können nur auf Pausen-Zellen abgelegt werden.');
    if (nutzlast.art === 'aufsicht') return fuehreAus({ art: 'aufsicht', index: nutzlast.index, tag, vorStunde: pause });
    if (nutzlast.art === 'aufsichtNeu') return fuehreAus({ art: 'aufsichtNeu', lehrkraft: nutzlast.lehrkraft, tag, vorStunde: pause });

  }

  /** Führt eine Bearbeitung über App.aendere aus (rückgängig machbar). */
  function fuehreAus(aktion) {
    const B = Kern.Bearbeitung;
    let r = null;
    const ergebnis = App.aendere(() => r.text, (d) => {
      r = aktion.art === 'stunde' ? B.verschiebeStunde(d, aktion.index, aktion.tag, aktion.stunde)
        : aktion.art === 'zweit' ? B.setzeZweit(d, aktion.index, aktion.lehrkraft)
          : aktion.art === 'zweitWeg' ? B.setzeZweit(d, aktion.index, null)
            : aktion.art === 'aufsicht' ? B.verschiebeAufsicht(d, aktion.index, aktion.tag, aktion.vorStunde)
              : aktion.art === 'aufsichtNeu' ? B.neueAufsicht(d, aktion.tag, aktion.vorStunde, aktion.lehrkraft)
                : B.entferneAufsicht(d, aktion.index);
      if (r.fehler) return false;
    });
    aufgenommen = null;
    if (r?.fehler) { ansage('⚠ ' + r.fehler); return false; }
    if (!ergebnis.ok) { ansage('⚠ Änderung nicht möglich: ' + (ergebnis.fehler[0]?.meldung || '')); return false; }
    const v = Kern.Regeln.pruefeHart(App.zustand.daten).length;
    const satz = r.text.endsWith('.') ? r.text : r.text + '.';
    ansage(`${satz}${v ? ` Der Plan hat jetzt ${v === 1 ? 'einen Verstoß' : v + ' Verstöße'} gegen harte Regeln.` : ''}`);

  function ansage(text) {
    panel.querySelector('#plan-ansage').textContent = text;
  }

  /* ------------------------------ Tastatur ----------------------------- */

  function zellen() {
    const tabelle = panel.querySelector('.raster');
    return tabelle ? [...tabelle.querySelectorAll('tbody tr')].map((tr) => [...tr.querySelectorAll('td')]) : [];
  }
  function koordinaten(td) {
    const z = zellen();
    for (let r = 0; r < z.length; r++) { const c = z[r].indexOf(td); if (c >= 0) return { zeile: r, spalte: c }; }
    return null;
  }
  function setzeAktiv(fokus) {
    const z = zellen();
    if (!z.length) return;
    aktiv.zeile = Math.max(0, Math.min(aktiv.zeile, z.length - 1));
    aktiv.spalte = Math.max(0, Math.min(aktiv.spalte, z[aktiv.zeile].length - 1));
    z.flat().forEach((td) => { td.tabIndex = -1; td.classList.remove('aufgenommen-ziel'); });

    td.tabIndex = 0;
    if (aufgenommen) td.classList.add('aufgenommen-ziel');
    panel.querySelectorAll('.aufgenommen').forEach((x) => x.classList.remove('aufgenommen'));
    if (aufgenommen?.art === 'stunde') panel.querySelector(`.karte[data-index="${aufgenommen.index}"]`)?.classList.add('aufgenommen');
    if (aufgenommen?.art === 'aufsicht') panel.querySelector(`.chip[data-aufsicht="${aufgenommen.index}"]`)?.classList.add('aufgenommen');

  }
  function fokussiereSlot(tag, stunde, pause) {
    const sel = stunde !== null && stunde !== undefined ? `td[data-tag="${tag}"][data-stunde="${stunde}"]` : `td[data-tag="${tag}"][data-pause="${pause}"]`;
    const td = panel.querySelector('.raster ' + sel);
    const k = td && koordinaten(td);

  }

  function tasten(e) {
    const z = zellen();
    const schritte = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
    if (schritte[e.key]) {
      e.preventDefault();

      return;
    }
    if (e.key === 'Delete' || e.key === 'Backspace') {
      e.preventDefault();
      const c = td.querySelector('.chip[data-aufsicht]');
      const k = [...td.querySelectorAll('.karte')].find((x) => App.zustand.daten.plan.regelplan[Number(x.dataset.index)]?.lehrkraefte.length > 1);
      const merke = { ...aktiv };
      if (ansicht.art === 'klasse' && k) fuehreAus({ art: 'zweitWeg', index: Number(k.dataset.index) });
      else if (c) fuehreAus({ art: 'aufsichtWeg', index: Number(c.dataset.aufsicht) });
      else ansage('Hier gibt es keine Zweitbesetzung oder Aufsicht zum Entfernen.');
      aktiv = merke;
      setzeAktiv(true);
    }
  }

  /* ------------------------------- Druck ------------------------------- */

  /** Füllt den Druckbereich (eine oder alle Entitäten der Ansicht). */
  function druckvorbereitung(alle) {
    const d = App.zustand.daten;
    const ix = Kern.Index.erstelle(d);

    const el = App.el;

    const bereich = document.getElementById('druckbereich');
    bereich.replaceChildren(...ids.map((id) => {
      const t = raster(d, ix, info, art, id, true);
      return el('section', { class: 'druckseite' },
        el('h2', { text: `${t.getAttribute('aria-label')}` }),
        el('p', { class: 'leise', text: `${d.schule?.name || ''} ${d.schule?.schuljahr || ''}`.trim() }),
        t);
    }));
    return ids.length;
  }

  function drucke(alle) {
    druckvorbereitung(alle);
    window.print();
  }

  return { sichtbar: () => sichtbar(), baue, wechsle, druckvorbereitung, fuehreAus, dauer: () => letzteDauerMs };
})();

    render();
  }

  function fuelleWer() {

  /* ---------------------------- Abwesenheiten -------------------------- */

        ...optionen.map((o, i) => el('option', { value: String(i), text: `${i === 0 ? '★ ' : ''}Stufe ${o.stufe}: ${o.stufeText} – ${o.text}` })));
      const beschreibung = el('div', {}, el('strong', { text: `${v.stufe === 8 ? '⚠ ' : ''}Stufe ${v.stufe}: ${v.stufeText}` }), el('div', { class: 'vs-text', text: v.text }));
      const kosten = el('td', { class: 'zahl', text: v.vektor ? v.vektor.slice(0, 5).join(' ') : '–' });
      auswahl.addEventListener('change', () => {
        const o = optionen[Number(auswahl.value)];
        beschreibung.replaceChildren(el('strong', { text: `${o.stufe === 8 ? '⚠ ' : ''}Stufe ${o.stufe}: ${o.stufeText}` }), el('div', { class: 'vs-text', text: o.text }));
        kosten.textContent = o.vektor ? o.vektor.slice(0, 5).join(' ') : '–';
      });
      return el('tr', { 'data-schluessel': v.schluessel, class: v.stufe === 8 ? 'vs-problem' : null },
        el('td', { text: v.datum }), el('td', { text: zeit }), el('th', { scope: 'row', text: betroffen }), el('td', { text: ausfall }),
        el('td', {}, beschreibung, optionen.length > 1 ? el('details', {}, el('summary', { text: `Andere Lösung wählen (${optionen.length - 1})` }), auswahl) : null),
        kosten,
        el('td', { class: 'knopfleiste' },
          el('button', { type: 'button', class: 'knopf knopf-klein knopf-primaer', 'data-aktion': 'uebernehmen', text: 'Übernehmen', onclick: () => uebernehme(nr, optionen[Number(auswahl.value)]) }),
          el('button', { type: 'button', class: 'knopf knopf-klein', 'data-aktion': 'verwerfen', text: 'Verwerfen', onclick: () => { verworfen.add(v.schluessel); berechne(false); } })));
    });
    tabelle.replaceChildren(el('caption', { text: 'Vorschläge (★ = günstigste Lösung)' }), kopf, el('tbody', {}, ...zeilen));
  }

  /** Übernimmt eine Lösung; die Änderung zeichnet neu (Vorschläge und Tagesplan). */
  function uebernehme(nr, loesung) {
    const v = vorschlaege[nr];
    tagesDatum = v.datum;
    panel.querySelector('#tag-datum').value = tagesDatum;
    const r = App.aendere(`Vertretung übernommen: ${v.wo} – ${loesung.stufeText}`, (d) => Kern.Vertretung.uebernehmen(d, loesung));
    if (!r.ok) panel.querySelector('#vs-status').textContent = '⚠ Nicht übernommen: ' + (r.fehler[0]?.meldung || '');
  }

  function alleUebernehmen() {
    if (!vorschlaege.length) return;
    const anzahl = vorschlaege.length;
    const kopie = vorschlaege.slice();
    App.aendere(`${anzahl} Vertretungsvorschläge übernommen`, (d) => { for (const v of kopie) Kern.Vertretung.uebernehmen(d, v); });
    panel.querySelector('#vs-status').textContent = `${anzahl === 1 ? 'Ein Vorschlag' : anzahl + ' Vorschläge'} übernommen. ` + panel.querySelector('#vs-status').textContent;
  }

  /* -------------------------- Tagesvertretungsplan --------------------- */

  function tagesInhalt(d, fuerDruck) {
    const el = App.el;
    const ix = Kern.Index.erstelle(d);
    const n = ix.name;
    const datum = tagesDatum;
    if (!Kern.Hilfen.istIsoDatum(datum)) return [el('p', { class: 'leise', text: 'Bitte ein Datum wählen.' })];
    const tag = Kern.Hilfen.wochentag(datum);
    if (!ix.tage.includes(tag)) return [el('p', { class: 'leise', text: `${datum} ist ein ${tag} – kein Unterrichtstag.` })];
    const tp = Kern.Vertretung.tagesplan(d, datum);
    const regel = new Map(d.plan.regelplan.filter((s) => s.tag === tag).map((s) => [s.klasse + '|' + s.stunde, s]));
    const eintraege = d.plan.vertretungen.map((v, i) => [v, i]).filter(([v]) => v.datum === datum)
      .sort(([a], [b]) => a.stunde - b.stunde || n.klasse(a.klasse).localeCompare(n.klasse(b.klasse)));
    const aufs = d.plan.aufsichtsVertretungen.map((v, i) => [v, i]).filter(([v]) => v.datum === datum);
    const status = { regulaer: 'regulär', vertreten: 'vertreten', doppeltBetreut: '⇄ Doppelbetreuung', aufgeteilt: 'aufgeteilt', entfaellt: 'entfällt', aufsicht: 'Aufsicht' };
    const wer = (liste) => (liste || []).map((l, r) => (r ? '+' : '') + n.lehrkraft(l)).join(' ') || '–';
    const teile = [];
    teile.push(el('table', { class: 'tabelle', id: fuerDruck ? null : 'tag-vertretungen' },
      el('caption', { text: `Vertretungen am ${tag}, ${datum} (${eintraege.length})` }),
      el('thead', {}, el('tr', {}, ...['Stunde', 'Klasse', 'Fach', 'Regulär', 'Status', 'Lehrkraft', 'Raum', 'Grund', ...(fuerDruck ? [] : [''])].map((t) => el('th', { scope: 'col', text: t })))),
      el('tbody', {}, ...(eintraege.length ? eintraege.map(([v, i]) => {
        const r = regel.get(v.klasse + '|' + v.stunde);
        const zusatz = v.status === 'doppeltBetreut' && v.mitKlasse ? ` mit ${n.klasse(v.mitKlasse)}` : v.status === 'aufgeteilt' ? ': ' + (v.verteilung || []).map((g) => `${g.gruppe ? 'Gruppe ' + g.gruppe + ' ' : ''}→ ${n.klasse(g.zielKlasse)} (${g.anzahl})`).join(', ') : '';
        return el('tr', {},
          el('td', { text: `${v.stunde}.` }), el('th', { scope: 'row', text: n.klasse(v.klasse) }), el('td', { text: n.fach(v.fach ?? r?.fach) }),
          el('td', { text: r ? `${n.fach(r.fach)} ${wer(r.lehrkraefte)}` : '–' }), el('td', { text: status[v.status] + zusatz }),
          el('td', { text: wer(v.lehrkraefte) }), el('td', { text: v.raum ? n.raum(v.raum) : '–' }), el('td', { text: Kern.Vertretung.GRUENDE[v.grund] || v.grund || '' }),
          ...(fuerDruck ? [] : [el('td', {}, el('button', { type: 'button', class: 'mini', 'aria-label': `Vertretung ${n.klasse(v.klasse)} ${v.stunde}. Stunde entfernen`, text: '×', onclick: () => App.aendere(`Vertretung ${n.klasse(v.klasse)} ${datum} ${v.stunde}. entfernt`, (x) => { x.plan.vertretungen.splice(i, 1); }) }))]));
      }) : [el('tr', {}, el('td', { colspan: '9', class: 'leise', text: 'Keine Vertretungen an diesem Tag.' }))]))));
    if (aufs.length) {
      teile.push(el('table', { class: 'tabelle', id: fuerDruck ? null : 'tag-aufsichten' },
        el('caption', { text: 'Aufsichtsvertretungen' }),
        el('thead', {}, el('tr', {}, ...['Pause', 'für', 'Vertretung', ...(fuerDruck ? [] : [''])].map((t) => el('th', { scope: 'col', text: t })))),
        el('tbody', {}, ...aufs.map(([a, i]) => el('tr', {},
          el('td', { text: n.pause(tag, a.vorStunde).replace(/^\S+ /, '') }), el('td', { text: n.lehrkraft(a.fuer) }),
          el('td', { class: a.status === 'unbesetzt' ? 'fehler-text' : null, text: a.status === 'unbesetzt' ? '⚠ unbesetzt' : n.lehrkraft(a.lehrkraft) }),
          ...(fuerDruck ? [] : [el('td', {}, el('button', { type: 'button', class: 'mini', 'aria-label': 'Aufsichtsvertretung entfernen', text: '×', onclick: () => App.aendere(`Aufsichtsvertretung ${datum} entfernt`, (x) => { x.plan.aufsichtsVertretungen.splice(i, 1); }) }))]))))));
    }
    if (!fuerDruck) {
      const verstoesse = Kern.Regeln.pruefeHart(d, tp, { datum });
      const offen = Kern.Vertretung.betroffen(d, datum);
      teile.push(el('div', { class: 'meldung ' + (verstoesse.length ? 'meldung-fehler' : 'meldung-ok'), id: 'tag-pruefung', role: 'status' },
        el('p', { class: 'meldung-titel', text: verstoesse.length ? `⚠ ${verstoesse.length} Konflikt(e) im Tagesplan` : '✓ Tagesplan ohne Verstöße gegen harte Regeln' }),
        offen.length ? el('p', { text: `${offen.length} betroffene Stunde(n)/Aufsicht(en) sind noch nicht vertreten.` }) : null,
        verstoesse.length ? el('ul', { class: 'pfadliste' }, ...verstoesse.slice(0, 30).map((v) => el('li', {}, el('strong', { text: v.regel }), ' ' + v.text))) : null));
    }
    const bericht = Kern.Vertretung.ausfallbericht(d, datum, datum);
    teile.push(el('h4', { text: `Ausfallbericht (${bericht.length})` }), bericht.length
      ? el('ul', { id: fuerDruck ? null : 'tag-ausfall' }, ...bericht.map((b) => el('li', { text: `${b.stunde}. Stunde ${b.klasse} ${b.fach}: ${b.status === 'aufsicht' ? 'Aufsicht statt Unterricht' : 'entfällt'} – ${b.grund}` })))
      : el('p', { class: 'leise', text: 'Kein Unterrichtsausfall.' }));
    return teile;
  }

  function renderTag() {
    panel.querySelector('#tag-inhalt').replaceChildren(...tagesInhalt(App.zustand.daten, false));
  }

  function drucke() {
    const d = App.zustand.daten;
    const el = App.el;
    document.getElementById('druckbereich').replaceChildren(el('section', { class: 'druckseite' },
      el('h2', { text: `Vertretungsplan ${Kern.Hilfen.istIsoDatum(tagesDatum) ? Kern.Hilfen.wochentag(tagesDatum) + ', ' : ''}${tagesDatum}` }),
      el('p', { class: 'leise', text: `${d.schule?.name || ''} ${d.schule?.schuljahr || ''}`.trim() }),
      ...tagesInhalt(d, true)));
    window.print();
  }

  /* ------------------------------ Render ------------------------------- */

  function render() {
    const d = App.zustand.daten;
    fuelleWer();
    renderAbwesenheiten(d);
    if (berechnet) {
      // Vorschläge passen nicht mehr zum geänderten Stand → neu berechnen
      berechne(false);
    }
    renderTag();
  }

  return { sichtbar: () => sichtbar(), baue, berechne, setzeZeitraum, vorschlaege: () => vorschlaege };
})();

/* ---- src/ui/90-app.js ---- */
/* ==========================================================================
 * Modul App (Oberfläche)
 * Seitengerüst mit Reitern (Spezifikation §7), Anwendungszustand und
 * Statuszeile. Reiter mit Inhalt registrieren sich über REITER[].modul.
 * ========================================================================== */
const App = (() => {
  'use strict';

  /** Reiter in der Reihenfolge von §7. `modul` baut den Inhalt (sonst Platzhalter). */
  const REITER = [
    { id: 'stammdaten', titel: 'Stammdaten', hinweis: 'Lehrkräfte, Fächer, Räume, Klassen und Zeitraster mit Pausen pflegen.', modul: () => StammdatenReiter },
    { id: 'zuordnung', titel: 'Zuordnung', hinweis: 'Stundentafeln sowie Haupt- und Zweitlehrkräfte je Klasse und Fach festlegen.', modul: () => ZuordnungReiter },
    { id: 'planung', titel: 'Planung', hinweis: 'Plan erstellen, Optionen einstellen, Kostenvektor verfolgen.', modul: () => PlanungReiter },
    { id: 'plan', titel: 'Plan', hinweis: 'Wochenraster je Klasse, Lehrkraft, Raum oder Aufsicht.', modul: () => PlanReiter },
    { id: 'ausfall', titel: 'Ausfall', hinweis: 'Abwesenheiten erfassen und datumsgenaue Vertretungen prüfen.', modul: () => AusfallReiter },
    { id: 'bericht', titel: 'Bericht', hinweis: 'Ausfall, Vertretungsquote, Auslastung und Aufsichten auswerten.' },
    { id: 'daten', titel: 'Daten', hinweis: 'JSON exportieren, importieren oder zurücksetzen.', modul: () => DatenReiter },
  ];

  /**
   * Anwendungszustand.
   * daten:          aktueller Datenstand (Format wie JSON-Export)
   * geaendert:      es gibt Änderungen seit dem letzten vollständigen Export/Import
   * letzterExport:  Zeitpunkt des letzten vollständigen Exports (Date oder ISO-Text)
   */
  const zustand = {
    aktiv: REITER[0].id,
    daten: Kern.Modell.leererZustand(),
    geaendert: false,
    letzterExport: null,
  };
  const beobachter = new Set();
  /** Verlauf für Rückgängig/Wiederholen: Schnappschüsse des Datenstands (§7: mindestens 50 Schritte). */
  const MAX_VERLAUF = 100;
  const verlauf = { zurueck: [], vor: [] };

  /** Kleiner Helfer zum Erzeugen von Elementen ohne innerHTML. */
  function el(tag, attribute = {}, ...kinder) {
    const knoten = document.createElement(tag);
    for (const [k, v] of Object.entries(attribute)) {
      if (v === false || v == null) continue;
      if (k === 'text') knoten.textContent = v;
      else if (k.startsWith('on')) knoten.addEventListener(k.slice(2), v);
      else knoten.setAttribute(k, v === true ? '' : v);
    }
    for (const kind of kinder) if (kind != null && kind !== '') knoten.append(kind);
    return knoten;
  }

  /* --------------------------- Zustand ---------------------------------- */

  function melde() { for (const fn of beobachter) fn(zustand); }

  /** Registriert eine Funktion, die nach jeder Zustandsänderung aufgerufen wird. */
  function beobachte(fn) { beobachter.add(fn); return () => beobachter.delete(fn); }

  /**
   * Wie beobachte, aber nur solange `panel` sichtbar ist; sonst wird beim
   * nächsten Einblenden einmal nachgezeichnet. Liefert die Funktion für `sichtbar`.
   */
  function beobachteSichtbar(panel, render) {
    let veraltet = false;
    beobachte(() => { if (panel.hidden) veraltet = true; else render(); });
    return () => { if (veraltet) { veraltet = false; render(); } };
  }

  function merke(beschreibung) {
    verlauf.zurueck.push({ beschreibung, daten: zustand.daten });
    if (verlauf.zurueck.length > MAX_VERLAUF) verlauf.zurueck.shift();
    verlauf.vor = [];
  }

  /** Ersetzt den gesamten Datenstand (Import, Zurücksetzen); rückgängig machbar. */
  function setzeDaten(neu, { geaendert = false, letzterExport = zustand.letzterExport, beschreibung = 'Daten ersetzt' } = {}) {
    merke(beschreibung);
    zustand.daten = neu;
    zustand.geaendert = geaendert;
    zustand.letzterExport = letzterExport;
    melde();
  }

  /**
   * Führt eine Bearbeitung aus: `fn` verändert eine Kopie des Datenstands.
   * Mit `pruefen` (Standard) wird die Kopie vollständig validiert; bei Fehlern
   * bleibt der Stand unverändert. `fn` kann false liefern, um abzubrechen.
   * @returns {{ok: boolean, fehler: {pfad: string, meldung: string}[]}}
   */
  function aendere(beschreibung, fn, { pruefen = true } = {}) {
    const neu = structuredClone(zustand.daten);
    if (fn(neu) === false) return { ok: false, fehler: [] };
    if (pruefen) {
      Kern.Schema.normalisiere(neu);
      const { fehler } = Kern.Schema.validiere(neu);
      if (fehler.length) return { ok: false, fehler };
    }
    merke(typeof beschreibung === 'function' ? beschreibung() : beschreibung);
    zustand.daten = neu;
    zustand.geaendert = true;
    melde();
    return { ok: true, fehler: [] };
  }

  function rueckgaengig() {
    const schritt = verlauf.zurueck.pop();
    if (!schritt) return false;
    verlauf.vor.push({ beschreibung: schritt.beschreibung, daten: zustand.daten });
    zustand.daten = schritt.daten;
    zustand.geaendert = true;
    melde();
    return true;
  }

  function wiederholen() {
    const schritt = verlauf.vor.pop();
    if (!schritt) return false;
    verlauf.zurueck.push({ beschreibung: schritt.beschreibung, daten: zustand.daten });
    zustand.daten = schritt.daten;
    zustand.geaendert = true;
    melde();
    return true;
  }

  /** Nur für Tests: markiert den Stand als geändert, ohne Inhalt zu ändern. */
  function markiereGeaendert() { zustand.geaendert = true; melde(); }

  /** Nach einem Export: Zeitpunkt merken; ein vollständiger Export sichert alle Änderungen. */
  function vermerkeExport(zeitpunkt, vollstaendig) {
    if (vollstaendig) { zustand.letzterExport = zeitpunkt; zustand.geaendert = false; }
    melde();
  }

  /* --------------------------- Reiter ----------------------------------- */

  /** Baut Reiterleiste und Panels auf (ARIA-Tabs mit Pfeiltasten-Bedienung). */
  function baueReiter(wurzel) {
    const leiste = el('div', { role: 'tablist', 'aria-label': 'Bereiche', class: 'reiterleiste' });
    const panels = el('div', { class: 'panels' });
    for (const r of REITER) {
      leiste.append(el('button', {
        type: 'button', role: 'tab', id: 'reiter-' + r.id, class: 'reiter',
        'aria-controls': 'panel-' + r.id, 'data-reiter': r.id, text: r.titel,
        onclick: () => aktiviere(r.id, true),
      }));
      const panel = el('section', {
        role: 'tabpanel', id: 'panel-' + r.id, class: 'panel', 'aria-labelledby': 'reiter-' + r.id, tabindex: '0',
      }, el('h2', { text: r.titel }), el('p', { class: 'hinweis', text: r.hinweis }));
      panels.append(panel);
      if (r.modul) r.modul().baue(panel);
      else panel.append(el('p', { class: 'platzhalter', text: 'Dieser Bereich wird in einem späteren Meilenstein umgesetzt.' }));
    }
    leiste.addEventListener('keydown', (e) => {
      const i = REITER.findIndex((r) => r.id === zustand.aktiv);
      let ziel = null;
      if (e.key === 'ArrowRight') ziel = (i + 1) % REITER.length;
      else if (e.key === 'ArrowLeft') ziel = (i - 1 + REITER.length) % REITER.length;
      else if (e.key === 'Home') ziel = 0;
      else if (e.key === 'End') ziel = REITER.length - 1;
      if (ziel === null) return;
      e.preventDefault();
      aktiviere(REITER[ziel].id, true);
    });
    wurzel.append(leiste, panels);
  }

  /** Schaltet auf einen Reiter um; optional mit Fokus auf den Reiterknopf. */
  function aktiviere(id, fokus = false) {
    zustand.aktiv = id;
    for (const r of REITER) {
      const knopf = document.getElementById('reiter-' + r.id);
      const panel = document.getElementById('panel-' + r.id);
      const an = r.id === id;
      knopf.setAttribute('aria-selected', String(an));
      knopf.tabIndex = an ? 0 : -1;
      panel.hidden = !an;
      if (an) r.modul?.().sichtbar?.();
      if (an && fokus) knopf.focus();
    }
  }

  /* --------------------------- Statuszeile ------------------------------ */

  function setzeStatus(text, art = 'info') {
    const s = document.getElementById('status-rechenkern');
    s.textContent = text;
    s.dataset.art = art;
  }

  function zeigeSpeicherstand() {
    const s = document.getElementById('status-speicher');
    s.textContent = zustand.geaendert ? '⚠ Ungespeicherte Änderungen' : '';
    const z = document.getElementById('knopf-rueckgaengig');
    const v = document.getElementById('knopf-wiederholen');
    const oben = (liste) => liste[liste.length - 1];
    z.disabled = !verlauf.zurueck.length;
    v.disabled = !verlauf.vor.length;
    z.title = verlauf.zurueck.length ? `Rückgängig: ${oben(verlauf.zurueck).beschreibung} (Strg+Z)` : 'Nichts rückgängig zu machen';
    v.title = verlauf.vor.length ? `Wiederholen: ${oben(verlauf.vor).beschreibung} (Strg+Y)` : 'Nichts zu wiederholen';
  }

  /** Strg+Z / Strg+Y (bzw. Strg+Umschalt+Z) außerhalb von Eingabefeldern. */
  function tastenkuerzel(e) {
    if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
    const ziel = e.target;
    if (ziel && (ziel.tagName === 'INPUT' || ziel.tagName === 'TEXTAREA' || ziel.tagName === 'SELECT' || ziel.isContentEditable)) return;
    if (document.querySelector('dialog[open]')) return;
    const taste = e.key.toLowerCase();
    if (taste === 'z' && !e.shiftKey) { e.preventDefault(); rueckgaengig(); } else if (taste === 'y' || (taste === 'z' && e.shiftKey)) { e.preventDefault(); wiederholen(); }
  }

  function start() {
    const wurzel = document.getElementById('app');
    baueReiter(wurzel);
    aktiviere(zustand.aktiv);
    document.getElementById('version').textContent = 'Version ' + Kern.version;
    document.getElementById('knopf-rueckgaengig').addEventListener('click', rueckgaengig);
    document.getElementById('knopf-wiederholen').addEventListener('click', wiederholen);
    document.addEventListener('keydown', tastenkuerzel);
    beobachte(zeigeSpeicherstand);
    zeigeSpeicherstand();
    // Warnung beim Schließen des Tabs, solange es ungespeicherte Änderungen gibt (§8).
    window.addEventListener('beforeunload', (e) => {
      if (!zustand.geaendert) return;
      e.preventDefault();
      e.returnValue = '';
    });
    setzeStatus('Rechenkern wird gestartet …');
    Rechenkern.anfrage('ping')
      .then((a) => setzeStatus('Rechenkern bereit (' + a.version + ')', 'ok'))
      .catch((e) => setzeStatus('Rechenkern nicht verfügbar: ' + e.message, 'fehler'));
  }

  return {
    REITER, zustand, verlauf, el, start, aktiviere, beobachte, beobachteSichtbar, setzeDaten, aendere, rueckgaengig, wiederholen,
    markiereGeaendert, vermerkeExport,
  };
})();

// Zugriff für Tests und Fehlersuche in der Konsole.
window.Stundenplan = { Kern, App, Rechenkern, DatenReiter, PlanungReiter, StammdatenReiter, ZuordnungReiter, PlanReiter, AusfallReiter };
document.addEventListener('DOMContentLoaded', App.start);
