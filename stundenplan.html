<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Datenschutz (§9): keine Netzwerkzugriffe, nur eingebettete Skripte und Blob-Worker -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; worker-src blob:; child-src blob:; img-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>Stundenplanplanung</title>
<style>
/* ==========================================================================
 * Gestaltung
 * Farben als Variablen; Kontrast nach WCAG AA; sichtbarer Fokus;
 * Druckansicht über @media print (Spezifikation §7, §9).
 * ========================================================================== */
:root {
  --hintergrund: #f6f7f9;
  --flaeche: #ffffff;
  --text: #1a1d23;
  --text-leise: #4a5160;   /* 7,9:1 auf Weiß */
  --linie: #c9ced8;
  --akzent: #1f5fbf;       /* 6,0:1 auf Weiß */
  --akzent-text: #ffffff;
  --ok: #1d6b35;
  --fehler: #b3261e;
  --fokus: #f2a900;
  --warnung: #8a5300;     /* 6,1:1 auf Weiß */
  --linie-kraeftig: #8a92a3;
  --radius: 6px;
  --abstand: 16px;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 15px;
  line-height: 1.45;
  color: var(--text);
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--hintergrund); color: var(--text); min-width: 1280px; }

.kopf {
  display: flex; align-items: baseline; gap: var(--abstand);
  padding: 12px var(--abstand); background: var(--flaeche); border-bottom: 1px solid var(--linie);
}
.kopf h1 { font-size: 1.25rem; margin: 0; }
.kopf .leise { color: var(--text-leise); font-size: .9rem; }

#app { padding: 0 var(--abstand) var(--abstand); }

.reiterleiste { display: flex; gap: 4px; border-bottom: 1px solid var(--linie); margin-top: 12px; }
.reiter {
  font: inherit; padding: 8px 16px; border: 1px solid transparent; border-bottom: none;
  border-radius: var(--radius) var(--radius) 0 0; background: transparent; color: var(--text); cursor: pointer;
}
.reiter:hover { background: #e8ebf0; }
.reiter[aria-selected="true"] {
  background: var(--flaeche); border-color: var(--linie); margin-bottom: -1px; font-weight: 600;
  box-shadow: inset 0 3px 0 var(--akzent);
}

.panel {
  background: var(--flaeche); border: 1px solid var(--linie); border-top: none;
  border-radius: 0 0 var(--radius) var(--radius); padding: var(--abstand); min-height: 60vh;
}
.panel h2 { margin-top: 0; font-size: 1.15rem; }
.hinweis { color: var(--text-leise); }
.platzhalter { font-style: italic; color: var(--text-leise); }

.fuss {
  display: flex; justify-content: space-between; padding: 8px var(--abstand);
  color: var(--text-leise); font-size: .9rem;
}
#status-rechenkern[data-art="ok"]::before { content: "✓ "; color: var(--ok); }
#status-rechenkern[data-art="fehler"] { color: var(--fehler); }
#status-rechenkern[data-art="fehler"]::before { content: "⚠ "; }

/* ---------------------------- Bausteine ---------------------------------- */
.versteckt { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.abschnitt { margin-bottom: 24px; max-width: 960px; }
.abschnitt h3 { font-size: 1rem; margin: 0 0 8px; }
.knopfleiste { display: flex; flex-wrap: wrap; gap: 8px; }

.knopf {
  font: inherit; padding: 6px 14px; border-radius: var(--radius); cursor: pointer;
  border: 1px solid var(--linie-kraeftig); background: var(--flaeche); color: var(--text);
}
.knopf:hover { background: #eef1f6; }
.knopf-primaer { background: var(--akzent); border-color: var(--akzent); color: var(--akzent-text); }
.knopf-primaer:hover { background: #184f9f; }
.knopf-gefahr { border-color: var(--fehler); color: var(--fehler); }
.knopf-gefahr:hover { background: #fbeceb; }

.uebersicht { display: grid; grid-template-columns: max-content 1fr; gap: 2px 16px; margin: 0 0 8px; }
.uebersicht dt { color: var(--text-leise); }
.uebersicht dd { margin: 0; font-variant-numeric: tabular-nums; }
.warnung-text { color: var(--warnung); font-weight: 600; }
.fehler-text { color: var(--fehler); font-weight: 600; }

.ablage {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  border: 2px dashed var(--linie-kraeftig); border-radius: var(--radius); padding: 16px; background: var(--hintergrund);
}
.ablage p { margin: 0; }
body.ablage-aktiv::after {
  content: "Datei hier ablegen, um sie zu importieren"; position: fixed; inset: 12px; z-index: 50;
  display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: 600;
  border: 4px dashed var(--akzent); border-radius: 12px; background: rgba(255, 255, 255, .92); color: var(--akzent);
  pointer-events: none;
}

.meldungen { margin-top: 12px; }
.meldung { border: 1px solid var(--linie); border-left-width: 6px; border-radius: var(--radius); padding: 8px 12px; background: var(--flaeche); }
.meldung p { margin: 4px 0; }
.meldung-titel { font-weight: 600; }
.meldung-ok { border-left-color: var(--ok); }
.meldung-info { border-left-color: var(--akzent); }
.meldung-warnung { border-left-color: var(--warnung); }
.meldung-fehler { border-left-color: var(--fehler); }
.meldung-fehler .meldung-titel { color: var(--fehler); }
.pfadliste { margin: 4px 0; padding-left: 20px; max-height: 320px; overflow: auto; }
.pfadliste code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .9em; background: #eef1f6; padding: 0 4px; border-radius: 3px; }

.dialog { border: 1px solid var(--linie); border-radius: 8px; padding: 20px 24px; max-width: 520px; color: var(--text); }
.dialog::backdrop { background: rgba(20, 24, 32, .45); }
.dialog h2 { margin: 0 0 8px; font-size: 1.1rem; }
.dialog-knoepfe { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; flex-wrap: wrap; }

/* ----------------------------- Formulare ---------------------------------- */
.formular { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px 20px; margin-bottom: 12px; }
.feld { display: flex; flex-direction: column; gap: 4px; }
.feld > span:first-child { color: var(--text-leise); font-size: .9rem; }
.feld input[type=number] { font: inherit; padding: 4px 8px; border: 1px solid var(--linie-kraeftig); border-radius: var(--radius); max-width: 200px; }
.feld input[aria-invalid=true] { border-color: var(--fehler); border-width: 2px; }
.feld-fehler { color: var(--fehler); font-size: .85rem; }
.feld-haken { flex-direction: row; align-items: center; gap: 8px; grid-column: 1 / -1; }
.feld-haken > span:first-child { color: var(--text); font-size: 1rem; }
.gewichte summary, details summary { cursor: pointer; color: var(--akzent); margin: 8px 0; }
.formular-gewichte { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }

.fortschritt { margin-top: 12px; }
.fortschritt progress { width: 100%; max-width: 640px; height: 14px; }
.leise { color: var(--text-leise); font-size: .9rem; }

.tabelle { border-collapse: collapse; margin: 8px 0 12px; min-width: 480px; }
.tabelle caption { text-align: left; color: var(--text-leise); font-size: .9rem; padding-bottom: 4px; }
.tabelle th, .tabelle td { border-bottom: 1px solid var(--linie); padding: 4px 12px 4px 0; text-align: left; vertical-align: top; }
.tabelle thead th { font-weight: 600; border-bottom-color: var(--linie-kraeftig); }
.tabelle .zahl { text-align: right; font-variant-numeric: tabular-nums; }

/* Fokus immer sichtbar, unabhängig von Farbe des Elements */
:focus-visible { outline: 3px solid var(--fokus); outline-offset: 2px; }

@media print {
  body { background: #fff; min-width: 0; }
  .kopf, .reiterleiste, .fuss, .dialog { display: none; }
  .panel { border: none; padding: 0; min-height: 0; }
  .panel[hidden] { display: none; }
}
</style>
</head>
<body>
<header class="kopf">
  <h1>Stundenplanplanung</h1>
  <span class="leise">Läuft lokal im Browser – Daten verlassen den Rechner nur über den Export.</span>
</header>
<main id="app"></main>
<footer class="fuss">
  <span id="status-rechenkern" role="status" aria-live="polite"></span>
  <span id="status-speicher" class="warnung-text" aria-live="polite"></span>
  <span id="version"></span>
</footer>
<!-- Modul-Kern: Datenmodell, Validierung, Planer, Vertretung, Import/Export (läuft auch im Worker) -->
<script id="kern">
/* ---- src/kern/00-hilfen.js ---- */
/* ==========================================================================
 * Modul Hilfen
 * Allgemeine, zustandslose Hilfsfunktionen für Kern, Worker und Oberfläche:
 * deterministischer Zufall, ID-Vergabe, Kopieren, Datumsrechnung.
 * Läuft ohne DOM (Hauptthread, Web Worker, Node).
 * ========================================================================== */
const Hilfen = (() => {
  'use strict';

  /**
   * Deterministischer Zufallsgenerator (mulberry32).
   * Gleicher Startwert ⇒ gleiche Folge, auf allen Plattformen.
   * @param {number} startwert ganze Zahl
   */
  function erzeugeZufall(startwert) {
    let a = (Number(startwert) >>> 0) || 0x9e3779b9;
    /** Gleichverteilt in [0, 1). */
    function naechste() {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
    /** Ganze Zahl in [von, bis] (beide eingeschlossen). */
    function ganzzahl(von, bis) {
      return von + Math.floor(naechste() * (bis - von + 1));
    }
    /** Zufälliges Element eines nicht leeren Arrays. */
    function auswahl(liste) {
      return liste[Math.floor(naechste() * liste.length)];
    }
    /** Mischt eine Kopie des Arrays (Fisher-Yates). */
    function gemischt(liste) {
      const k = liste.slice();
      for (let i = k.length - 1; i > 0; i--) {
        const j = Math.floor(naechste() * (i + 1));
        [k[i], k[j]] = [k[j], k[i]];
      }
      return k;
    }
    /** Interner Zustand, um einen Lauf exakt fortsetzen zu können. */
    function zustand() { return a; }
    return { naechste, ganzzahl, auswahl, gemischt, zustand };
  }

  /**
   * Vergibt eine neue, stabile ID mit Präfix (z. B. „l-“), die in `vorhandene`
   * noch nicht vorkommt. Aus einem lesbaren Stamm (Kürzel) wird zuerst
   * `präfix-stamm` versucht, sonst wird ein Zähler angehängt.
   * @param {string} praefix z. B. "l", "k", "r", "f"
   * @param {Set<string>|string[]} vorhandene bereits vergebene IDs
   * @param {string} [stamm] lesbarer Teil, z. B. Kürzel
   */
  function neueId(praefix, vorhandene, stamm) {
    const belegt = vorhandene instanceof Set ? vorhandene : new Set(vorhandene || []);
    const basis = praefix + '-' + (normalisiereStamm(stamm) || 'x');
    if (stamm && !belegt.has(basis)) return basis;
    for (let n = 1; ; n++) {
      const kandidat = basis + n;
      if (!belegt.has(kandidat)) return kandidat;
    }
  }

  /** Macht aus einem Kürzel einen ID-tauglichen Stamm (ohne Umlaute, klein). */
  function normalisiereStamm(text) {
    if (!text) return '';
    return String(text)
      .toLowerCase()
      .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9]+/g, '')
      .slice(0, 16);
  }

  /** Tiefe Kopie reiner JSON-Daten. */
  function tiefeKopie(wert) {
    return wert === undefined ? undefined : JSON.parse(JSON.stringify(wert));
  }

  /* ---------------------------- Datum ---------------------------------- */

  /** Wochentagskürzel in der Reihenfolge von Date.getUTCDay() (0 = Sonntag). */
  const WOCHENTAGE = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];

  /** Prüft „JJJJ-MM-TT“ auf Form und Gültigkeit (kein 31.02.). */
  function istIsoDatum(text) {
    if (typeof text !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(text)) return false;
    const d = new Date(text + 'T00:00:00Z');
    return !Number.isNaN(d.getTime()) && d.toISOString().slice(0, 10) === text;
  }

  /** Datum (ISO) → Wochentagskürzel („Mo“ … „So“). Rechnet in UTC, ohne Zeitzonenfehler. */
  function wochentag(isoDatum) {
    if (!istIsoDatum(isoDatum)) throw new Error('Ungültiges Datum: ' + isoDatum);
    return WOCHENTAGE[new Date(isoDatum + 'T00:00:00Z').getUTCDay()];
  }

  /** ISO-Datum um n Tage verschieben. */
  function plusTage(isoDatum, n) {
    const d = new Date(isoDatum + 'T00:00:00Z');
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  }

  /**
   * Alle Daten im Zeitraum [von, bis], deren Wochentag in `tage` liegt
   * (z. B. ["Mo","Di","Mi","Do","Fr"]). Grundlage der datumsgenauen Vertretung.
   */
  function unterrichtstage(von, bis, tage) {
    if (!istIsoDatum(von) || !istIsoDatum(bis)) throw new Error('Ungültiger Zeitraum');
    const erlaubt = new Set(tage);
    const ergebnis = [];
    for (let d = von; d <= bis; d = plusTage(d, 1)) {
      if (erlaubt.has(wochentag(d))) ergebnis.push(d);
    }
    return ergebnis;
  }

  /** Montag der Kalenderwoche eines Datums (ISO). */
  function wochenbeginn(isoDatum) {
    const tag = new Date(isoDatum + 'T00:00:00Z').getUTCDay();
    return plusTage(isoDatum, -((tag + 6) % 7));
  }

  /** Lokales Datum als „JJJJ-MM-TT“ (für Dateinamen). */
  function heuteIso(jetzt = new Date()) {
    const z = (n) => String(n).padStart(2, '0');
    return jetzt.getFullYear() + '-' + z(jetzt.getMonth() + 1) + '-' + z(jetzt.getDate());
  }

  /** Zeitpunkt als ISO-Text in lokaler Zeit mit Zeitzonenversatz, z. B. 2026-11-25T16:59:00+01:00 (§8 exportedAt). */
  function isoMitZeitzone(jetzt = new Date()) {
    const z = (n) => String(Math.abs(n)).padStart(2, '0');
    const versatz = -jetzt.getTimezoneOffset();
    return heuteIso(jetzt) + 'T' + z(jetzt.getHours()) + ':' + z(jetzt.getMinutes()) + ':' + z(jetzt.getSeconds())
      + (versatz >= 0 ? '+' : '-') + z(Math.trunc(versatz / 60)) + ':' + z(versatz % 60);
  }

  /** Dateiname für den Export: stundenplan-JJJJ-MM-TT.json (§8). */
  function exportDateiname(jetzt = new Date(), zusatz = '') {
    return 'stundenplan-' + (zusatz ? zusatz + '-' : '') + heuteIso(jetzt) + '.json';
  }

  return {
    erzeugeZufall, neueId, normalisiereStamm, tiefeKopie,
    WOCHENTAGE, istIsoDatum, wochentag, plusTage, unterrichtstage, wochenbeginn,
    heuteIso, isoMitZeitzone, exportDateiname,
  };
})();

/* ---- src/kern/10-modell.js ---- */
/* ==========================================================================
 * Modul Modell
 * Konstanten, Standardwerte und Fabriken für den Anwendungszustand.
 * Der Zustand entspricht dem JSON-Austauschformat (Spezifikation §8).
 * ========================================================================== */
const Modell = (() => {
  'use strict';

  /** Aktuelle Version des JSON-Schemas. */
  const SCHEMA_VERSION = 1;

  /** Statuswerte einer Unterrichtsstunde im JSON (ohne Umlaute, §8). */
  const STATUS = Object.freeze({
    REGULAER: 'regulaer',
    VERTRETEN: 'vertreten',
    DOPPELT_BETREUT: 'doppeltBetreut',
    AUFGETEILT: 'aufgeteilt',
    ENTFAELLT: 'entfaellt',
    AUFSICHT: 'aufsicht',
  });

  /** Raumtypen (§2). Fachräume tragen zusätzlich einen `fachraumtyp`. */
  const RAUMTYPEN = Object.freeze(['klassenraum', 'fachraum', 'turnhalle', 'schwimmhalle']);

  /** Raumtypen, die ein Fach direkt (ohne Fachraumtyp) verlangen kann. */
  const SONDERRAUMTYPEN = Object.freeze(['turnhalle', 'schwimmhalle']);

  /** Wochentage, die das Zeitraster enthalten darf (§2: Mo–Fr). */
  const TAGE = Object.freeze(['Mo', 'Di', 'Mi', 'Do', 'Fr']);

  /** Rollen einer Zuordnung (§2). */
  const ROLLEN = Object.freeze(['haupt', 'zweit']);

  /** Voreingestellte Gewichte der weichen Regeln W1–W12 (§4). */
  const STANDARD_GEWICHTE = Object.freeze({
    W1: 10, W2: 5, W3: 8, W4: 3, W5: 4, W6: 2, W7: 2, W8: 6, W9: 4, W10: 3, W11: 5, W12: 3,
  });

  /** Standardeinstellungen (§8 „einstellungen“ und Annahmen des Implementierungsplans). */
  function standardEinstellungen() {
    return {
      gewichte: { ...STANDARD_GEWICHTE },
      maxDoppelbetreuungProTag: 1,
      maxDoppelbetreuungStundenAmStueck: 2,
      gewichtAufteilung: 3,
      zweitbesetzungErlaubt: true,
      maxLehrkraefteProKlasseUndSlot: 2,
      vertretungsreserveProzent: 10,
      zeitbudgetSekunden: 30,
      zufallsStartwert: 42,
    };
  }

  /**
   * Standardpausen: vor der 1. Stunde (Frühaufsicht) und danach vor jeder
   * zweiten Stunde (3., 5., 7., …), je mit `aufsichten` erforderlichen Aufsichten.
   * @param {number} stundenProTag 1–10
   * @param {number|number[]} aufsichten Anzahl je Pause (Zahl oder Liste je Pause)
   */
  function standardPausen(stundenProTag, aufsichten = 2) {
    const pausen = [];
    let nr = 0;
    for (let vor = 1; vor <= stundenProTag; vor += 2) {
      const anzahl = Array.isArray(aufsichten) ? (aufsichten[nr] ?? aufsichten[aufsichten.length - 1]) : aufsichten;
      pausen.push({
        vorStunde: vor,
        name: vor === 1 ? 'Frühaufsicht' : (nr + '. Pause'),
        aufsichten: anzahl,
      });
      nr++;
    }
    return pausen;
  }

  /**
   * Standard-Zeitraster: Mo–Fr, Stunden zu 45 Minuten ab 08:00.
   * Nach jeder zweiten Stunde eine 20-minütige Pause, sonst 5 Minuten Wechsel.
   */
  function standardZeitraster(stundenProTag = 6) {
    const stunden = [];
    let minuten = 8 * 60;
    const fmt = (m) => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
    for (let nr = 1; nr <= stundenProTag; nr++) {
      if (nr > 1) minuten += (nr % 2 === 1) ? 20 : 5;
      stunden.push({ nr, von: fmt(minuten), bis: fmt(minuten + 45) });
      minuten += 45;
    }
    const doppelstundenStart = [];
    for (let nr = 1; nr < stundenProTag; nr += 2) doppelstundenStart.push(nr);
    return {
      tage: ['Mo', 'Di', 'Mi', 'Do', 'Fr'],
      stunden,
      doppelstundenStart,
      pausen: standardPausen(stundenProTag, 2),
    };
  }

  /** Leerer, gültiger Anwendungszustand. */
  function leererZustand() {
    return {
      schemaVersion: SCHEMA_VERSION,
      schule: { name: '', schuljahr: '' },
      zeitraster: standardZeitraster(6),
      faecher: [],
      lehrkraefte: [],
      raeume: [],
      klassen: [],
      zuordnungen: [],
      einstellungen: standardEinstellungen(),
      plan: { regelplan: [], aufsichten: [], vertretungen: [], aufsichtsVertretungen: [] },
    };
  }

  /** true, wenn keine Stammdaten und kein Plan vorhanden sind (dann ist Überschreiben unkritisch). */
  function istLeer(zustand) {
    const p = zustand.plan || {};
    return ['faecher', 'lehrkraefte', 'raeume', 'klassen', 'zuordnungen'].every((k) => !(zustand[k] || []).length)
      && ['regelplan', 'aufsichten', 'vertretungen', 'aufsichtsVertretungen'].every((k) => !(p[k] || []).length);
  }

  /** Vertretungsreserve einer Lehrkraft in Stunden (aufgerundet, Annahme 11). */
  function vertretungsreserve(sollStunden, prozent) {
    const stunden = Math.ceil((sollStunden * prozent) / 100 - 1e-9);
    return stunden > 0 ? stunden : 0; // nie -0 oder negativ
  }

  return {
    SCHEMA_VERSION, STATUS, RAUMTYPEN, SONDERRAUMTYPEN, TAGE, ROLLEN, STANDARD_GEWICHTE,
    standardEinstellungen, standardPausen, standardZeitraster, leererZustand, istLeer, vertretungsreserve,
  };
})();

/* ---- src/kern/20-schema.js ---- */
/* ==========================================================================
 * Modul Schema
 * Deklarative Beschreibung des JSON-Formats (Spezifikation §8) und darauf
 * aufbauend:
 *   - normalisiere(): fehlende optionale Felder mit Standardwerten ergänzen
 *   - validiere():    Typen, Pflichtfelder, Bereiche, Referenzen, Eindeutigkeit
 *                     und fachliche Querprüfungen; Fehler mit Pfadangabe
 *   - ordne():        kanonische Feldreihenfolge (bekannte Felder in
 *                     Schemareihenfolge, unbekannte Felder unverändert dahinter)
 *   - migriere():     ältere schemaVersion stufenweise hochziehen
 * Unbekannte Zusatzfelder werden nie entfernt oder bemängelt.
 * ========================================================================== */
const Schema = (() => {
  'use strict';

  /* ------------------------- Bausteine (Typen) --------------------------- */
  // Jeder Baustein ist ein einfaches Objekt { art, ...optionen }.
  // Gemeinsame Optionen: pflicht (Feld muss vorhanden sein), nullbar (null erlaubt),
  // standard (Wert oder Funktion(elternobjekt) für fehlende Felder), name (für Meldungen).
  const T = {
    text: (o = {}) => ({ art: 'text', ...o }),
    zahl: (o = {}) => ({ art: 'zahl', ...o }),
    ganz: (o = {}) => ({ art: 'zahl', ganz: true, ...o }),
    bool: (o = {}) => ({ art: 'bool', ...o }),
    wahl: (werte, o = {}) => ({ art: 'wahl', werte, ...o }),
    liste: (element, o = {}) => ({ art: 'liste', element, ...o }),
    objekt: (felder, o = {}) => ({ art: 'objekt', felder, ...o }),
    ref: (ziel, o = {}) => ({ art: 'ref', ziel, ...o }),
    datum: (o = {}) => ({ art: 'datum', ...o }),
    uhrzeit: (o = {}) => ({ art: 'uhrzeit', ...o }),
    tag: (o = {}) => ({ art: 'tag', ...o }),
    stunde: (o = {}) => ({ art: 'stunde', ...o }),
    pause: (o = {}) => ({ art: 'pause', ...o }),
  };
  const P = { pflicht: true };

  /** Lesbare Namen der referenzierbaren Sammlungen. */
  const SAMMLUNGEN = { faecher: 'Fach', lehrkraefte: 'Lehrkraft', raeume: 'Raum', klassen: 'Klasse' };

  /* ---------------------------- Schema ----------------------------------- */

  const SPERRE = T.objekt({
    tag: T.tag(P),
    stunden: T.liste(T.stunde(), { ...P, min: 1, eindeutig: true }),
  });
  const ABWESENHEIT = T.objekt({
    von: T.datum(P),
    bis: T.datum(P),
    grund: T.text({ standard: '' }),
  });

  const FACH = T.objekt({
    id: T.text({ ...P, nichtLeer: true }),
    name: T.text({ ...P, nichtLeer: true }),
    kuerzel: T.text({ ...P, nichtLeer: true, max: 12 }),
    raumtyp: T.text({ nullbar: true, nichtLeer: true, standard: null }),
    blockbar: T.bool({ standard: true }),
    hauptfach: T.bool({ standard: false }),
  });

  const LEHRKRAFT = T.objekt({
    id: T.text({ ...P, nichtLeer: true }),
    name: T.text({ ...P, nichtLeer: true }),
    kuerzel: T.text({ ...P, nichtLeer: true, max: 12 }),
    qualifikationen: T.liste(T.objekt({
      fach: T.ref('faecher', P),
      stufenVon: T.ganz({ ...P, min: 1, max: 13 }),
      stufenBis: T.ganz({ ...P, min: 1, max: 13 }),
    }), { standard: () => [] }),
    sollStunden: T.zahl({ ...P, min: 0, max: 40 }),
    minStunden: T.zahl({ min: 0, max: 40, standard: (l) => (typeof l.sollStunden === 'number' ? l.sollStunden : 0) }),
    maxStunden: T.zahl({ min: 0, max: 40, standard: (l) => (typeof l.sollStunden === 'number' ? l.sollStunden : 0) }),
    teilzeitfaktor: T.zahl({ min: 0, max: 1 }),
    aufsichtenProWoche: T.ganz({ min: 0, max: 50, standard: 0 }),
    gesperrt: T.liste(SPERRE, { standard: () => [] }),
    abwesenheiten: T.liste(ABWESENHEIT, { standard: () => [] }),
  });

  const RAUM = T.objekt({
    id: T.text({ ...P, nichtLeer: true }),
    name: T.text({ ...P, nichtLeer: true }),
    typ: T.wahl(['klassenraum', 'fachraum', 'turnhalle', 'schwimmhalle'], P),
    fachraumtyp: T.text({ nichtLeer: true }),
    kapazitaet: T.ganz({ ...P, min: 1, max: 500 }),
    nahe: T.liste(T.ref('raeume'), { standard: () => [], eindeutig: true }),
    gesperrt: T.liste(SPERRE, { standard: () => [] }),
    abwesenheiten: T.liste(ABWESENHEIT, { standard: () => [] }),
  });

  const KLASSE = T.objekt({
    id: T.text({ ...P, nichtLeer: true }),
    name: T.text({ ...P, nichtLeer: true }),
    stufe: T.ganz({ ...P, min: 1, max: 13 }),
    schueler: T.ganz({ ...P, min: 1, max: 60 }),
    klassenlehrkraft: T.ref('lehrkraefte', { nullbar: true, standard: null }),
    heimatraum: T.ref('raeume', { nullbar: true, standard: null }),
    stundentafel: T.liste(T.objekt({
      fach: T.ref('faecher', P),
      stunden: T.ganz({ ...P, min: 1, max: 20 }),
      doppelt: T.bool({ standard: false }),
    }), { standard: () => [] }),
  });

  const ZUORDNUNG = T.objekt({
    klasse: T.ref('klassen', P),
    fach: T.ref('faecher', P),
    lehrkraft: T.ref('lehrkraefte', P),
    rolle: T.wahl(['haupt', 'zweit'], P),
    zweck: T.text(),
  });

  const ZEITRASTER = T.objekt({
    tage: T.liste(T.wahl(['Mo', 'Di', 'Mi', 'Do', 'Fr']), { ...P, min: 1, max: 5, eindeutig: true }),
    stunden: T.liste(T.objekt({
      nr: T.ganz({ ...P, min: 1, max: 10 }),
      von: T.uhrzeit(P),
      bis: T.uhrzeit(P),
    }), { ...P, min: 1, max: 10 }),
    doppelstundenStart: T.liste(T.stunde(), { standard: () => [], eindeutig: true }),
    pausen: T.liste(T.objekt({
      vorStunde: T.stunde(P),
      name: T.text({ standard: '' }),
      aufsichten: T.ganz({ min: 0, max: 50, standard: 0 }),
    }), { standard: () => [] }),
  });

  const EINSTELLUNGEN = T.objekt({
    gewichte: T.objekt(Object.fromEntries(Object.entries(Modell.STANDARD_GEWICHTE)
      .map(([k, v]) => [k, T.zahl({ min: 0, max: 1000, standard: v })])), { standard: () => ({}) }),
    maxDoppelbetreuungProTag: T.ganz({ min: 0, max: 10, standard: 1 }),
    maxDoppelbetreuungStundenAmStueck: T.ganz({ min: 1, max: 10, standard: 2 }),
    gewichtAufteilung: T.zahl({ min: 1, minExklusiv: true, max: 100, standard: 3 }),
    zweitbesetzungErlaubt: T.bool({ standard: true }),
    maxLehrkraefteProKlasseUndSlot: T.ganz({ min: 1, max: 4, standard: 2 }),
    vertretungsreserveProzent: T.zahl({ min: 0, max: 50, standard: 10 }),
    zeitbudgetSekunden: T.zahl({ min: 1, max: 600, standard: 30 }),
    zufallsStartwert: T.ganz({ min: 0, max: 4294967295, standard: 42 }),
  }, { standard: () => ({}) });

  const LEHRKRAEFTE_LISTE = T.liste(T.ref('lehrkraefte'), { standard: () => [], maxEinstellung: true });
  const STATUS = ['regulaer', 'vertreten', 'doppeltBetreut', 'aufgeteilt', 'entfaellt', 'aufsicht'];

  const STUNDE = T.objekt({
    klasse: T.ref('klassen', P),
    fach: T.ref('faecher', { nullbar: true, standard: null }),
    lehrkraefte: LEHRKRAEFTE_LISTE,
    raum: T.ref('raeume', { nullbar: true, standard: null }),
    tag: T.tag(P),
    stunde: T.stunde(P),
    status: T.wahl(STATUS, P),
  });

  const VERTRETUNG = T.objekt({
    datum: T.datum(P),
    klasse: T.ref('klassen', P),
    fach: T.ref('faecher', { nullbar: true }),
    stunde: T.stunde(P),
    status: T.wahl(STATUS, P),
    lehrkraefte: LEHRKRAEFTE_LISTE,
    raum: T.ref('raeume', { nullbar: true, standard: null }),
    mitKlasse: T.ref('klassen'),
    verteilung: T.liste(T.objekt({
      zielKlasse: T.ref('klassen', P),
      anzahl: T.ganz({ ...P, min: 1, max: 60 }),
      gruppe: T.text(),
    })),
    grund: T.text(),
  });

  const AUFSICHT = T.objekt({
    tag: T.tag(P),
    vorStunde: T.pause(P),
    lehrkraft: T.ref('lehrkraefte', P),
  });

  const AUFSICHTSVERTRETUNG = T.objekt({
    datum: T.datum(P),
    vorStunde: T.pause(P),
    fuer: T.ref('lehrkraefte', P),
    lehrkraft: T.ref('lehrkraefte', { nullbar: true, standard: null }),
    status: T.wahl(['vertreten', 'unbesetzt'], P),
  });

  const PLAN = T.objekt({
    regelplan: T.liste(STUNDE, { standard: () => [] }),
    aufsichten: T.liste(AUFSICHT, { standard: () => [] }),
    vertretungen: T.liste(VERTRETUNG, { standard: () => [] }),
    aufsichtsVertretungen: T.liste(AUFSICHTSVERTRETUNG, { standard: () => [] }),
  }, { standard: () => ({}) });

  /** Gesamtzustand (vollständiger Export). */
  const ZUSTAND = T.objekt({
    schemaVersion: T.ganz({ ...P, min: 1 }),
    exportedAt: T.text(),
    teil: T.wahl(['stammdaten', 'plan']),
    schule: T.objekt({ name: T.text({ standard: '' }), schuljahr: T.text({ standard: '' }) }, { standard: () => ({}) }),
    zeitraster: { ...ZEITRASTER, pflicht: true },
    faecher: T.liste(FACH, { standard: () => [] }),
    lehrkraefte: T.liste(LEHRKRAFT, { standard: () => [] }),
    raeume: T.liste(RAUM, { standard: () => [] }),
    klassen: T.liste(KLASSE, { standard: () => [] }),
    zuordnungen: T.liste(ZUORDNUNG, { standard: () => [] }),
    einstellungen: EINSTELLUNGEN,
    plan: PLAN,
  });

  /** Bereiche, die beim Teil-Export „stammdaten“ bzw. „plan“ enthalten sind. */
  const TEILE = {
    stammdaten: ['schule', 'zeitraster', 'faecher', 'lehrkraefte', 'raeume', 'klassen', 'zuordnungen', 'einstellungen'],
    plan: ['plan'],
  };

  /* ------------------------- Hilfsfunktionen ----------------------------- */

  const istObjekt = (w) => w !== null && typeof w === 'object' && !Array.isArray(w);
  const pfadFeld = (pfad, name) => (pfad ? pfad + '.' + name : name);
  const pfadIndex = (pfad, i) => pfad + '[' + i + ']';

  /** Kurze, lesbare Darstellung eines Werts für Fehlermeldungen. */
  function zeige(wert) {
    if (typeof wert === 'string') return '„' + (wert.length > 40 ? wert.slice(0, 40) + '…' : wert) + '“';
    if (Array.isArray(wert)) return 'Liste';
    if (istObjekt(wert)) return 'Objekt';
    return String(wert);
  }
  function typname(wert) {
    if (wert === null) return 'null';
    if (Array.isArray(wert)) return 'Liste';
    return { string: 'Text', number: 'Zahl', boolean: 'Wahrheitswert', object: 'Objekt' }[typeof wert] || typeof wert;
  }

  const MAX_FEHLER = 500;

  /** Sammelt Fehler und Warnungen samt Prüfkontext. */
  function neuerKontext(daten) {
    const kx = { fehler: [], warnungen: [], uebersprungen: 0 };
    kx.ids = {};
    for (const s of Object.keys(SAMMLUNGEN)) {
      kx.ids[s] = new Set((Array.isArray(daten[s]) ? daten[s] : []).filter((e) => istObjekt(e) && typeof e.id === 'string').map((e) => e.id));
    }
    const zr = istObjekt(daten.zeitraster) ? daten.zeitraster : {};
    kx.tage = new Set(Array.isArray(zr.tage) ? zr.tage.filter((t) => Modell.TAGE.includes(t)) : []);
    kx.stunden = new Set(Array.isArray(zr.stunden) ? zr.stunden.filter(istObjekt).map((s) => s.nr).filter(Number.isInteger) : []);
    kx.pausen = new Set(Array.isArray(zr.pausen) ? zr.pausen.filter(istObjekt).map((p) => p.vorStunde).filter(Number.isInteger) : []);
    const e = istObjekt(daten.einstellungen) ? daten.einstellungen : {};
    kx.maxLehrkraefte = Number.isInteger(e.maxLehrkraefteProKlasseUndSlot) ? e.maxLehrkraefteProKlasseUndSlot : 2;
    return kx;
  }
  function fehler(kx, pfad, meldung) {
    if (kx.fehler.length >= MAX_FEHLER) { kx.uebersprungen++; return; }
    kx.fehler.push({ pfad, meldung });
  }
  function warnung(kx, pfad, meldung) { kx.warnungen.push({ pfad, meldung }); }

  /* --------------------------- Strukturprüfung --------------------------- */

  function pruefeWert(wert, s, pfad, kx) {
    if (wert === null) {
      if (!s.nullbar) fehler(kx, pfad, 'darf nicht null sein');
      return;
    }
    switch (s.art) {
      case 'objekt': {
        if (!istObjekt(wert)) return fehler(kx, pfad, `muss ein Objekt sein, ist ${typname(wert)}`);
        for (const [name, fs] of Object.entries(s.felder)) {
          const p = pfadFeld(pfad, name);
          if (wert[name] === undefined) {
            if (fs.pflicht) fehler(kx, p, 'Pflichtfeld fehlt');
            continue;
          }
          pruefeWert(wert[name], fs, p, kx);
        }
        return;
      }
      case 'liste': {
        if (!Array.isArray(wert)) return fehler(kx, pfad, `muss eine Liste sein, ist ${typname(wert)}`);
        if (s.min !== undefined && wert.length < s.min) fehler(kx, pfad, `muss mindestens ${s.min} Eintrag/Einträge haben`);
        const max = s.maxEinstellung ? kx.maxLehrkraefte : s.max;
        if (max !== undefined && wert.length > max) {
          fehler(kx, pfad, s.maxEinstellung
            ? `höchstens ${max} Lehrkräfte je Klasse und Stunde erlaubt (maxLehrkraefteProKlasseUndSlot), eingetragen sind ${wert.length}`
            : `darf höchstens ${max} Einträge haben`);
        }
        wert.forEach((el, i) => pruefeWert(el, s.element, pfadIndex(pfad, i), kx));
        if (s.eindeutig) {
          const gesehen = new Map();
          wert.forEach((el, i) => {
            if (typeof el !== 'string' && typeof el !== 'number') return;
            if (gesehen.has(el)) {
              fehler(kx, pfadIndex(pfad, i), `${zeige(el)} kommt mehrfach vor (zuerst bei Index ${gesehen.get(el)})`);
            } else gesehen.set(el, i);
          });
        }
        return;
      }
      case 'text':
        if (typeof wert !== 'string') return fehler(kx, pfad, `muss Text sein, ist ${typname(wert)}`);
        if (s.nichtLeer && !wert.trim()) return fehler(kx, pfad, 'darf nicht leer sein');
        if (s.max !== undefined && wert.length > s.max) fehler(kx, pfad, `darf höchstens ${s.max} Zeichen lang sein`);
        return;
      case 'zahl':
        if (typeof wert !== 'number' || !Number.isFinite(wert)) return fehler(kx, pfad, `muss eine Zahl sein, ist ${typname(wert)} ${zeige(wert)}`);
        if (s.ganz && !Number.isInteger(wert)) return fehler(kx, pfad, `muss eine ganze Zahl sein, ist ${wert}`);
        if (s.min !== undefined && (s.minExklusiv ? wert <= s.min : wert < s.min)) {
          return fehler(kx, pfad, `muss ${s.minExklusiv ? 'größer als' : 'mindestens'} ${s.min} sein, ist ${wert}`);
        }
        if (s.max !== undefined && wert > s.max) fehler(kx, pfad, `darf höchstens ${s.max} sein, ist ${wert}`);
        return;
      case 'bool':
        if (typeof wert !== 'boolean') fehler(kx, pfad, `muss true oder false sein, ist ${typname(wert)}`);
        return;
      case 'wahl':
        if (!s.werte.includes(wert)) fehler(kx, pfad, `unzulässiger Wert ${zeige(wert)}; erlaubt: ${s.werte.join(', ')}`);
        return;
      case 'ref':
        if (typeof wert !== 'string') return fehler(kx, pfad, `muss eine ID (Text) sein, ist ${typname(wert)}`);
        if (!kx.ids[s.ziel].has(wert)) fehler(kx, pfad, `unbekannte Referenz ${zeige(wert)} (${SAMMLUNGEN[s.ziel]} existiert nicht)`);
        return;
      case 'datum':
        if (!Hilfen.istIsoDatum(wert)) fehler(kx, pfad, `muss ein Datum im Format JJJJ-MM-TT sein, ist ${zeige(wert)}`);
        return;
      case 'uhrzeit':
        if (typeof wert !== 'string' || !/^([01]\d|2[0-3]):[0-5]\d$/.test(wert)) fehler(kx, pfad, `muss eine Uhrzeit im Format HH:MM sein, ist ${zeige(wert)}`);
        return;
      case 'tag':
        if (!kx.tage.has(wert)) fehler(kx, pfad, `unbekannter Tag ${zeige(wert)}; das Zeitraster enthält: ${[...kx.tage].join(', ') || '–'}`);
        return;
      case 'stunde':
        if (!Number.isInteger(wert) || !kx.stunden.has(wert)) fehler(kx, pfad, `Stunde ${zeige(wert)} gibt es im Zeitraster nicht`);
        return;
      case 'pause':
        if (!Number.isInteger(wert) || !kx.pausen.has(wert)) fehler(kx, pfad, `vor Stunde ${zeige(wert)} ist keine Pause festgelegt`);
        return;
      default:
        throw new Error('Unbekannte Schema-Art: ' + s.art);
    }
  }

  /* --------------------------- Querprüfungen ----------------------------- */

  const liste = (w) => (Array.isArray(w) ? w : []);
  const eintraege = (w) => liste(w).map((e, i) => [e, i]).filter(([e]) => istObjekt(e));

  /** Eindeutigkeit eines Felds innerhalb einer Liste (optional ohne Groß-/Kleinschreibung). */
  function eindeutig(kx, daten, sammlung, feld, bezeichnung, ohneGross = false) {
    const gesehen = new Map();
    for (const [e, i] of eintraege(daten[sammlung])) {
      if (typeof e[feld] !== 'string') continue;
      const schluessel = ohneGross ? e[feld].toLocaleLowerCase('de') : e[feld];
      if (gesehen.has(schluessel)) {
        fehler(kx, `${sammlung}[${i}].${feld}`, `${bezeichnung} ${zeige(e[feld])} ist bereits in ${sammlung}[${gesehen.get(schluessel)}] vergeben`);
      } else gesehen.set(schluessel, i);
    }
  }

  function minutenVon(text) {
    const m = /^(\d{2}):(\d{2})$/.exec(text || '');
    return m ? Number(m[1]) * 60 + Number(m[2]) : null;
  }

  function pruefeDatumImRaster(kx, pfad, datum) {
    if (!Hilfen.istIsoDatum(datum)) return;
    const tag = Hilfen.wochentag(datum);
    if (!kx.tage.has(tag)) fehler(kx, pfad, `${datum} ist ein ${tag}; dieser Tag liegt nicht im Zeitraster`);
  }

  function querpruefungen(d, kx) {
    // Eindeutige IDs je Sammlung, eindeutige Kürzel und Namen
    for (const s of Object.keys(SAMMLUNGEN)) eindeutig(kx, d, s, 'id', 'ID');
    eindeutig(kx, d, 'faecher', 'kuerzel', 'Kürzel', true);
    eindeutig(kx, d, 'lehrkraefte', 'kuerzel', 'Kürzel', true);
    eindeutig(kx, d, 'raeume', 'name', 'Name', true);
    eindeutig(kx, d, 'klassen', 'name', 'Name', true);

    // Zeitraster
    const zr = istObjekt(d.zeitraster) ? d.zeitraster : {};
    const tage = liste(zr.tage);
    const reihenfolge = tage.map((t) => Modell.TAGE.indexOf(t)).filter((i) => i >= 0);
    if (reihenfolge.some((v, i) => i > 0 && v <= reihenfolge[i - 1])) fehler(kx, 'zeitraster.tage', 'Tage müssen in der Reihenfolge Mo–Fr stehen');
    let vorherBis = null;
    for (const [s, i] of eintraege(zr.stunden)) {
      const p = `zeitraster.stunden[${i}]`;
      if (Number.isInteger(s.nr) && s.nr !== i + 1) fehler(kx, p + '.nr', `erwartet ${i + 1} (Stunden fortlaufend ab 1 nummerieren), ist ${s.nr}`);
      const von = minutenVon(s.von);
      const bis = minutenVon(s.bis);
      if (von !== null && bis !== null && bis <= von) fehler(kx, p + '.bis', 'Ende muss nach dem Beginn liegen');
      if (von !== null && vorherBis !== null && von < vorherBis) fehler(kx, p + '.von', 'Stunde beginnt vor dem Ende der vorherigen Stunde');
      if (bis !== null) vorherBis = bis;
    }
    for (const [s, i] of liste(zr.doppelstundenStart).map((s, i) => [s, i])) {
      if (kx.stunden.has(s) && !kx.stunden.has(s + 1)) fehler(kx, `zeitraster.doppelstundenStart[${i}]`, `Doppelstunde ab Stunde ${s} braucht eine Stunde ${s + 1}`);
    }
    const pausenVor = new Map();
    for (const [p, i] of eintraege(zr.pausen)) {
      if (pausenVor.has(p.vorStunde)) fehler(kx, `zeitraster.pausen[${i}].vorStunde`, `vor Stunde ${p.vorStunde} ist bereits eine Pause festgelegt (pausen[${pausenVor.get(p.vorStunde)}])`);
      else pausenVor.set(p.vorStunde, i);
    }

    // Fächer: benötigter Raumtyp
    const fachraumtypen = new Set(eintraege(d.raeume).filter(([r]) => r.typ === 'fachraum' && typeof r.fachraumtyp === 'string').map(([r]) => r.fachraumtyp));
    const sonderraeume = new Set(eintraege(d.raeume).map(([r]) => r.typ).filter((t) => Modell.SONDERRAUMTYPEN.includes(t)));
    for (const [f, i] of eintraege(d.faecher)) {
      if (typeof f.raumtyp !== 'string') continue;
      if (f.raumtyp === 'klassenraum' || f.raumtyp === 'fachraum') {
        fehler(kx, `faecher[${i}].raumtyp`, `${zeige(f.raumtyp)} ist kein benötigter Raumtyp; erlaubt sind turnhalle, schwimmhalle oder ein Fachraumtyp (z. B. „nawi“)`);
      } else if (!fachraumtypen.has(f.raumtyp) && !sonderraeume.has(f.raumtyp)) {
        warnung(kx, `faecher[${i}].raumtyp`, `kein Raum vom Typ ${zeige(f.raumtyp)} vorhanden – das Fach kann nicht geplant werden`);
      }
    }

    // Lehrkräfte
    for (const [l, i] of eintraege(d.lehrkraefte)) {
      const p = `lehrkraefte[${i}]`;
      const zahl = (w) => typeof w === 'number';
      if (zahl(l.minStunden) && zahl(l.sollStunden) && l.minStunden > l.sollStunden) fehler(kx, p + '.minStunden', `Mindeststunden (${l.minStunden}) über Sollstunden (${l.sollStunden})`);
      if (zahl(l.maxStunden) && zahl(l.sollStunden) && l.maxStunden < l.sollStunden) fehler(kx, p + '.maxStunden', `Höchststunden (${l.maxStunden}) unter Sollstunden (${l.sollStunden})`);
      for (const [q, j] of eintraege(l.qualifikationen)) {
        if (Number.isInteger(q.stufenVon) && Number.isInteger(q.stufenBis) && q.stufenVon > q.stufenBis) fehler(kx, `${p}.qualifikationen[${j}].stufenBis`, 'muss mindestens stufenVon sein');
      }
      pruefeAbwesenheiten(kx, p, l.abwesenheiten);
    }

    // Räume
    for (const [r, i] of eintraege(d.raeume)) {
      const p = `raeume[${i}]`;
      if (r.typ === 'fachraum' && r.fachraumtyp === undefined) fehler(kx, p + '.fachraumtyp', 'Pflichtfeld bei Fachräumen fehlt');
      if (r.typ !== 'fachraum' && r.fachraumtyp !== undefined) warnung(kx, p + '.fachraumtyp', 'wird nur bei Fachräumen beachtet');
      liste(r.nahe).forEach((n, j) => { if (n === r.id) fehler(kx, `${p}.nahe[${j}]`, 'ein Raum kann nicht neben sich selbst liegen'); });
      pruefeAbwesenheiten(kx, p, r.abwesenheiten);
    }

    // Klassen
    const klassen = new Map(eintraege(d.klassen).map(([k]) => [k.id, k]));
    const raeume = new Map(eintraege(d.raeume).map(([r]) => [r.id, r]));
    const tafel = (klasseId) => new Set(eintraege(klassen.get(klasseId)?.stundentafel).map(([e]) => e.fach));
    for (const [k, i] of eintraege(d.klassen)) {
      const p = `klassen[${i}]`;
      const gesehen = new Map();
      for (const [e, j] of eintraege(k.stundentafel)) {
        if (gesehen.has(e.fach)) fehler(kx, `${p}.stundentafel[${j}].fach`, `Fach ${zeige(e.fach)} steht bereits in stundentafel[${gesehen.get(e.fach)}]`);
        else gesehen.set(e.fach, j);
      }
      const raum = raeume.get(k.heimatraum);
      if (raum && Number.isInteger(k.schueler) && Number.isInteger(raum.kapazitaet) && k.schueler > raum.kapazitaet) {
        warnung(kx, p + '.heimatraum', `Heimatraum fasst ${raum.kapazitaet}, Klasse hat ${k.schueler} Schüler:innen (H6)`);
      }
      const summe = eintraege(k.stundentafel).reduce((s, [e]) => s + (Number.isInteger(e.stunden) ? e.stunden : 0), 0);
      const slots = kx.tage.size * kx.stunden.size;
      if (slots && summe > slots) warnung(kx, p + '.stundentafel', `${summe} Wochenstunden passen nicht in ${slots} Zeitslots`);
    }

    // Zuordnungen
    const jeKlasseFach = new Map();
    for (const [z, i] of eintraege(d.zuordnungen)) {
      const p = `zuordnungen[${i}]`;
      if (klassen.has(z.klasse) && kx.ids.faecher.has(z.fach) && !tafel(z.klasse).has(z.fach)) {
        fehler(kx, p + '.fach', `Fach ${zeige(z.fach)} steht nicht in der Stundentafel der Klasse ${zeige(z.klasse)}`);
      }
      const schluessel = z.klasse + '\u0000' + z.fach;
      if (!jeKlasseFach.has(schluessel)) jeKlasseFach.set(schluessel, []);
      const bisher = jeKlasseFach.get(schluessel);
      const doppelt = bisher.find((x) => x.z.lehrkraft === z.lehrkraft);
      if (doppelt) {
        fehler(kx, p + '.lehrkraft', `Lehrkraft ist für diese Klasse und dieses Fach bereits als „${doppelt.z.rolle}“ eingetragen (zuordnungen[${doppelt.i}])`);
      } else if (z.rolle === 'haupt' && bisher.some((x) => x.z.rolle === 'haupt')) {
        fehler(kx, p + '.rolle', `für Klasse und Fach ist bereits eine Hauptlehrkraft eingetragen (zuordnungen[${bisher.find((x) => x.z.rolle === 'haupt').i}])`);
      } else if (bisher.length + 1 > kx.maxLehrkraefte) {
        fehler(kx, p, `mehr als ${kx.maxLehrkraefte} Lehrkräfte für dieselbe Klasse und dasselbe Fach`);
      }
      bisher.push({ z, i });
    }

    // Plan
    const plan = istObjekt(d.plan) ? d.plan : {};
    for (const [s, i] of eintraege(plan.regelplan)) {
      const p = `plan.regelplan[${i}]`;
      pruefeStundeneintrag(kx, p, s, tafel);
    }
    const slotBelegt = new Map();
    for (const [s, i] of eintraege(plan.regelplan)) {
      const schluessel = [s.klasse, s.tag, s.stunde].join('\u0000');
      if (slotBelegt.has(schluessel)) fehler(kx, `plan.regelplan[${i}]`, `Klasse hat in diesem Zeitslot bereits eine Stunde (plan.regelplan[${slotBelegt.get(schluessel)}])`);
      else slotBelegt.set(schluessel, i);
    }
    for (const [v, i] of eintraege(plan.vertretungen)) {
      const p = `plan.vertretungen[${i}]`;
      pruefeDatumImRaster(kx, p + '.datum', v.datum);
      pruefeStundeneintrag(kx, p, v, tafel);
      if (v.status === 'doppeltBetreut' && v.mitKlasse === undefined) fehler(kx, p + '.mitKlasse', 'bei Doppelbetreuung erforderlich');
      if (v.mitKlasse !== undefined && v.mitKlasse === v.klasse) fehler(kx, p + '.mitKlasse', 'muss eine andere Klasse sein');
      if (v.status === 'aufgeteilt' && !liste(v.verteilung).length) fehler(kx, p + '.verteilung', 'bei Aufteilung erforderlich');
      for (const [z, j] of eintraege(v.verteilung)) {
        if (z.zielKlasse === v.klasse) fehler(kx, `${p}.verteilung[${j}].zielKlasse`, 'eine Klasse kann nicht auf sich selbst aufgeteilt werden');
      }
      const k = klassen.get(v.klasse);
      const summe = eintraege(v.verteilung).reduce((s, [z]) => s + (Number.isInteger(z.anzahl) ? z.anzahl : 0), 0);
      if (k && Number.isInteger(k.schueler) && summe > k.schueler) fehler(kx, p + '.verteilung', `verteilt ${summe} Schüler:innen, die Klasse hat ${k.schueler}`);
    }
    const aufsichtGesehen = new Map();
    for (const [a, i] of eintraege(plan.aufsichten)) {
      const schluessel = [a.tag, a.vorStunde, a.lehrkraft].join('\u0000');
      if (aufsichtGesehen.has(schluessel)) fehler(kx, `plan.aufsichten[${i}]`, `doppelt eingetragen (plan.aufsichten[${aufsichtGesehen.get(schluessel)}])`);
      else aufsichtGesehen.set(schluessel, i);
    }
    for (const [a, i] of eintraege(plan.aufsichtsVertretungen)) {
      const p = `plan.aufsichtsVertretungen[${i}]`;
      pruefeDatumImRaster(kx, p + '.datum', a.datum);
      if (a.status === 'vertreten' && (a.lehrkraft === null || a.lehrkraft === undefined)) fehler(kx, p + '.lehrkraft', 'bei Status „vertreten“ erforderlich');
      if (a.status === 'unbesetzt' && typeof a.lehrkraft === 'string') fehler(kx, p + '.lehrkraft', 'muss bei Status „unbesetzt“ null sein');
      if (typeof a.lehrkraft === 'string' && a.lehrkraft === a.fuer) fehler(kx, p + '.lehrkraft', 'eine Lehrkraft kann sich nicht selbst vertreten');
    }
  }

  function pruefeAbwesenheiten(kx, pfad, abwesenheiten) {
    for (const [a, j] of eintraege(abwesenheiten)) {
      if (Hilfen.istIsoDatum(a.von) && Hilfen.istIsoDatum(a.bis) && a.bis < a.von) fehler(kx, `${pfad}.abwesenheiten[${j}].bis`, 'Ende liegt vor dem Beginn');
    }
  }

  /** Gemeinsame Prüfungen für Regelplan- und Vertretungseinträge. */
  function pruefeStundeneintrag(kx, p, s, tafel) {
    const ohneLehrkraft = ['entfaellt', 'aufgeteilt'];
    if (typeof s.status === 'string' && !ohneLehrkraft.includes(s.status) && Array.isArray(s.lehrkraefte) && !s.lehrkraefte.length) {
      fehler(kx, p + '.lehrkraefte', `bei Status „${s.status}“ ist mindestens eine Lehrkraft erforderlich`);
    }
    if (Array.isArray(s.lehrkraefte)) {
      const gesehen = new Map();
      s.lehrkraefte.forEach((l, j) => {
        if (gesehen.has(l)) fehler(kx, `${p}.lehrkraefte[${j}]`, `Lehrkraft ${zeige(l)} ist zugleich Haupt- und Zweitlehrkraft derselben Stunde`);
        else gesehen.set(l, j);
      });
    }
    if (typeof s.fach === 'string' && kx.ids.klassen.has(s.klasse) && kx.ids.faecher.has(s.fach) && !tafel(s.klasse).has(s.fach)) {
      fehler(kx, p + '.fach', `Fach ${zeige(s.fach)} steht nicht in der Stundentafel der Klasse`);
    }
  }

  /* ------------------------------ Öffentlich ----------------------------- */

  /**
   * Prüft einen (normalisierten) Zustand vollständig.
   * @returns {{fehler: {pfad:string, meldung:string}[], warnungen: {pfad:string, meldung:string}[]}}
   */
  function validiere(daten) {
    if (!istObjekt(daten)) return { fehler: [{ pfad: '', meldung: `Die Datei muss ein JSON-Objekt enthalten, enthält aber ${typname(daten)}` }], warnungen: [] };
    const kx = neuerKontext(daten);
    pruefeWert(daten, ZUSTAND, '', kx);
    querpruefungen(daten, kx);
    if (kx.uebersprungen) kx.fehler.push({ pfad: '', meldung: `… und ${kx.uebersprungen} weitere Fehler` });
    return { fehler: kx.fehler, warnungen: kx.warnungen };
  }

  /** Ergänzt fehlende optionale Felder mit Standardwerten (verändert `wert`). */
  function normalisiere(wert, s = ZUSTAND) {
    if (s.art === 'objekt' && istObjekt(wert)) {
      for (const [name, fs] of Object.entries(s.felder)) {
        if (wert[name] === undefined && 'standard' in fs) {
          wert[name] = typeof fs.standard === 'function' ? fs.standard(wert) : Hilfen.tiefeKopie(fs.standard);
        }
        if (wert[name] !== undefined) normalisiere(wert[name], fs);
      }
    } else if (s.art === 'liste' && Array.isArray(wert)) {
      for (const el of wert) normalisiere(el, s.element);
    }
    return wert;
  }

  /** Kopie mit kanonischer Feldreihenfolge: bekannte Felder nach Schema, unbekannte dahinter. */
  function ordne(wert, s = ZUSTAND) {
    if (s && s.art === 'objekt' && istObjekt(wert)) {
      const ergebnis = {};
      for (const [name, fs] of Object.entries(s.felder)) if (wert[name] !== undefined) ergebnis[name] = ordne(wert[name], fs);
      for (const [name, w] of Object.entries(wert)) if (!(name in s.felder) && w !== undefined) ergebnis[name] = Hilfen.tiefeKopie(w);
      return ergebnis;
    }
    if (s && s.art === 'liste' && Array.isArray(wert)) return wert.map((el) => ordne(el, s.element));
    return Hilfen.tiefeKopie(wert);
  }

  /**
   * Migrationen: MIGRATIONEN[v] zieht Daten von Version v auf v + 1.
   * Version 1 ist die erste veröffentlichte Version; neue Einträge hier ergänzen.
   */
  const MIGRATIONEN = Object.freeze({});

  /**
   * Bringt Daten auf die aktuelle Schemaversion.
   * @returns {{daten?: object, fehler: {pfad:string, meldung:string}[], migriertVon?: number}}
   */
  function migriere(daten, migrationen = MIGRATIONEN) {
    const v = daten.schemaVersion;
    if (v === undefined) return { fehler: [{ pfad: 'schemaVersion', meldung: 'Pflichtfeld fehlt – ist das eine Datei dieses Programms?' }] };
    if (!Number.isInteger(v) || v < 0) return { fehler: [{ pfad: 'schemaVersion', meldung: `muss eine ganze Zahl sein, ist ${zeige(v)}` }] };
    if (v > Modell.SCHEMA_VERSION) {
      return { fehler: [{ pfad: 'schemaVersion', meldung: `Version ${v} ist neuer als dieses Programm (unterstützt bis Version ${Modell.SCHEMA_VERSION}). Bitte eine aktuelle Programmversion verwenden.` }] };
    }
    let d = daten;
    for (let stufe = v; stufe < Modell.SCHEMA_VERSION; stufe++) {
      const fn = migrationen[stufe];
      if (typeof fn !== 'function') return { fehler: [{ pfad: 'schemaVersion', meldung: `Version ${stufe} wird nicht mehr unterstützt (keine Migration auf ${stufe + 1})` }] };
      try {
        d = fn(d);
        d.schemaVersion = stufe + 1;
      } catch (e) {
        return { fehler: [{ pfad: 'schemaVersion', meldung: `Migration von Version ${stufe} fehlgeschlagen: ${e.message}` }] };
      }
    }
    return { daten: d, fehler: [], migriertVon: v < Modell.SCHEMA_VERSION ? v : undefined };
  }

  return { T, ZUSTAND, TEILE, SAMMLUNGEN, MIGRATIONEN, validiere, normalisiere, ordne, migriere };
})();

/* ---- src/kern/30-index.js ---- */
/* ==========================================================================
 * Modul Index
 * Schnelle Nachschlagestrukturen über einem (gültigen) Zustand: Entitäten
 * nach ID, Zuordnungen je Klasse und Fach, Stundentafeln, Qualifikationen,
 * Sperrzeiten, Abwesenheiten, Raumtyp-Prüfung. Grundlage für Regeln, Kosten,
 * Planer und Vertretung.
 * ========================================================================== */
const Index = (() => {
  'use strict';

  const schluessel = (...teile) => teile.join('|');

  /** Erstellt den Index. Der Zustand muss die Schema-Prüfung bestanden haben. */
  function erstelle(z) {
    const zr = z.zeitraster;
    const tage = zr.tage.slice();
    const tagIndex = new Map(tage.map((t, i) => [t, i]));
    const stunden = zr.stunden.map((s) => s.nr);
    const stundeInfo = new Map(zr.stunden.map((s) => [s.nr, s]));
    const pausen = (zr.pausen || []).slice().sort((a, b) => a.vorStunde - b.vorStunde);
    const pauseVor = new Map(pausen.map((p) => [p.vorStunde, p]));
    const doppelstundenStart = new Set(zr.doppelstundenStart || []);

    const nachId = (liste) => new Map(liste.map((e) => [e.id, e]));
    const lehrkraefte = nachId(z.lehrkraefte);
    const klassen = nachId(z.klassen);
    const raeume = nachId(z.raeume);
    const faecher = nachId(z.faecher);
    const einstellungen = z.einstellungen;

    // Zuordnungen je Klasse und Fach: { haupt: id|null, zweit: id[] }
    const zuordnung = new Map();
    for (const zu of z.zuordnungen) {
      const k = schluessel(zu.klasse, zu.fach);
      if (!zuordnung.has(k)) zuordnung.set(k, { haupt: null, zweit: [] });
      if (zu.rolle === 'haupt') zuordnung.get(k).haupt = zu.lehrkraft;
      else zuordnung.get(k).zweit.push(zu.lehrkraft);
    }
    // Lehrkräfte, die eine Klasse laut Zuordnung unterrichten (für „eigene Lehrkraft“)
    const lehrkraefteDerKlasse = new Map();
    for (const zu of z.zuordnungen) {
      if (!lehrkraefteDerKlasse.has(zu.klasse)) lehrkraefteDerKlasse.set(zu.klasse, new Set());
      lehrkraefteDerKlasse.get(zu.klasse).add(zu.lehrkraft);
    }

    // Stundentafel je Klasse: Map fach → { stunden, doppelt }
    const tafel = new Map(z.klassen.map((k) => [k.id, new Map(k.stundentafel.map((e) => [e.fach, e]))]));

    // Sperrzeiten als Mengen „Tag|Stunde“
    const sperren = (liste) => {
      const m = new Set();
      for (const g of liste || []) for (const s of g.stunden) m.add(schluessel(g.tag, s));
      return m;
    };
    const gesperrtL = new Map(z.lehrkraefte.map((l) => [l.id, sperren(l.gesperrt)]));
    const gesperrtR = new Map(z.raeume.map((r) => [r.id, sperren(r.gesperrt)]));

    function istQualifiziert(lehrkraftId, fachId, stufe) {
      const l = lehrkraefte.get(lehrkraftId);
      return !!l && l.qualifikationen.some((q) => q.fach === fachId && q.stufenVon <= stufe && stufe <= q.stufenBis);
    }
    const anzahlQualifiziertCache = new Map();
    function anzahlQualifizierte(fachId, stufe) {
      const k = schluessel(fachId, stufe);
      if (!anzahlQualifiziertCache.has(k)) {
        anzahlQualifiziertCache.set(k, z.lehrkraefte.filter((l) => istQualifiziert(l.id, fachId, stufe)).length);
      }
      return anzahlQualifiziertCache.get(k);
    }
    const lehrkraftGesperrt = (id, tag, stunde) => !!gesperrtL.get(id)?.has(schluessel(tag, stunde));
    const raumGesperrt = (id, tag, stunde) => !!gesperrtR.get(id)?.has(schluessel(tag, stunde));
    const abwesend = (eintrag, datum) => !!datum && !!eintrag && (eintrag.abwesenheiten || []).some((a) => a.von <= datum && datum <= a.bis);
    const lehrkraftAbwesend = (id, datum) => abwesend(lehrkraefte.get(id), datum);
    const raumAbwesend = (id, datum) => abwesend(raeume.get(id), datum);

    /** Vertretungsreserve in Stunden (Annahme 11: aufgerundet). */
    const reserve = (l) => Modell.vertretungsreserve(l.sollStunden, einstellungen.vertretungsreserveProzent);

    /**
     * Passt der Raum zum Fach (H5)? Ein Fach mit Raumtyp braucht genau diesen Typ,
     * Fachräume, Turn- und Schwimmhallen sind Fächern mit passendem Raumtyp vorbehalten.
     */
    function raumPasst(raumId, fachId) {
      const r = raeume.get(raumId);
      const f = faecher.get(fachId);
      if (!r || !f) return true;
      const typDesRaums = r.typ === 'fachraum' ? r.fachraumtyp : r.typ === 'klassenraum' ? null : r.typ;
      return (f.raumtyp || null) === typDesRaums;
    }

    /** Ist die Stunde „Vormittag“ (Beginn vor 12:00)? Für W4. */
    const istVormittag = (stunde) => (stundeInfo.get(stunde)?.von || '00:00') < '12:00';

    /** Lesbare Namen für Meldungen. */
    const name = {
      lehrkraft: (id) => lehrkraefte.get(id)?.kuerzel || id,
      klasse: (id) => klassen.get(id)?.name || id,
      raum: (id) => raeume.get(id)?.name || id,
      fach: (id) => faecher.get(id)?.kuerzel || id || '–',
      slot: (tag, stunde) => `${tag} ${stunde}.`,
      pause: (tag, vor) => `${tag} ${pauseVor.get(vor)?.name || 'Pause'} (vor der ${vor}. Stunde)`,
    };

    return {
      z, tage, tagIndex, stunden, stundeInfo, pausen, pauseVor, doppelstundenStart,
      lehrkraefte, klassen, raeume, faecher, einstellungen, zuordnung, lehrkraefteDerKlasse, tafel,
      istQualifiziert, anzahlQualifizierte, lehrkraftGesperrt, raumGesperrt, lehrkraftAbwesend, raumAbwesend,
      reserve, raumPasst, istVormittag, name,
      zuordnungVon: (klasse, fach) => zuordnung.get(schluessel(klasse, fach)) || { haupt: null, zweit: [] },
    };
  }

  /**
   * Statusgruppen einer Unterrichtsstunde:
   *  - belegt:   die Klasse ist anwesend (H12) – alles außer „entfaellt“
   *  - abgedeckt: Stunde der Stundentafel findet statt (K1) – alles außer „entfaellt“ und „aufsicht“
   *  - fachunterricht: Hauptlehrkraft erteilt Fachunterricht (K2, K3) – „regulaer“ und „vertreten“
   *  - mitRaum:  braucht einen Raum – alles außer „entfaellt“ und „aufgeteilt“
   */
  const STATUS = {
    belegt: (s) => s.status !== 'entfaellt',
    abgedeckt: (s) => s.status !== 'entfaellt' && s.status !== 'aufsicht',
    fachunterricht: (s) => s.status === 'regulaer' || s.status === 'vertreten',
    mitRaum: (s) => s.status !== 'entfaellt' && s.status !== 'aufgeteilt',
  };

  return { erstelle, schluessel, STATUS };
})();

/* ---- src/kern/40-regeln.js ---- */
/* ==========================================================================
 * Modul Regeln
 * Prüft einen Plan gegen die harten Regeln H1–H14 (Spezifikation §4).
 * Jeder Verstoß nennt Regel, lesbaren Text und die betroffenen Einträge
 * (Indizes in stunden[] bzw. aufsichten[]), damit die Oberfläche sie markieren
 * und erklären kann.
 *
 * Geprüft werden zwei Arten von Plänen:
 *  - Wochenplan (Regelplan): alle Tage, Wochenregeln H7, H11, H14 aktiv
 *  - Tagesplan (Vertretung, `datum` gesetzt): ein Datum, Abwesenheiten aktiv;
 *    Wochengrenzen prüft die Vertretungsplanung mit dem Wochenkontext
 * ========================================================================== */
const Regeln = (() => {
  'use strict';

  /** Kurztitel der harten Regeln (für Anzeige und Bericht). */
  const TITEL = Object.freeze({
    H1: 'Lehrkraft höchstens einmal je Zeitslot (außer genehmigter Doppelbetreuung)',
    H2: 'Klasse höchstens eine Veranstaltung je Zeitslot',
    H3: 'Raum höchstens einmal je Zeitslot belegt',
    H4: 'Lehrkraft nicht gesperrt oder abwesend',
    H5: 'Raum nicht gesperrt, passender Raumtyp',
    H6: 'Raumkapazität reicht',
    H7: 'Wochenstunden höchstens Höchstgrenze',
    H8: 'reguläre Fachstunde nur durch qualifizierte Hauptlehrkraft',
    H9: 'nicht mehr Stunden als in der Stundentafel',
    H10: 'höchstens zulässige Zahl an Lehrkräften je Klasse und Zeitslot',
    H11: 'Zweitbesetzung wahrt die Vertretungsreserve',
    H12: 'keine Leerstunden für Klassen',
    H13: 'Pausenaufsicht nur durch anwesende Lehrkräfte',
    H14: 'Aufsichten höchstens Aufsichtssoll',
  });

  const S = Index.schluessel;

  /**
   * @param {object} z Zustand (gültig nach Schema)
   * @param {{stunden?: object[], aufsichten?: object[]}} [plan] Standard: Regelplan des Zustands
   * @param {{datum?: string}} [optionen] datum: Tagesplan für dieses Datum prüfen
   * @returns {{regel: string, text: string, stunden: number[], aufsichten: number[]}[]}
   */
  function pruefeHart(z, plan, optionen = {}) {
    const ix = Index.erstelle(z);
    const stunden = plan?.stunden ?? z.plan.regelplan;
    const aufsichten = plan?.aufsichten ?? z.plan.aufsichten;
    const datum = optionen.datum;
    const woche = !datum;
    const n = ix.name;
    const verstoesse = [];
    const melde = (regel, text, betroffen = {}) => verstoesse.push({
      regel, text, stunden: betroffen.stunden || [], aufsichten: betroffen.aufsichten || [],
    });

    /* ---------- Gruppierungen ---------- */
    const proSlot = gruppiere(stunden, (s) => S(s.tag, s.stunde));
    const proKlasseSlot = gruppiere(stunden, (s) => S(s.klasse, s.tag, s.stunde));
    const lehrerSlot = new Map(); // Lehrkraft|Tag|Stunde → Indizes
    stunden.forEach((s, i) => {
      for (const l of s.lehrkraefte || []) {
        const k = S(l, s.tag, s.stunde);
        if (!lehrerSlot.has(k)) lehrerSlot.set(k, []);
        lehrerSlot.get(k).push(i);
      }
    });
    const verknuepft = (a, b) => (a.mitKlasse === b.klasse || b.mitKlasse === a.klasse)
      && (a.status === 'doppeltBetreut' || b.status === 'doppeltBetreut');

    /* ---------- H1: Lehrkraft je Slot ---------- */
    for (const [k, idx] of lehrerSlot) {
      if (idx.length < 2) continue;
      const [l, tag, stunde] = k.split('|');
      const [a, b] = idx.map((i) => stunden[i]);
      const erlaubt = idx.length === 2 && verknuepft(a, b) && a.lehrkraefte[0] === l && b.lehrkraefte[0] === l;
      if (!erlaubt) {
        melde('H1', `${n.lehrkraft(l)} ist ${n.slot(tag, stunde)} Stunde in ${idx.length} Klassen eingeplant (${idx.map((i) => n.klasse(stunden[i].klasse)).join(', ')})`, { stunden: idx });
      }
    }
    // Doppelbetreuung: Partnerklasse vorhanden, Grenzen je Tag
    const db = new Map(); // Lehrkraft|Tag → Stunden
    stunden.forEach((s, i) => {
      if (s.status !== 'doppeltBetreut') return;
      const l = s.lehrkraefte?.[0];
      const partner = (proKlasseSlot.get(S(s.mitKlasse, s.tag, s.stunde)) || []).map((j) => stunden[j]);
      if (!partner.some((p) => p.lehrkraefte?.includes(l))) {
        melde('H1', `Doppelbetreuung ${n.slot(s.tag, s.stunde)} Stunde: ${n.klasse(s.mitKlasse)} wird in diesem Slot nicht von ${n.lehrkraft(l)} betreut`, { stunden: [i] });
      }
      if (!l) return;
      const k = S(l, s.tag);
      if (!db.has(k)) db.set(k, new Map());
      db.get(k).set(s.stunde, [...(db.get(k).get(s.stunde) || []), i]);
    });
    const maxProTag = ix.einstellungen.maxDoppelbetreuungProTag;
    const maxAmStueck = ix.einstellungen.maxDoppelbetreuungStundenAmStueck;
    for (const [k, proStunde] of db) {
      const [l, tag] = k.split('|');
      const folgen = laeufe([...proStunde.keys()]);
      const alle = [...proStunde.values()].flat();
      if (folgen.length > maxProTag) {
        melde('H1', `${n.lehrkraft(l)} hat am ${tag} ${folgen.length} Doppelbetreuungen (erlaubt: ${maxProTag})`, { stunden: alle });
      }
      for (const f of folgen) {
        if (f.length > maxAmStueck) {
          melde('H1', `${n.lehrkraft(l)} betreut am ${tag} ${f.length} Stunden am Stück doppelt (erlaubt: ${maxAmStueck})`, { stunden: f.flatMap((st) => proStunde.get(st)) });
        }
      }
    }

    /* ---------- H2: Klasse je Slot ---------- */
    for (const [k, idx] of proKlasseSlot) {
      if (idx.length < 2) continue;
      const [klasse, tag, stunde] = k.split('|');
      melde('H2', `${n.klasse(klasse)} hat ${n.slot(tag, stunde)} Stunde ${idx.length} Veranstaltungen`, { stunden: idx });
    }

    /* ---------- H3: Raum je Slot ---------- */
    const raumSlot = gruppiere(stunden, (s) => (s.raum ? S(s.raum, s.tag, s.stunde) : null));
    for (const [k, idx] of raumSlot) {
      if (idx.length < 2) continue;
      const erlaubt = idx.length === 2 && verknuepft(stunden[idx[0]], stunden[idx[1]]);
      if (!erlaubt) {
        const [raum, tag, stunde] = k.split('|');
        melde('H3', `Raum ${n.raum(raum)} ist ${n.slot(tag, stunde)} Stunde ${idx.length}-fach belegt (${idx.map((i) => n.klasse(stunden[i].klasse)).join(', ')})`, { stunden: idx });
      }
    }

    /* ---------- H4, H5, H8, H10: je Eintrag ---------- */
    const maxL = ix.einstellungen.maxLehrkraefteProKlasseUndSlot;
    stunden.forEach((s, i) => {
      const nur = { stunden: [i] };
      const wo = `${n.klasse(s.klasse)} ${n.slot(s.tag, s.stunde)} Stunde`;
      for (const l of s.lehrkraefte || []) {
        if (ix.lehrkraftGesperrt(l, s.tag, s.stunde)) melde('H4', `${n.lehrkraft(l)} ist ${n.slot(s.tag, s.stunde)} Stunde gesperrt (${wo})`, nur);
        if (ix.lehrkraftAbwesend(l, datum)) melde('H4', `${n.lehrkraft(l)} ist am ${datum} abwesend (${wo})`, nur);
      }
      if (Index.STATUS.mitRaum(s)) {
        if (!s.raum) melde('H5', `${wo}: kein Raum zugewiesen`, nur);
        else {
          if (ix.raumGesperrt(s.raum, s.tag, s.stunde)) melde('H5', `Raum ${n.raum(s.raum)} ist ${n.slot(s.tag, s.stunde)} Stunde gesperrt (${wo})`, nur);
          if (ix.raumAbwesend(s.raum, datum)) melde('H5', `Raum ${n.raum(s.raum)} steht am ${datum} nicht zur Verfügung (${wo})`, nur);
          if (Index.STATUS.fachunterricht(s) && s.fach && !ix.raumPasst(s.raum, s.fach)) {
            const f = ix.faecher.get(s.fach);
            melde('H5', `${wo}: ${n.fach(s.fach)} ${f?.raumtyp ? 'braucht Raumtyp „' + f.raumtyp + '“' : 'gehört in einen Klassenraum'}, Raum ${n.raum(s.raum)} passt nicht`, nur);
          }
        }
      }
      if (s.status === 'regulaer' && s.fach && s.lehrkraefte?.length) {
        const stufe = ix.klassen.get(s.klasse)?.stufe;
        if (!ix.istQualifiziert(s.lehrkraefte[0], s.fach, stufe)) {
          melde('H8', `${wo}: ${n.lehrkraft(s.lehrkraefte[0])} ist für ${n.fach(s.fach)} in Stufe ${stufe} nicht qualifiziert`, nur);
        }
      }
      if ((s.lehrkraefte || []).length > maxL) melde('H10', `${wo}: ${s.lehrkraefte.length} Lehrkräfte (erlaubt: ${maxL})`, nur);
    });

    /* ---------- H6: Kapazität (inkl. Gäste aus Aufteilungen) ---------- */
    const last = new Map(); // Raum|Tag|Stunde → { schueler, idx }
    const addiere = (raum, tag, stunde, anzahl, i) => {
      const k = S(raum, tag, stunde);
      if (!last.has(k)) last.set(k, { schueler: 0, idx: new Set() });
      const e = last.get(k);
      e.schueler += anzahl;
      e.idx.add(i);
    };
    stunden.forEach((s, i) => {
      if (!Index.STATUS.mitRaum(s) || !s.raum) return;
      addiere(s.raum, s.tag, s.stunde, ix.klassen.get(s.klasse)?.schueler || 0, i);
    });
    stunden.forEach((s, i) => {
      if (s.status !== 'aufgeteilt') return;
      for (const v of s.verteilung || []) {
        const zielIdx = (proKlasseSlot.get(S(v.zielKlasse, s.tag, s.stunde)) || [])[0];
        const zielStunde = zielIdx !== undefined ? stunden[zielIdx] : null;
        if (!zielStunde || !Index.STATUS.mitRaum(zielStunde) || !zielStunde.raum) {
          melde('H6', `Aufteilung ${n.klasse(s.klasse)} ${n.slot(s.tag, s.stunde)} Stunde: Zielklasse ${n.klasse(v.zielKlasse)} hat in diesem Slot keinen Unterricht in einem Raum`, { stunden: [i] });
          continue;
        }
        addiere(zielStunde.raum, s.tag, s.stunde, v.anzahl, i);
      }
    });
    for (const [k, e] of last) {
      const [raum, tag, stunde] = k.split('|');
      const kap = ix.raeume.get(raum)?.kapazitaet ?? Infinity;
      if (e.schueler > kap) {
        melde('H6', `Raum ${n.raum(raum)} ${n.slot(tag, stunde)} Stunde: ${e.schueler} Schüler:innen bei Kapazität ${kap}`, { stunden: [...e.idx] });
      }
    }

    /* ---------- H7, H11: Wochenstunden und Reserve ---------- */
    if (woche) {
      for (const [l, info] of lehrkraftStunden(stunden)) {
        const lk = ix.lehrkraefte.get(l);
        if (!lk) continue;
        if (info.slots.size > lk.maxStunden) {
          melde('H7', `${n.lehrkraft(l)} hat ${info.slots.size} Wochenstunden (Höchstgrenze ${lk.maxStunden})`, { stunden: info.idx });
        }
        const grenze = lk.sollStunden - ix.reserve(lk);
        if (info.zweit.size > 0 && info.slots.size > grenze) {
          melde('H11', `${n.lehrkraft(l)} hat ${info.slots.size} Stunden davon ${info.zweit.size} als Zweitbesetzung; mit Zweitbesetzung höchstens ${grenze} (Soll ${lk.sollStunden} − Reserve ${ix.reserve(lk)})`, { stunden: info.zweitIdx });
        }
      }
    }

    /* ---------- H9: Stundentafel ---------- */
    const proKlasseFach = gruppiere(stunden, (s) => (s.fach ? S(s.klasse, s.fach) : null));
    for (const [k, idx] of proKlasseFach) {
      const [klasse, fach] = k.split('|');
      const soll = ix.tafel.get(klasse)?.get(fach)?.stunden;
      // Im Tagesplan gilt dieselbe Obergrenze: ein Tag hat nie mehr Stunden eines Fachs als die Woche.
      if (soll === undefined) melde('H9', `${n.klasse(klasse)}: ${n.fach(fach)} steht nicht in der Stundentafel`, { stunden: idx });
      else if (idx.length > soll) melde('H9', `${n.klasse(klasse)}: ${idx.length} Stunden ${n.fach(fach)}, Stundentafel sieht ${soll} vor`, { stunden: idx });
    }

    /* ---------- H12: keine Leerstunden ---------- */
    const proKlasseTag = gruppiere(stunden, (s) => (Index.STATUS.belegt(s) ? S(s.klasse, s.tag) : null));
    for (const [k, idx] of proKlasseTag) {
      const [klasse, tag] = k.split('|');
      const belegt = new Set(idx.map((i) => stunden[i].stunde));
      const reihe = ix.stunden.filter((st) => st >= Math.min(...belegt) && st <= Math.max(...belegt));
      const luecken = reihe.filter((st) => !belegt.has(st));
      if (luecken.length) {
        melde('H12', `${n.klasse(klasse)} hat am ${tag} ${luecken.length === 1 ? 'eine Leerstunde' : luecken.length + ' Leerstunden'} (${luecken.map((st) => st + '.').join(', ')} Stunde)`, { stunden: idx });
      }
    }

    /* ---------- H13, H14: Pausenaufsichten ---------- */
    const unterrichtetAm = new Set(); // Lehrkraft|Tag
    for (const s of stunden) if (Index.STATUS.belegt(s)) for (const l of s.lehrkraefte || []) unterrichtetAm.add(S(l, s.tag));
    const aufsichtDoppelt = gruppiere(aufsichten, (a) => S(a.tag, a.vorStunde, a.lehrkraft));
    for (const [k, idx] of aufsichtDoppelt) {
      if (idx.length > 1) {
        const [tag, vor, l] = k.split('|');
        melde('H13', `${n.lehrkraft(l)} ist für ${n.pause(tag, Number(vor))} mehrfach eingeteilt`, { aufsichten: idx });
      }
    }
    aufsichten.forEach((a, i) => {
      const nur = { aufsichten: [i] };
      const wo = n.pause(a.tag, a.vorStunde);
      const angrenzend = a.vorStunde === ix.stunden[0] ? [a.vorStunde] : [a.vorStunde - 1, a.vorStunde];
      const gesperrt = angrenzend.filter((st) => ix.lehrkraftGesperrt(a.lehrkraft, a.tag, st));
      if (gesperrt.length) melde('H13', `${n.lehrkraft(a.lehrkraft)}: Aufsicht ${wo}, aber ${gesperrt.map((st) => st + '.').join(' und ')} Stunde gesperrt`, nur);
      if (ix.lehrkraftAbwesend(a.lehrkraft, datum)) melde('H13', `${n.lehrkraft(a.lehrkraft)} ist am ${datum} abwesend (Aufsicht ${wo})`, nur);
      if (!unterrichtetAm.has(S(a.lehrkraft, a.tag))) melde('H13', `${n.lehrkraft(a.lehrkraft)} hat am ${a.tag} keinen Unterricht, ist aber für ${wo} eingeteilt`, nur);
    });
    if (woche) {
      const jeLehrkraft = gruppiere(aufsichten, (a) => a.lehrkraft);
      for (const [l, idx] of jeLehrkraft) {
        const soll = ix.lehrkraefte.get(l)?.aufsichtenProWoche ?? 0;
        if (idx.length > soll) melde('H14', `${n.lehrkraft(l)} hat ${idx.length} Aufsichten (Aufsichtssoll ${soll})`, { aufsichten: idx });
      }
    }

    const nr = (r) => Number(r.slice(1));
    return verstoesse.sort((a, b) => nr(a.regel) - nr(b.regel));
  }

  /* ------------------------------ Hilfen ---------------------------------- */

  /** Gruppiert Indizes nach Schlüssel; `null` als Schlüssel wird übersprungen. */
  function gruppiere(liste, schluesselFn) {
    const m = new Map();
    liste.forEach((e, i) => {
      const k = schluesselFn(e);
      if (k === null || k === undefined) return;
      if (!m.has(k)) m.set(k, []);
      m.get(k).push(i);
    });
    return m;
  }

  /** Zerlegt Stundennummern in Folgen aufeinanderfolgender Stunden. */
  function laeufe(nummern) {
    const sortiert = [...new Set(nummern)].sort((a, b) => a - b);
    const ergebnis = [];
    for (const x of sortiert) {
      const letzte = ergebnis[ergebnis.length - 1];
      if (letzte && x === letzte[letzte.length - 1] + 1) letzte.push(x);
      else ergebnis.push([x]);
    }
    return ergebnis;
  }

  /**
   * Belegte Zeitslots je Lehrkraft (Haupt, Zweit, Aufsicht, Doppelbetreuung
   * zählt je Slot einmal). Grundlage für H7, H11, K5, W2, W7, W8.
   * @returns {Map<string, {slots: Set<string>, zweit: Set<string>, idx: number[], zweitIdx: number[], proTag: Map<string, Set<number>>}>}
   */
  function lehrkraftStunden(stunden) {
    const m = new Map();
    stunden.forEach((s, i) => {
      if (!Index.STATUS.belegt(s)) return;
      (s.lehrkraefte || []).forEach((l, rolle) => {
        if (!m.has(l)) m.set(l, { slots: new Set(), zweit: new Set(), idx: [], zweitIdx: [], proTag: new Map() });
        const e = m.get(l);
        const slot = S(s.tag, s.stunde);
        e.slots.add(slot);
        e.idx.push(i);
        if (rolle > 0) { e.zweit.add(slot); e.zweitIdx.push(i); }
        if (!e.proTag.has(s.tag)) e.proTag.set(s.tag, new Set());
        e.proTag.get(s.tag).add(s.stunde);
      });
    });
    return m;
  }

  /** Anzahl Verstöße je Regel, z. B. { H1: 2, H12: 1 }. */
  function zaehle(verstoesse) {
    const m = {};
    for (const v of verstoesse) m[v.regel] = (m[v.regel] || 0) + 1;
    return m;
  }

  return { TITEL, pruefeHart, zaehle, lehrkraftStunden, laeufe, gruppiere };
})();

/* ---- src/kern/50-kosten.js ---- */
/* ==========================================================================
 * Modul Kosten
 * Bewertet einen Plan mit dem lexikografischen Kostenvektor
 * (K1, K1A, K2, K3, K4, K5, K6) aus Spezifikation §3. K6 ist die gewichtete
 * Summe der weichen Regeln W1–W12 (§4). Jeder Kostenanteil wird mit
 * Einzelposten begründet (§9 Nachvollziehbarkeit).
 * ========================================================================== */
const Kosten = (() => {
  'use strict';

  const ZIELE = Object.freeze(['K1', 'K1A', 'K2', 'K3', 'K4', 'K5', 'K6']);
  const ZIELTITEL = Object.freeze({
    K1: 'Unterrichtsausfall',
    K1A: 'unbesetzte Pausenaufsichten',
    K2: 'Stunden nicht durch die eigene Lehrkraft',
    K3: 'fachfremd erteilte Stunden',
    K4: 'Doppelbetreuung und Aufteilung',
    K5: 'ungenutztes Kontingent trotz möglicher Zweitbesetzung',
    K6: 'Planqualität (weiche Regeln)',
  });
  const WEICH = Object.freeze(['W1', 'W2', 'W3', 'W4', 'W5', 'W6', 'W7', 'W8', 'W9', 'W10', 'W11', 'W12']);
  const WTITEL = Object.freeze({
    W1: 'kompakter Schultag der Klassen',
    W2: 'Leerstunden bei Lehrkräften',
    W3: 'Doppelstunden wie gewünscht',
    W4: 'Hauptfächer vormittags, Sport nicht direkt nach der Pause',
    W5: 'gleichmäßige Verteilung eines Fachs',
    W6: 'wenige Raumwechsel, Heimatraum',
    W7: 'gleichmäßige Tageslast der Lehrkräfte',
    W8: 'Mindeststunden unterschritten',
    W9: 'Zweitbesetzung gezielt eingesetzt',
    W10: 'beständige Zweitbesetzung',
    W11: 'Aufsichtssoll erfüllt',
    W12: 'Aufsicht angrenzend an eigenen Unterricht',
  });

  const S = Index.schluessel;
  const rund = (x) => Math.round(x * 100) / 100;

  /**
   * @param {object} z Zustand
   * @param {{stunden?: object[], aufsichten?: object[]}} [plan] Standard: Regelplan
   * @param {{datum?: string, mitPosten?: boolean}} [optionen]
   *        datum: Tagesplan (Wochenziele K5, W7, W8, W11 entfallen)
   * @returns {{vektor: number[], ziele: object, weich: object}}
   */
  function bewerte(z, plan, optionen = {}) {
    const ix = Index.erstelle(z);
    const stunden = plan?.stunden ?? z.plan.regelplan;
    const aufsichten = plan?.aufsichten ?? z.plan.aufsichten;
    const woche = !optionen.datum;
    const mitPosten = optionen.mitPosten !== false;
    const n = ix.name;
    const e = ix.einstellungen;

    const ziele = Object.fromEntries(ZIELE.map((k) => [k, { titel: ZIELTITEL[k], wert: 0, posten: [] }]));
    const weich = Object.fromEntries(WEICH.map((w) => [w, { titel: WTITEL[w], anzahl: 0, gewicht: e.gewichte[w] ?? 0, beitrag: 0, posten: [] }]));
    const ziel = (k, menge, text) => {
      if (!menge) return;
      ziele[k].wert += menge;
      if (mitPosten) ziele[k].posten.push({ menge: rund(menge), text });
    };
    const w = (k, menge, text) => {
      if (!menge) return;
      weich[k].anzahl += menge;
      if (mitPosten) weich[k].posten.push({ menge: rund(menge), text });
    };

    const lehrer = Regeln.lehrkraftStunden(stunden);
    const proKlasseTag = Regeln.gruppiere(stunden, (s) => (Index.STATUS.belegt(s) ? S(s.klasse, s.tag) : null));
    const klassenSlot = new Set(stunden.filter(Index.STATUS.belegt).map((s) => S(s.tag, s.stunde)));

    /* ---------- K1: Unterrichtsausfall ---------- */
    const abgedeckt = new Map();
    for (const s of stunden) if (s.fach && Index.STATUS.abgedeckt(s)) abgedeckt.set(S(s.klasse, s.fach), (abgedeckt.get(S(s.klasse, s.fach)) || 0) + 1);
    for (const k of z.klassen) {
      for (const t of k.stundentafel) {
        const ist = abgedeckt.get(S(k.id, t.fach)) || 0;
        const fehlt = woche ? Math.max(0, t.stunden - ist) : 0;
        ziel('K1', fehlt, `${n.klasse(k.id)} ${n.fach(t.fach)}: ${fehlt} von ${t.stunden} Stunden fallen aus`);
      }
    }
    if (!woche) {
      // Im Tagesplan zählen ausdrücklich entfallene Stunden und Aufsichten
      for (const s of stunden) {
        if (!Index.STATUS.abgedeckt(s)) ziel('K1', 1, `${n.klasse(s.klasse)} ${n.slot(s.tag, s.stunde)} Stunde: ${s.status === 'aufsicht' ? 'nur Aufsicht' : 'entfällt'}`);
      }
    }

    /* ---------- K1A: unbesetzte Pausenaufsichten ---------- */
    const besetzt = new Map();
    for (const a of aufsichten) {
      const k = S(a.tag, a.vorStunde);
      if (!besetzt.has(k)) besetzt.set(k, new Set());
      besetzt.get(k).add(a.lehrkraft);
    }
    const tage = woche ? ix.tage : [...new Set(stunden.map((s) => s.tag))];
    for (const tag of tage) {
      for (const p of ix.pausen) {
        if (!p.aufsichten) continue;
        // Bedarf nur, wenn nach der Pause Schüler:innen da sind (Annahme: mindestens eine Klasse hat diese Stunde)
        if (!klassenSlot.has(S(tag, p.vorStunde))) continue;
        const fehlt = Math.max(0, p.aufsichten - (besetzt.get(S(tag, p.vorStunde))?.size || 0));
        ziel('K1A', fehlt, `${n.pause(tag, p.vorStunde)}: ${fehlt} von ${p.aufsichten} Aufsichten unbesetzt`);
      }
    }

    /* ---------- K2, K3, K4: je Stunde ---------- */
    for (const s of stunden) {
      const wo = `${n.klasse(s.klasse)} ${n.slot(s.tag, s.stunde)} Stunde ${n.fach(s.fach)}`;
      const haupt = s.lehrkraefte?.[0];
      if (haupt && s.fach && (Index.STATUS.fachunterricht(s) || s.status === 'doppeltBetreut')) {
        const zu = ix.zuordnungVon(s.klasse, s.fach);
        if (zu.haupt !== haupt && !zu.zweit.includes(haupt)) {
          const klasse = ix.klassen.get(s.klasse);
          const art = klasse?.klassenlehrkraft === haupt ? 'Klassenlehrkraft'
            : ix.lehrkraefteDerKlasse.get(s.klasse)?.has(haupt) ? 'Lehrkraft der Klasse'
              : ix.istQualifiziert(haupt, s.fach, klasse?.stufe) ? 'qualifizierte Lehrkraft' : 'Notfalleinsatz';
          ziel('K2', 1, `${wo}: ${n.lehrkraft(haupt)} (${art}) statt ${zu.haupt ? n.lehrkraft(zu.haupt) : 'ohne Festzuordnung'}`);
        }
      }
      if (haupt && s.fach && Index.STATUS.fachunterricht(s) && !ix.istQualifiziert(haupt, s.fach, ix.klassen.get(s.klasse)?.stufe)) {
        ziel('K3', 1, `${wo}: ${n.lehrkraft(haupt)} unterrichtet fachfremd`);
      }
      if (s.status === 'doppeltBetreut') ziel('K4', 1, `${wo}: Doppelbetreuung mit ${n.klasse(s.mitKlasse)}`);
      if (s.status === 'aufgeteilt') ziel('K4', e.gewichtAufteilung, `${wo}: Klasse aufgeteilt (Gewicht ${e.gewichtAufteilung})`);
    }

    /* ---------- K5: ungenutztes Kontingent trotz möglicher Zweitbesetzung ---------- */
    if (woche && e.zweitbesetzungErlaubt) {
      // Slots mit Unterricht, in denen noch eine Zweitbesetzung Platz hat (H10)
      const freiFuerZweit = new Set(stunden
        .filter((s) => Index.STATUS.fachunterricht(s) && (s.lehrkraefte?.length || 0) < e.maxLehrkraefteProKlasseUndSlot)
        .map((s) => S(s.tag, s.stunde)));
      for (const l of z.lehrkraefte) {
        const info = lehrer.get(l.id);
        const ist = info?.slots.size || 0;
        const luecke = Math.max(0, Math.min(l.sollStunden - ix.reserve(l), l.maxStunden) - ist);
        if (!luecke) continue;
        let moeglich = 0;
        for (const slot of freiFuerZweit) {
          const [tag, st] = slot.split('|');
          if (!info?.slots.has(slot) && !ix.lehrkraftGesperrt(l.id, tag, Number(st))) moeglich++;
        }
        const k5 = Math.min(luecke, moeglich);
        ziel('K5', k5, `${n.lehrkraft(l.id)}: ${ist} von ${l.sollStunden} Stunden (Reserve ${ix.reserve(l)}), ${k5} weitere als Zweitbesetzung möglich`);
      }
    }

    /* ---------- W1: kompakter Schultag ---------- */
